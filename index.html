<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KoreaVFR_v2.15</title>

  <link
    href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    /* iPad / touch optimization */
    #map, .maplibregl-canvas-container, .maplibregl-canvas {
      touch-action: none;
    }

    button, input, .route-point-wrap {
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: coarse) {
      .nav-control-btn {
        width: 52px;
        height: 52px;
      }

      .route-point-dot {
        min-width: 32px;
        height: 32px;
        border-radius: 17px;
        font-size: 13px;
        line-height: 28px;
      }

      .route-point-coords {
        padding: 7px 8px;
        font-size: 12px;
      }

      .leg-label-distance,
      .leg-label-bearing {
        font-size: 9.5px;
        font-weight: 400;
      }

      .route-info-tab,
      .new-route-tab {
        min-height: 48px;
      }

      .popup-btn,
      .same-point-btn,
      .route-delete-btn {
        min-height: 44px;
      }
    }
    .maplibregl-ctrl-attrib { font-size: 10px; }

    .route-point-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .route-point-wrap:active {
      cursor: grabbing;
    }

    .route-point-dot {
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 13px;
      background: rgba(255,255,255,0.97);
      border: 2px solid rgba(0,0,0,0.9);
      color: #111;
      font: 700 12px/20px Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .route-point-coords {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font: 600 11px/1.2 Arial, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    .route-point-name {
      display: block;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.2;
    }

    .route-point-altitude-map {
      display: block;
      margin-top: 2px;
      color: #fff;
      font-weight: 500;
      font-size: 11px;
      line-height: 1.15;
    }

    /* Map leg label: pentagon arrow badge sitting directly on route line. */
    .leg-label {
      width: 56px;
      height: 28px;
      opacity: .8;
      color: #fff;
      user-select: none;
      pointer-events: none;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
    }

    .leg-arrow-badge {
      position: relative;
      width: 50px;
      height: 24px;
      transform-origin: 50% 50%;
    }

    .leg-badge-outline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .leg-label-content {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(100% - 8px);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transform-origin: 50% 50%;
      text-align: center;
    }

    .leg-label-distance,
    .leg-label-bearing {
      position: relative;
      z-index: 1;
      font-size: 8px;
      line-height: 1;
      font-weight: 400;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
    }

    .point-popup {
      position: absolute;
      z-index: 20;
      min-width: 220px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(22,22,22,0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      font: 13px/1.4 Arial, sans-serif;
    }

    .point-popup[hidden] { display: none; }

    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .popup-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
    }

    .popup-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .popup-input:focus {
      border-color: rgba(255,255,255,0.75);
    }

    .popup-actions {
      display: flex;
      gap: 8px;
    }

    .popup-btn {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .popup-save {
      background: #fff;
      color: #111;
    }

    .popup-delete {
      background: rgba(220,55,55,0.95);
      color: #fff;
    }

    .drag-hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.25);
      font: 12px Arial, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .drag-hint.show { opacity: 1; }

    /* ===== Route Info top panel ===== */
    .route-info-shell {
      position: absolute;
      z-index: 30;
      top: 0;
      left: 50%;
      width: min(96vw, 1380px);
      transform: translateX(-50%);
      transition: transform .22s ease;
      pointer-events: none;
    }

    .route-info-shell.hidden {
      display: none;
    }

    .route-info-shell.collapsed {
      transform: translate(-50%, calc(-100% + 38px));
    }

    .route-info-panel {
      pointer-events: auto;
      background:
        linear-gradient(180deg, rgba(42,88,164,.97) 0%, rgba(30,69,139,.97) 100%);
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.30);
      backdrop-filter: blur(8px);
      color: #fff;
      overflow: hidden;
    }

    .route-info-head {
      display: grid;
      grid-template-columns: minmax(160px, 0.9fr) minmax(360px, 2.8fr) minmax(160px, 0.9fr);
      gap: 12px;
      align-items: start;
      padding: 14px 18px 10px;
    }

    .route-end {
      min-width: 0;
    }

    .route-section-label {
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-end-name {
      font: 700 19px/1.1 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-to {
      text-align: right;
    }

    .route-via-wrap {
      min-width: 0;
    }

    .route-via-title {
      text-align: center;
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-strip {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.45) transparent;
    }

    .route-strip-inner {
      display: flex;
      align-items: center;
      width: max-content;
      min-width: max-content;
      margin-left: auto;
      margin-right: auto;
    }

    .route-strip::-webkit-scrollbar {
      height: 5px;
    }

    .route-strip::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.38);
      border-radius: 999px;
    }

    .route-node-card {
      flex: 0 0 auto;
      min-width: 90px;
      max-width: 150px;
      text-align: center;
      font: 700 15px/1.2 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
    }

    .route-node-stack {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .route-point-altitude {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .route-point-altitude-input {
      width: 72px;
      height: 30px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 6px;
      padding: 0 7px;
      background: rgba(5,16,38,.70);
      color: #fff;
      font: 700 13px/1 Arial, sans-serif;
      text-align: right;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .route-point-altitude-input:focus {
      border-color: rgba(255,255,255,.95);
      background: rgba(4,18,46,.88);
    }

    .route-point-altitude-input.invalid {
      border-color: rgba(255,110,110,.98);
      background: rgba(115,20,20,.55);
    }

    .route-point-altitude-unit {
      font: 700 10px/1 Arial, sans-serif;
      letter-spacing: .04em;
      opacity: .82;
    }

    .route-end-altitude {
      margin-top: 9px;
      display: flex;
      justify-content: flex-start;
    }

    .route-end-altitude-right {
      justify-content: flex-end;
    }

    @media (pointer: coarse) {
      .route-point-altitude-input {
        width: 82px;
        height: 38px;
        font-size: 16px;
      }
    }

    .route-leg-mini {
      flex: 0 0 auto;
      width: 128px;
      padding: 0 8px;
      display: grid;
      grid-template-rows: 18px 12px 18px;
      align-items: center;
      justify-items: center;
      box-sizing: border-box;
    }

    .route-leg-distance,
    .route-leg-bearing {
      font: 700 11px/1 Arial, sans-serif;
      opacity: .95;
      white-space: nowrap;
    }

    .route-leg-line {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,.78);
      position: relative;
    }

    .route-leg-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -3px;
      border-left: 7px solid rgba(255,255,255,.95);
      border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent;
    }

    .route-info-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 2px 16px 12px;
      font: 700 14px/1 Arial, sans-serif;
      opacity: .95;
    }

    .route-foot-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex-wrap: wrap;
    }


    .route-info-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 38px;
      margin: -1px auto 0;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background:
        linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/38px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-info-tab::after {
      content: "▲";
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      opacity: .8;
      transition: transform .2s ease;
    }

    .route-info-shell.collapsed .route-info-tab::after {
      transform: rotate(180deg);
    }

    @media (max-width: 760px) {
      .route-info-shell {
        width: 100%;
      }

      .route-info-panel {
        border-radius: 0 0 10px 10px;
      }

      .route-info-head {
        grid-template-columns: 110px minmax(200px, 1fr) 110px;
        gap: 8px;
        padding: 11px 10px 8px;
      }

      .route-end-name {
        font-size: 15px;
      }

      .route-node-card {
        min-width: 74px;
        font-size: 13px;
      }

      .route-leg-mini {
        width: 106px;
      }
    }


    .new-route-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 40px;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/40px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-delete-btn {
      margin-left: 8px;
      border: 1px solid rgba(255,255,255,.32);
      background: rgba(180,35,35,.9);
      color: #fff;
      border-radius: 7px;
      padding: 7px 12px;
      font: 700 12px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .route-info-foot {
      justify-content: flex-end;
    }

    .route-total-wrap {
      margin-left: auto;
    }

    .same-point-btn {
      width: 100%;
      margin: 0 0 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 6px;
      background: rgba(70,120,210,.95);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .same-point-btn[hidden] { display: none; }

    /* ===== Aircraft / navigation controls ===== */
    .aircraft-marker {
      width: 180px;
      height: 52px;
      position: relative;
      pointer-events: none;
      overflow: visible;
    }

    .aircraft-marker svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .aircraft-symbol-tilt {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 40px;
      height: 40px;
      transform: translateX(-50%);
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      perspective: 420px;
      overflow: visible;
    }

    .aircraft-symbol {
      position: absolute;
      inset: 0;
      width: 40px;
      height: 40px;
      transform-origin: 50% 50%;
      transform-box: fill-box;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.72));
      backface-visibility: visible;
    }

    .aircraft-altitude-stem {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 10px;
      height: 0;
      border-radius: 999px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.92),
        rgba(193,206,224,.94) 55%,
        rgba(125,144,168,.96)
      );
      box-shadow:
        0 0 0 1px rgba(255,255,255,.22),
        0 4px 10px rgba(0,0,0,.22);
      opacity: 0;
    }

    .aircraft-ground-anchor {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 18px;
      height: 12px;
      transform: translateX(-50%);
      opacity: 0;
    }

    .aircraft-ground-anchor::before,
    .aircraft-ground-anchor::after {
      content: "";
      position: absolute;
      bottom: 1px;
      width: 11px;
      height: 0;
      border-top: 4px solid rgba(18,23,30,.92);
      filter: drop-shadow(0 1px 1px rgba(255,255,255,.18));
    }

    .aircraft-ground-anchor::before {
      right: 50%;
      transform-origin: right center;
      transform: rotate(38deg);
    }

    .aircraft-ground-anchor::after {
      left: 50%;
      transform-origin: left center;
      transform: rotate(-38deg);
    }

    .aircraft-altitude-card {
      position: absolute;
      left: calc(50% + 18px);
      bottom: 20px;
      min-width: 94px;
      padding: 6px 8px 7px;
      border-radius: 10px;
      background: rgba(16, 22, 31, .84);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,.12);
      opacity: 0;
    }

    .aircraft-alt-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      white-space: nowrap;
      line-height: 1.15;
    }

    .aircraft-alt-row + .aircraft-alt-row {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .aircraft-alt-k {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .05em;
      color: rgba(219,228,240,.82);
    }

    .aircraft-alt-v {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .01em;
      color: #fff;
    }

    .compass-face {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-rotor {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
    }

    .nav-controls {
      position: absolute;
      z-index: 25;
      right: 16px;
      bottom: 26px;
      display: flex;
      flex-direction: row;
      gap: 9px;
      align-items: center;
    }

    .nav-control-btn {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 10px;
      background: rgba(20,28,40,.88);
      color: #fff;
      box-shadow: 0 5px 16px rgba(0,0,0,.32);
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .nav-control-btn:hover {
      background: rgba(31,45,65,.95);
    }

    .nav-control-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-control-btn.heading-active {
      background: rgba(34,84,165,.96);
      border-color: rgba(255,255,255,.72);
    }

    .nav-control-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }


    .airport-popup .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.94);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 14px 28px rgba(0,0,0,0.28);
      min-width: 190px;
    }

    .airport-popup .maplibregl-popup-close-button {
      color: rgba(255,255,255,0.78);
      font-size: 20px;
      right: 8px;
      top: 4px;
    }

    .airport-popup .airport-popup-title-ko {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .airport-popup .airport-popup-title-en {
      font-size: 13px;
      color: rgba(255,255,255,0.84);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .airport-popup .airport-popup-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      line-height: 1.35;
    }

    .airport-popup .airport-popup-label {
      min-width: 38px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    .airport-dom-marker {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .airport-dom-marker img {
      display: block;
      width: 34px;
      height: auto;
      max-height: 42px;
      object-fit: contain;
      pointer-events: none;
      transform: none !important;
    }

    .airport-dom-marker.is-hidden {
      display: none;
    }


    .airport-popup .airport-popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .airport-popup .airport-popup-action {
      min-height: 38px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 9px;
      color: #fff;
      font: 700 12px/1.15 Arial, sans-serif;
      cursor: pointer;
      padding: 8px 9px;
      -webkit-tap-highlight-color: transparent;
    }

    .airport-popup .airport-popup-action.departure {
      background: rgba(32, 104, 214, .92);
    }

    .airport-popup .airport-popup-action.destination {
      background: rgba(34, 148, 91, .92);
    }

    .airport-popup .airport-popup-action:active {
      transform: translateY(1px);
