    const AIRPORT_LAYER_CONFIG = {
      popupClassName: "airport-popup",
      yellowHideBelowZoom: 10,
      iconUrls: {
        civil: "./assets/airport_civil_blue.png",
        military: "./assets/airport_military_green.png",
        other: "./assets/airport_other_yellow.png"
      }
    };

    const airportDomMarkers = [];
    let activeAirportPopup = null;



    function airportFeatureToRoutePoint(feature) {
      const props = feature.properties || {};
      const [longitude, latitude] = feature.geometry.coordinates;

      return {
        id: nextPointId++,
        name: String(props.nameKo || "").trim(),
        altitudeMslFeet: 0,
        longitude: Number(longitude),
        latitude: Number(latitude)
      };
    }

    function clearRouteForAirportEndpointSelection() {
      route = [];
      pendingDestinationAirport = null;
      clearPointMarkers();
      clearLegMarkers();
      updateRouteSource();
      setPreview([]);
      refreshRoute3D();
      closePointPopup();
      sameOriginDestination = false;

      routeModeActive = true;
      routeInfoShell.classList.remove("collapsed");
      newRouteShell.classList.add("hidden");
      routeInfoShell.classList.remove("hidden");
    }

    function setAirportAsDeparture(feature) {
      if (route.length >= 2) {
        clearRouteForAirportEndpointSelection();
      } else {
        routeModeActive = true;
        sameOriginDestination = false;
      }

      const departure = airportFeatureToRoutePoint(feature);

      if (pendingDestinationAirport) {
        const destinationFeature = pendingDestinationAirport;
        pendingDestinationAirport = null;
        route = [
          departure,
          airportFeatureToRoutePoint(destinationFeature)
        ];
      } else if (route.length === 1) {
        route[0] = departure;
      } else {
        route = [departure];
      }

      renderRoute({ autoOpen: true });
    }

    function setAirportAsDestination(feature) {
      if (route.length >= 2) {
        clearRouteForAirportEndpointSelection();
      } else {
        routeModeActive = true;
        sameOriginDestination = false;
      }

      if (route.length === 1) {
        route.push(airportFeatureToRoutePoint(feature));
        pendingDestinationAirport = null;
        renderRoute({ autoOpen: true });
        return;
      }

      pendingDestinationAirport = feature;
      renderRoute({ autoOpen: true });
    }

    function buildAirportPopupContent(feature) {
      const props = feature.properties || {};
      const root = document.createElement("div");

      const titleKo = document.createElement("div");
      titleKo.className = "airport-popup-title-ko";
      titleKo.textContent = props.nameKo || "";

      const titleEn = document.createElement("div");
      titleEn.className = "airport-popup-title-en";
      titleEn.textContent = props.nameEn || "";

      const row = document.createElement("div");
      row.className = "airport-popup-row";

      const label = document.createElement("div");
      label.className = "airport-popup-label";
      label.textContent = "ICAO";

      const value = document.createElement("div");
      value.textContent = props.icao || "";

      row.appendChild(label);
      row.appendChild(value);

      const actions = document.createElement("div");
      actions.className = "airport-popup-actions";

      const departureBtn = document.createElement("button");
      departureBtn.type = "button";
      departureBtn.className = "airport-popup-action departure";
      departureBtn.textContent = "출발지 설정";

      const destinationBtn = document.createElement("button");
      destinationBtn.type = "button";
      destinationBtn.className = "airport-popup-action destination";
      destinationBtn.textContent = "도착지 설정";

      departureBtn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setAirportAsDeparture(feature);
        if (activeAirportPopup) {
          activeAirportPopup.remove();
          activeAirportPopup = null;
        }
      });

      destinationBtn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setAirportAsDestination(feature);
        if (activeAirportPopup) {
          activeAirportPopup.remove();
          activeAirportPopup = null;
        }
      });

      actions.appendChild(departureBtn);
      actions.appendChild(destinationBtn);

      root.appendChild(titleKo);
      root.appendChild(titleEn);
      root.appendChild(row);
      root.appendChild(actions);
      return root;
    }

    function showAirportPopup(feature) {
      if (activeAirportPopup) {
        activeAirportPopup.remove();
        activeAirportPopup = null;
      }

      const coordinates = feature.geometry.coordinates.slice();
      const popup = new maplibregl.Popup({
        closeButton: true,
        closeOnClick: true,
        className: AIRPORT_LAYER_CONFIG.popupClassName,
        offset: 18,
        maxWidth: "300px"
      })
        .setLngLat(coordinates)
        .setDOMContent(buildAirportPopupContent(feature))
        .addTo(map);

      activeAirportPopup = popup;

      popup.on("close", () => {
        if (activeAirportPopup === popup) {
          activeAirportPopup = null;
        }
      });
    }

    function updateAirportMarkerVisibility() {
      const zoom = map.getZoom();

      for (const item of airportDomMarkers) {
        const hide =
          item.iconGroup === "other" &&
          zoom < AIRPORT_LAYER_CONFIG.yellowHideBelowZoom;

        item.element.classList.toggle("is-hidden", hide);
      }
    }

    function makeAirportDomMarker(feature) {
      const props = feature.properties || {};
      const iconGroup = props.iconGroup;
      const coordinates = feature.geometry.coordinates;

      const element = document.createElement("div");
      element.className = "airport-dom-marker";
      element.setAttribute("role", "button");
      element.setAttribute(
        "aria-label",
        `${props.nameKo ?? ""} ${props.icao ?? ""}`
      );
      element.title = `${props.nameKo ?? ""} / ${props.nameEn ?? ""} / ${props.icao ?? ""}`;

      const img = document.createElement("img");
      img.alt = "";
      img.src = AIRPORT_LAYER_CONFIG.iconUrls[iconGroup] ||
        AIRPORT_LAYER_CONFIG.iconUrls.other;

      element.appendChild(img);

      let pressStart = 0;
      let pressMoved = false;
      let startX = 0;
      let startY = 0;

      element.addEventListener("touchstart", (event) => {
        const touch = event.touches?.[0];
        if (!touch) return;

        pressStart = performance.now();
        pressMoved = false;
        startX = touch.clientX;
        startY = touch.clientY;

        // Prevent map route creation / drag from starting under the icon.
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("touchmove", (event) => {
        const touch = event.touches?.[0];
        if (!touch) return;

        if (Math.hypot(touch.clientX - startX, touch.clientY - startY) > 10) {
          pressMoved = true;
        }
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("touchend", (event) => {
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (longPressSuppressed()) return;

        // Guard against a long stationary touch synthesized as click.
        if (pressStart > 0 && !pressMoved &&
            performance.now() - pressStart >= LONG_PRESS_MS) {
          return;
        }

        showAirportPopup(feature);
      });

      element.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        event.stopPropagation();
      });

      const marker = new maplibregl.Marker({
        element,
        anchor: "bottom",
        rotationAlignment: "viewport",
        pitchAlignment: "viewport"
      })
        .setLngLat(coordinates)
        .addTo(map);

      return {
        marker,
        element,
        feature,
        iconGroup
      };
    }

    async function ensureAirportLayers() {
      if (airportDomMarkers.length > 0) {
        updateAirportMarkerVisibility();
        return;
      }

      for (const feature of AIRPORT_POINTS_GEOJSON.features) {
        airportDomMarkers.push(makeAirportDomMarker(feature));
      }

      map.on("zoom", updateAirportMarkerVisibility);
      updateAirportMarkerVisibility();

      map.__airportLayersReady = true;
    }

    function getAirportLayerStatus() {
      const counts = AIRPORT_POINTS_GEOJSON.features.reduce((acc, feature) => {
        const key = feature.properties.iconGroup;
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});

      return {
        ready: !!map.__airportLayersReady,
        rendering: "DOM markers",
        totalAirportsWithCoordinates: AIRPORT_POINTS_GEOJSON.features.length,
        countsByIconGroup: counts,
        visibleRules: {
          yellowOtherVisibleAtOrAbove:
            AIRPORT_LAYER_CONFIG.yellowHideBelowZoom,
          civilAlwaysVisible: true,
          militaryAlwaysVisible: true
        }
      };
    }

    function aircraftDeclination() {
      return declination(aircraft.latitude, aircraft.longitude);
    }

    function aircraftTrueHeading() {
      // true = magnetic + easterly variation (west is negative)
      const variation = aircraftDeclination();
      return variation == null ? null : norm(aircraft.magneticHeading + variation);
    }

    function aircraftScreenRotation() {
      // Aircraft must always visually point toward its actual travel direction,
      // regardless of map rotation.
      const heading = aircraftTrueHeading();
      return heading == null ? null : norm(heading - map.getBearing());
    }

    function feetToMeters(feet) {
      return Number(feet) * 0.3048;
    }

    function aircraftTerrainMslFeet() {
      const meters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      return meters == null ? null : meters * 3.28084;
    }

    function aircraftAglFeet() {
      const terrainFeet = aircraftTerrainMslFeet();
      if (terrainFeet == null) return null;
      return aircraft.altitudeMslFeet - terrainFeet;
    }

    function formatFeetValue(value) {
      if (value == null || !Number.isFinite(value)) return "---";
      return `${Math.round(value).toLocaleString()} ft`;
    }

    function extractProjectionMatrix(matrixLike) {
      if (!matrixLike) return null;

      // MapLibre 6 custom-layer official render input.
      if (matrixLike.defaultProjectionData?.mainMatrix) {
        return matrixLike.defaultProjectionData.mainMatrix;
      }

      // Backward-compatible fallbacks used by older prototype code.
      if (Array.isArray(matrixLike) || ArrayBuffer.isView(matrixLike)) {
        return matrixLike;
      }
      if (matrixLike.mainMatrix) return matrixLike.mainMatrix;
      if (matrixLike.projectionMatrix) return matrixLike.projectionMatrix;

      return null;
    }

    function projectMercatorCoordinate(merc, matrixLike = aircraftProjectionMatrix) {
      const matrix = extractProjectionMatrix(matrixLike);
      if (!matrix) return null;

      const x = merc.x;
      const y = merc.y;
      const z = merc.z ?? 0;
      const w0 = 1;

      const clipX = matrix[0] * x + matrix[4] * y + matrix[8]  * z + matrix[12] * w0;
      const clipY = matrix[1] * x + matrix[5] * y + matrix[9]  * z + matrix[13] * w0;
      const clipW = matrix[3] * x + matrix[7] * y + matrix[11] * z + matrix[15] * w0;

      if (!Number.isFinite(clipX) || !Number.isFinite(clipY) || !Number.isFinite(clipW) || Math.abs(clipW) < 1e-9) {
        return null;
      }

      const ndcX = clipX / clipW;
      const ndcY = clipY / clipW;

      const width = map.getContainer().clientWidth;
      const height = map.getContainer().clientHeight;

      return {
        x: (ndcX * 0.5 + 0.5) * width,
        y: (-ndcY * 0.5 + 0.5) * height,
        clipW
      };
    }

    function projectLngLatAltitude(longitude, latitude, altitudeMeters, matrixLike = aircraftProjectionMatrix) {
      const merc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        Number(altitudeMeters)
      );
      return projectMercatorCoordinate(merc, matrixLike);
    }

    function updateAircraftMarkerVisuals(matrixLike = aircraftProjectionMatrix) {
      if (!aircraftMarker) return;
      const el = aircraftMarker.getElement();
      const symbolTilt = el.querySelector(".aircraft-symbol-tilt");
      const symbol = el.querySelector(".aircraft-symbol");
      const stem = el.querySelector(".aircraft-altitude-stem");
      const card = el.querySelector(".aircraft-altitude-card");
      const ground = el.querySelector(".aircraft-ground-anchor");
      const mslValue = el.querySelector(".aircraft-msl-value");
      const aglValue = el.querySelector(".aircraft-agl-value");
      if (!symbolTilt || !symbol || !stem || !card || !ground || !mslValue || !aglValue) return;

      const rotation = aircraftScreenRotation();
      symbol.style.visibility = rotation == null ? "hidden" : "visible";
      document.getElementById("magneticStatus").textContent = rotation == null
        ? "MAG UNKNOWN — 방향·이동 시뮬레이션 중지"
        : "가상 비행 중 · 실제 GPS 아님";
      mslValue.textContent = formatFeetValue(aircraft.altitudeMslFeet);
      aglValue.textContent = formatFeetValue(aircraftAglFeet());

      const terrainMeters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      const aircraftMetersMsl = feetToMeters(aircraft.altitudeMslFeet);

      const groundPoint = terrainMeters == null
        ? null
        : projectLngLatAltitude(aircraft.longitude, aircraft.latitude, terrainMeters, matrixLike);

      const aircraftPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        aircraftMetersMsl,
        matrixLike
      );

      // If DEM or projection data is not ready yet, keep the card visible
      // but do not invent a pillar length.
      if (!groundPoint || !aircraftPoint) {
        el.style.height = "52px";
        symbolTilt.style.left = "50%";
        symbolTilt.style.bottom = "0px";
        symbolTilt.style.transform =
          `translateX(-50%) perspective(420px) rotateX(${map.getPitch()}deg)`;
        symbol.style.transform = `rotate(${rotation ?? 0}deg)`;
        stem.style.opacity = "0";
        stem.style.height = "0px";
        ground.style.opacity = "0";
        card.style.opacity = "1";
        card.style.left = "calc(50% + 18px)";
        card.style.bottom = "18px";
        return;
      }

      const dx = aircraftPoint.x - groundPoint.x;
      const dy = groundPoint.y - aircraftPoint.y;
      const distancePx = Math.sqrt(dx * dx + dy * dy);
      const angleDeg = Math.atan2(dx, dy) * 180 / Math.PI;

      const clampedBottom = Math.max(0, dy);
      const visible = distancePx >= 1;

      el.style.height = `${Math.max(52, 48 + clampedBottom)}px`;

      symbolTilt.style.left = `calc(50% + ${dx}px)`;
      symbolTilt.style.bottom = `${clampedBottom}px`;

      // The aircraft icon represents a horizontal aircraft body.
      // As map pitch increases (lower viewing angle), visually tilt the icon
      // away from the viewer while preserving heading rotation independently.
      const pitch = map.getPitch();
      symbolTilt.style.transform =
        `translateX(-50%) perspective(420px) rotateX(${pitch}deg)`;
      symbol.style.transform = `rotate(${rotation ?? 0}deg)`;

      stem.style.height = `${Math.max(0, distancePx - 10)}px`;
      stem.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;
      stem.style.opacity = visible ? "0.96" : "0";

      ground.style.opacity = visible ? "1" : "0";

      card.style.opacity = "1";
      card.style.left = `calc(50% + ${dx + 18}px)`;
      card.style.bottom = `${visible ? Math.max(18, clampedBottom * 0.58) : 18}px`;
    }

    function updateAircraftMarkerRotation() {
      updateAircraftMarkerVisuals();
    }

    function ensureAircraftProjectionLayer() {
      if (map.getLayer("aircraft-overlay-sync")) return;

      map.addLayer({
        id: "aircraft-overlay-sync",
        type: "custom",
        renderingMode: "3d",
        onAdd() {},

        render(gl, matrixLike) {
          aircraftProjectionMatrix = extractProjectionMatrix(matrixLike);
          updateAircraftMarkerVisuals(aircraftProjectionMatrix);
          updateAllLegBadgeRotations();
        }
      });
    }


    const route3DLayerState = {
      disabled: false,
      error: null,
      curtainProgram: null,
      airProgram: null,
      curtainBuffer: null,
      verticalBuffer: null,
      airBuffer: null,
      heightMap: null,
      heightMapReady: false,
      bounds: null,
      routeSignature: null,
      curtainVertices: new Float32Array(),
      verticalVertices: new Float32Array(),
      airVertices: new Float32Array()
    };

    // v47 terrain-height-map architecture.
    // Terrain heights for the curtain are sampled by the GPU directly from
    // MapLibre's rendered terrain height texture.
    const TOP_VIEW_PITCH_THRESHOLD_DEG = 0.1;
    const CURTAIN_SEGMENT_NM = 0.02; // tessellation only; no CPU DEM lookup
    const CURTAIN_VERTICAL_INTERVAL_NM = 1.0;
    const AIR_ROUTE_HALF_WIDTH_PX = 3.5; // ~7 px total
    const CURTAIN_ALPHA = 0.30; // 70% transparency
    const HEIGHTMAP_SIZE = 1024;

    function compileRoute3DShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message =
          gl.getShaderInfoLog(shader) ||
          "Unknown shader compile error";
        gl.deleteShader(shader);
        throw new Error(message);
      }

      return shader;
    }

    function linkRoute3DProgram(gl, vertexSource, fragmentSource) {
      const vs = compileRoute3DShader(gl, gl.VERTEX_SHADER, vertexSource);
      const fs = compileRoute3DShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);

      gl.deleteShader(vs);
      gl.deleteShader(fs);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const message =
          gl.getProgramInfoLog(program) ||
          "Unknown route 3D program link error";
        gl.deleteProgram(program);
        throw new Error(message);
      }

      return program;
    }

    function routePointAltitudeFeet(point) {
      const value = Number(point?.altitudeMslFeet);
      return Number.isFinite(value) ? value : null;
    }

    function setRoutePointAltitudeMslFeet(
      pointId,
      value,
      inputElement = null,
      { rerender = false } = {}
    ) {
      const pointIndex = route.findIndex(p => p.id === pointId);
      if (pointIndex < 0) return false;

      if (value === "" || value == null) {
        if (inputElement) inputElement.classList.remove("invalid");
        return true;
      }

      const altitude = Number(value);

      if (!Number.isFinite(altitude) || altitude < 0 || altitude > 60000) {
        if (inputElement) inputElement.classList.add("invalid");
        return false;
      }

      // Only VIA points inherit forward changes. Endpoints stay independent.
      route[pointIndex].altitudeMslFeet = altitude;
      for (let i = pointIndex + 1; i < route.length - 1; i++) {
        route[i].altitudeMslFeet = altitude;
      }

      if (inputElement) inputElement.classList.remove("invalid");

      syncVisibleRouteAltitudeInputs(pointIndex + 1);
      syncRouteAltitudeLabels();
      updateAllLegBadgeRotations();
      invalidateRoute3DGeometry();
      refreshRoute3D();

      if (rerender) updateRouteInfo();
      return true;
    }

    function interpolateRouteLocation(a, b, fraction) {
      if (fraction <= 0) {
        return { latitude: a.latitude, longitude: a.longitude };
      }

      if (fraction >= 1) {
        return { latitude: b.latitude, longitude: b.longitude };
      }

      const distanceMeters = gcDistanceMeters(a, b);
      const bearing = trueBearing(a, b);

      return destinationPoint(
        a.latitude,
        a.longitude,
        bearing,
        distanceMeters * fraction
      );
    }

    function mercatorData(longitude, latitude, altitudeMeters = 0) {
      const merc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        Number(altitudeMeters)
      );

      const ground = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        0
      );

      return {
        x: merc.x,
        y: merc.y,
        z: merc.z,
        meterScale: ground.meterInMercatorCoordinateUnits()
      };
    }

    function routeGeometrySignature() {
      return JSON.stringify(
        route.map(point => [
          point.id,
          Number(point.latitude),
          Number(point.longitude),
          routePointAltitudeFeet(point)
        ])
      );
    }

    function invalidateRoute3DGeometry() {
      route3DLayerState.routeSignature = null;
      route3DLayerState.bounds = null;
      route3DLayerState.heightMapReady = false;
    }

    function pushCurtainVertex(
      target,
      x,
      y,
      airZ,
      airMeters,
      meterScale,
      groundFlag
    ) {
      target.push(
        x,
        y,
        airZ,
        airMeters,
        meterScale,
        groundFlag
      );
    }

    function pushAirRibbonVertex(target, base, other, side, airMeters) {
      target.push(
        base.x,
        base.y,
        base.z,
        other.x,
        other.y,
        other.z,
        side,
        airMeters
      );
    }

    function buildAirRibbonGeometry() {
      const vertices = [];

      // Only route points + their MSL values define the magenta route.
      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i];
        const b = route[i + 1];

        const altAFeet = routePointAltitudeFeet(a);
        const altBFeet = routePointAltitudeFeet(b);

        if (altAFeet == null || altBFeet == null) continue;

        const altAMeters = altAFeet * 0.3048;
        const altBMeters = altBFeet * 0.3048;

        const p = mercatorData(
          a.longitude,
          a.latitude,
          altAMeters
        );
        const q = mercatorData(
          b.longitude,
          b.latitude,
          altBMeters
        );

        // Two triangles per route segment; shader extrudes in screen space.
        pushAirRibbonVertex(vertices, p, q, -1, altAMeters);
        pushAirRibbonVertex(vertices, p, q, +1, altAMeters);
        pushAirRibbonVertex(vertices, q, p, +1, altBMeters);

        pushAirRibbonVertex(vertices, p, q, -1, altAMeters);
        pushAirRibbonVertex(vertices, q, p, +1, altBMeters);
        pushAirRibbonVertex(vertices, q, p, -1, altBMeters);
      }

      return new Float32Array(vertices);
    }

    function buildCurtainGeometry() {
      const curtainVertices = [];
      const verticalVertices = [];

      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i];
        const b = route[i + 1];

        const altAFeet = routePointAltitudeFeet(a);
        const altBFeet = routePointAltitudeFeet(b);

        if (altAFeet == null || altBFeet == null) continue;

        const distanceNM = gcDistanceMeters(a, b) / M_PER_NM;

        const segmentCount = Math.max(
          1,
          Math.min(
            4096,
            Math.ceil(distanceNM / CURTAIN_SEGMENT_NM)
          )
        );

        const samples = [];

        for (let s = 0; s <= segmentCount; s++) {
          const t = s / segmentCount;
          const ll = interpolateRouteLocation(a, b, t);

          const airFeet =
            altAFeet + (altBFeet - altAFeet) * t;
          const airMeters = airFeet * 0.3048;

          const m = mercatorData(
            ll.longitude,
            ll.latitude,
            airMeters
          );

          samples.push({
            ...m,
            airMeters
          });
        }

        for (let s = 0; s < samples.length - 1; s++) {
          const p = samples[s];
          const q = samples[s + 1];

          // Triangle 1: P-air, P-ground, Q-air
          pushCurtainVertex(
            curtainVertices,
            p.x, p.y, p.z, p.airMeters, p.meterScale, 0
          );
          pushCurtainVertex(
            curtainVertices,
            p.x, p.y, p.z, p.airMeters, p.meterScale, 1
          );
          pushCurtainVertex(
            curtainVertices,
            q.x, q.y, q.z, q.airMeters, q.meterScale, 0
          );

          // Triangle 2: Q-air, P-ground, Q-ground
          pushCurtainVertex(
            curtainVertices,
            q.x, q.y, q.z, q.airMeters, q.meterScale, 0
          );
          pushCurtainVertex(
            curtainVertices,
            p.x, p.y, p.z, p.airMeters, p.meterScale, 1
          );
          pushCurtainVertex(
            curtainVertices,
            q.x, q.y, q.z, q.airMeters, q.meterScale, 1
          );
        }

        // Vertical references every 1.0 NM, restarting from each leg start.
        const count = Math.floor(
          distanceNM / CURTAIN_VERTICAL_INTERVAL_NM
        );

        for (let v = 1; v <= count; v++) {
          const dNM = v * CURTAIN_VERTICAL_INTERVAL_NM;
          if (dNM >= distanceNM - 1e-6) continue;

          const t = distanceNM > 0 ? dNM / distanceNM : 0;
          const ll = interpolateRouteLocation(a, b, t);

          const airFeet =
            altAFeet + (altBFeet - altAFeet) * t;
          const airMeters = airFeet * 0.3048;

          const p = mercatorData(
            ll.longitude,
            ll.latitude,
            airMeters
          );

          pushCurtainVertex(
            verticalVertices,
            p.x, p.y, p.z, p.airMeters, p.meterScale, 0
          );
          pushCurtainVertex(
            verticalVertices,
            p.x, p.y, p.z, p.airMeters, p.meterScale, 1
          );
        }
      }

      // Add one vertical reference at EVERY route point.
      // The per-leg 1 NM spacing above restarts from each route point.
      for (const point of route) {
        const altFeet = routePointAltitudeFeet(point);
        if (altFeet == null) continue;

        const airMeters = altFeet * 0.3048;
        const p = mercatorData(
          point.longitude,
          point.latitude,
          airMeters
        );

        pushCurtainVertex(
          verticalVertices,
          p.x, p.y, p.z, airMeters, p.meterScale, 0
        );
        pushCurtainVertex(
          verticalVertices,
          p.x, p.y, p.z, airMeters, p.meterScale, 1
        );
      }

      return {
        curtain: new Float32Array(curtainVertices),
        vertical: new Float32Array(verticalVertices)
      };
    }

    function buildTerrainHeightMapBounds() {
      if (route.length < 2) return null;

      const coords = route.map(point =>
        mercatorData(point.longitude, point.latitude, 0)
      );

      let minX = Math.min(...coords.map(p => p.x));
      let maxX = Math.max(...coords.map(p => p.x));
      let minY = Math.min(...coords.map(p => p.y));
      let maxY = Math.max(...coords.map(p => p.y));

      const spanX = maxX - minX;
      const spanY = maxY - minY;

      const mid = route[Math.floor(route.length / 2)];
      const meterScale =
        maplibregl.MercatorCoordinate
          .fromLngLat([mid.longitude, mid.latitude])
          .meterInMercatorCoordinateUnits();

      const padX = Math.max(500 * meterScale, spanX * 0.10);
      const padY = Math.max(500 * meterScale, spanY * 0.10);

      return [
        minX - padX,
        minY - padY,
        maxX + padX,
        maxY + padY
      ];
    }

    function rebuildRoute3DGeometryIfNeeded() {
      const signature = routeGeometrySignature();

      if (route3DLayerState.routeSignature === signature) return;

      const curtain = buildCurtainGeometry();

      route3DLayerState.curtainVertices = curtain.curtain;
      route3DLayerState.verticalVertices = curtain.vertical;
      route3DLayerState.airVertices = buildAirRibbonGeometry();
      route3DLayerState.bounds = buildTerrainHeightMapBounds();
      route3DLayerState.routeSignature = signature;
      route3DLayerState.heightMapReady = false;
    }

    function bindCurtainAttributes(gl, program, buffer, vertices) {
      const stride = 6 * Float32Array.BYTES_PER_ELEMENT;

      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.DYNAMIC_DRAW);

      const specs = [
        ["a_xy", 2, 0],
        ["a_air_z", 1, 2],
        ["a_air_meters", 1, 3],
        ["a_meter_scale", 1, 4],
        ["a_ground_flag", 1, 5]
      ];

      for (const [name, size, offset] of specs) {
        const loc = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(
          loc,
          size,
          gl.FLOAT,
          false,
          stride,
          offset * Float32Array.BYTES_PER_ELEMENT
        );
      }
    }

    function bindAirRibbonAttributes(gl, program, vertices) {
      const stride = 8 * Float32Array.BYTES_PER_ELEMENT;

      gl.bindBuffer(gl.ARRAY_BUFFER, route3DLayerState.airBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.DYNAMIC_DRAW);

      const specs = [
        ["a_pos", 3, 0],
        ["a_other", 3, 3],
        ["a_side", 1, 6],
        ["a_air_meters", 1, 7]
      ];

      for (const [name, size, offset] of specs) {
        const loc = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(
          loc,
          size,
          gl.FLOAT,
          false,
          stride,
          offset * Float32Array.BYTES_PER_ELEMENT
        );
      }
    }

    function bindTerrainHeightMap(gl, program) {
      const bounds = route3DLayerState.bounds;
      if (!bounds || !route3DLayerState.heightMap) return false;

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, route3DLayerState.heightMap);

      gl.uniform1i(
        gl.getUniformLocation(program, "u_height_map"),
        0
      );

      gl.uniform4fv(
        gl.getUniformLocation(program, "u_height_bounds"),
        bounds
      );

      return true;
    }

    function updateGroundRouteVisibility() {
      if (!map.getLayer("route-line")) return;

      const topView =
        map.getPitch() <= TOP_VIEW_PITCH_THRESHOLD_DEG;

      map.setPaintProperty(
        "route-line",
        "line-opacity",
        route3DLayerState.disabled ? 1 : (topView ? 0 : 1)
      );
    }

    function showRuntimeStatus(message) {
      console.error(message);

      const el = document.getElementById("runtimeStatusBanner");
      if (!el) return;

      el.textContent = String(message);
      el.style.display = "block";
    }

    function disableExperimentalCurtain(error) {
      route3DLayerState.disabled = true;
      route3DLayerState.error =
        error instanceof Error
          ? error.message
          : String(error);

      showRuntimeStatus(
        "3D 커튼 렌더링이 비활성화되었습니다. 기본 지도/루트는 계속 사용할 수 있습니다. " +
        route3DLayerState.error
      );

      // Ground route must remain usable even when the experimental custom
      // layer is unavailable.
      if (map.getLayer("route-line")) {
        map.setPaintProperty(
          "route-line",
          "line-opacity",
          1
        );
      }
    }

    function safeEnsureRoute3DLayer() {
      if (route3DLayerState.disabled) return false;

      try {
        ensureRoute3DLayer();
        return true;
      } catch (error) {
        disableExperimentalCurtain(error);
        return false;
      }
    }

    function ensureRoute3DLayer() {
      if (map.getLayer("route-3d-msl")) return;

      map.addLayer({
        id: "route-3d-msl",
        type: "custom",
        renderingMode: "3d",

        onAdd(mapInstance, gl) {
          if (
            typeof WebGL2RenderingContext !== "undefined" &&
            !(gl instanceof WebGL2RenderingContext)
          ) {
            throw new Error("WebGL2 context is required for terrain height-map rendering.");
          }

          const floatColorExtension =
            gl.getExtension("EXT_color_buffer_float");

          if (!floatColorExtension) {
            throw new Error("EXT_color_buffer_float is not available on this device.");
          }

          const curtainVertex = `#version 300 es
            precision highp float;

            uniform mat4 u_matrix;
            uniform sampler2D u_height_map;
            uniform vec4 u_height_bounds;

            in vec2 a_xy;
            in float a_air_z;
            in float a_air_meters;
            in float a_meter_scale;
            in float a_ground_flag;

            out vec2 v_mercator;
            out float v_air_meters;
            out float v_actual_meters;

            vec4 terrainSample(vec2 xy) {
              vec2 uv =
                (xy - u_height_bounds.xy) /
                (u_height_bounds.zw - u_height_bounds.xy);

              return texture(
                u_height_map,
                vec2(uv.x, 1.0 - uv.y)
              );
            }

            void main() {
              vec4 terrain = terrainSample(a_xy);
              float groundZ = terrain.r * a_meter_scale;

              float z = mix(
                a_air_z,
                groundZ,
                a_ground_flag
              );

              gl_Position =
                u_matrix * vec4(a_xy, z, 1.0);

              v_mercator = a_xy;
              v_air_meters = a_air_meters;
              v_actual_meters = mix(a_air_meters, terrain.r, a_ground_flag);
            }
          `;

          const curtainFragment = `#version 300 es
            precision highp float;

            uniform sampler2D u_height_map;
            uniform vec4 u_height_bounds;
            uniform vec4 u_color;

            in vec2 v_mercator;
            in float v_air_meters;
            in float v_actual_meters;
            uniform int u_outside_fix_pass;
            uniform int u_fix_count;
            uniform vec4 u_fix_bounds[64];
            uniform vec4 u_fix_heights[64];

            out vec4 fragColor;

            vec4 terrainSample(vec2 xy) {
              vec2 uv =
                (xy - u_height_bounds.xy) /
                (u_height_bounds.zw - u_height_bounds.xy);

              return texture(
                u_height_map,
                vec2(uv.x, 1.0 - uv.y)
              );
            }

            void main() {
              vec4 terrain = terrainSample(v_mercator);

              if (terrain.a < 0.5) discard;

              // In pitched view, curtain/vertical references exist only
              // where planned MSL is above terrain.
              if (v_air_meters <= terrain.r) discard;

              if (u_fix_count > 0) {
                bool insideFix = false;
                for (int i = 0; i < 64; i++) {
                  if (i >= u_fix_count) break;
                  vec4 area = u_fix_bounds[i];
                  vec4 heights = u_fix_heights[i];
                  float lower = area.w + (heights.y > 0.5 ? terrain.r : 0.0);
                  float upper = heights.x + (heights.z > 0.5 ? terrain.r : 0.0);
                  if (distance(v_mercator, area.xy) <= area.z &&
                      v_actual_meters >= lower && v_actual_meters <= upper) insideFix = true;
                }
                if (u_outside_fix_pass == 1 && insideFix) discard;
                if (u_outside_fix_pass == 0 && !insideFix) discard;
              }
              fragColor = u_color;
            }
          `;

          const airVertex = `#version 300 es
            precision highp float;

            uniform mat4 u_matrix;
            uniform vec2 u_viewport;
            uniform float u_half_width_px;

            in vec3 a_pos;
            in vec3 a_other;
            in float a_side;
            in float a_air_meters;

            out vec2 v_mercator;
            out float v_air_meters;

            void main() {
              vec4 clip =
                u_matrix * vec4(a_pos, 1.0);
              vec4 otherClip =
                u_matrix * vec4(a_other, 1.0);

              vec2 ndc = clip.xy / clip.w;
              vec2 otherNdc =
                otherClip.xy / otherClip.w;

              vec2 px =
                (ndc * 0.5 + 0.5) * u_viewport;
              vec2 otherPx =
                (otherNdc * 0.5 + 0.5) * u_viewport;

              vec2 delta = otherPx - px;
              float len = length(delta);
              vec2 dir =
                len > 0.001
                  ? delta / len
                  : vec2(1.0, 0.0);

              vec2 normal = vec2(-dir.y, dir.x);
              vec2 offsetPx =
                normal * u_half_width_px * a_side;
              vec2 offsetNdc =
                offsetPx / u_viewport * 2.0;

              clip.xy += offsetNdc * clip.w;

              gl_Position = clip;
              v_mercator = a_pos.xy;
              v_air_meters = a_air_meters;
            }
          `;

          const airFragment = `#version 300 es
            precision highp float;

            uniform sampler2D u_height_map;
            uniform vec4 u_height_bounds;
            uniform float u_force_visible;
            uniform vec4 u_color;

            in vec2 v_mercator;
            in float v_air_meters;

            out vec4 fragColor;

            vec4 terrainSample(vec2 xy) {
              vec2 uv =
                (xy - u_height_bounds.xy) /
                (u_height_bounds.zw - u_height_bounds.xy);

              return texture(
                u_height_map,
                vec2(uv.x, 1.0 - uv.y)
              );
            }

            void main() {
              // Top view: magenta line is ALWAYS visible.
              if (u_force_visible < 0.5) {
                vec4 terrain = terrainSample(v_mercator);

                if (terrain.a < 0.5) discard;
                if (v_air_meters <= terrain.r) discard;
              }

              fragColor = u_color;
            }
          `;

          route3DLayerState.curtainProgram =
            linkRoute3DProgram(
              gl,
              curtainVertex,
              curtainFragment
            );

          route3DLayerState.airProgram =
            linkRoute3DProgram(
              gl,
              airVertex,
              airFragment
            );

          route3DLayerState.curtainBuffer = gl.createBuffer();
          route3DLayerState.verticalBuffer = gl.createBuffer();
          route3DLayerState.airBuffer = gl.createBuffer();

          route3DLayerState.heightMap = gl.createTexture();
          gl.bindTexture(
            gl.TEXTURE_2D,
            route3DLayerState.heightMap
          );

          gl.texStorage2D(
            gl.TEXTURE_2D,
            1,
            gl.RGBA32F,
            HEIGHTMAP_SIZE,
            HEIGHTMAP_SIZE
          );

          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR
          );
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.LINEAR
          );
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE
          );
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE
          );
        },

        prerender(gl, options) {
          if (route3DLayerState.disabled) return;

          try {
            
                      rebuildRoute3DGeometryIfNeeded();
            
                      const bounds = route3DLayerState.bounds;
            
                      if (
                        !bounds ||
                        !route3DLayerState.heightMap ||
                        typeof options?.renderTerrainHeightMap !== "function"
                      ) {
                        route3DLayerState.heightMapReady = false;
                        return;
                      }
            
                      options.renderTerrainHeightMap({
                        texture: route3DLayerState.heightMap,
                        width: HEIGHTMAP_SIZE,
                        height: HEIGHTMAP_SIZE,
                        bounds
                      });
            
                      route3DLayerState.heightMapReady = true;
          } catch (error) {
            disableExperimentalCurtain(error);
          }
        },

        render(gl, options) {
          if (route3DLayerState.disabled) return;

          try {
            
                      rebuildRoute3DGeometryIfNeeded();
            
                      const matrix = extractProjectionMatrix(options);
                      if (!matrix) return;
            
                      const topView =
                        map.getPitch() <= TOP_VIEW_PITCH_THRESHOLD_DEG;
            
                      // Thick magenta airborne route.
                      const airVertices = route3DLayerState.airVertices;
            
                      if (airVertices.length >= 48) {
                        const program = route3DLayerState.airProgram;
                        gl.useProgram(program);
            
                        bindAirRibbonAttributes(
                          gl,
                          program,
                          airVertices
                        );
            
                        gl.uniformMatrix4fv(
                          gl.getUniformLocation(program, "u_matrix"),
                          false,
                          matrix
                        );
            
                        gl.uniform2f(
                          gl.getUniformLocation(program, "u_viewport"),
                          gl.drawingBufferWidth,
                          gl.drawingBufferHeight
                        );
            
                        gl.uniform1f(
                          gl.getUniformLocation(program, "u_half_width_px"),
                          AIR_ROUTE_HALF_WIDTH_PX
                        );
            
                        gl.uniform1f(
                          gl.getUniformLocation(program, "u_force_visible"),
                          topView ? 1 : 0
                        );
            
                        gl.uniform4f(
                          gl.getUniformLocation(program, "u_color"),
                          0.93,
                          0.0,
                          0.72,
                          1.0
                        );
            
                        if (route3DLayerState.bounds) {
                          bindTerrainHeightMap(gl, program);
                        }
            
                        if (topView || route3DLayerState.heightMapReady) {
                          // Top view must show the planned MSL route even if
                          // its altitude is below the terrain (including 0 ft).
                          if (topView) {
                            gl.disable(gl.DEPTH_TEST);
                          } else {
                            gl.enable(gl.DEPTH_TEST);
                            gl.depthFunc(gl.LEQUAL);
                          }

                          gl.disable(gl.BLEND);

                          gl.drawArrays(
                            gl.TRIANGLES,
                            0,
                            airVertices.length / 8
                          );

                          if (topView) {
                            gl.enable(gl.DEPTH_TEST);
                            gl.depthFunc(gl.LEQUAL);
                          }
                        }
                      }
            
                      // Top view = magenta route only.
                      if (topView) return;
            
                      if (!route3DLayerState.heightMapReady) return;
            
                      const curtainProgram =
                        route3DLayerState.curtainProgram;
                      gl.useProgram(curtainProgram);
                      uploadFixClipUniforms(gl, curtainProgram);
                      gl.uniform1i(gl.getUniformLocation(curtainProgram,"u_outside_fix_pass"),0);
            
                      gl.uniformMatrix4fv(
                        gl.getUniformLocation(curtainProgram, "u_matrix"),
                        false,
                        matrix
                      );
            
                      bindTerrainHeightMap(gl, curtainProgram);
            
                      gl.enable(gl.DEPTH_TEST);
                      gl.depthFunc(gl.LEQUAL);
                      gl.disable(gl.CULL_FACE);
            
                      // Navy curtain, 70% transparent.
                      const curtainVertices =
                        route3DLayerState.curtainVertices;
            
                      if (curtainVertices.length >= 18) {
                        bindCurtainAttributes(
                          gl,
                          curtainProgram,
                          route3DLayerState.curtainBuffer,
                          curtainVertices
                        );
            
                        gl.uniform4f(
                          gl.getUniformLocation(curtainProgram, "u_color"),
                          0.06,
                          0.16,
                          0.30,
                          CURTAIN_ALPHA
                        );
            
                        gl.enable(gl.BLEND);
                        gl.blendFuncSeparate(
                          gl.SRC_ALPHA,
                          gl.ONE_MINUS_SRC_ALPHA,
                          gl.ONE,
                          gl.ONE_MINUS_SRC_ALPHA
                        );
                        gl.depthMask(false);
            
                        gl.drawArrays(
                          gl.TRIANGLES,
                          0,
                          curtainVertices.length / 6
                        );
            
                        gl.depthMask(true);
                      }
            
                      // Vertical reference lines every 0.5 NM.
                      const verticalVertices =
                        route3DLayerState.verticalVertices;
            
                      if (verticalVertices.length >= 12) {
                        bindCurtainAttributes(
                          gl,
                          curtainProgram,
                          route3DLayerState.verticalBuffer,
                          verticalVertices
                        );
            
                        gl.uniform4f(
                          gl.getUniformLocation(curtainProgram, "u_color"),
                          1.0,
                          1.0,
                          1.0,
                          0.90
                        );
            
                        gl.enable(gl.BLEND);
                        gl.blendFuncSeparate(
                          gl.SRC_ALPHA,
                          gl.ONE_MINUS_SRC_ALPHA,
                          gl.ONE,
                          gl.ONE_MINUS_SRC_ALPHA
                        );
            
                        gl.lineWidth(1);
            
                        gl.drawArrays(
                          gl.LINES,
                          0,
                          verticalVertices.length / 6
                        );
                      }
          } catch (error) {
            disableExperimentalCurtain(error);
          }
        },

        onRemove(mapInstance, gl) {
          for (const buffer of [
            route3DLayerState.curtainBuffer,
            route3DLayerState.verticalBuffer,
            route3DLayerState.airBuffer
          ]) {
            if (buffer) gl.deleteBuffer(buffer);
          }

          for (const program of [
            route3DLayerState.curtainProgram,
            route3DLayerState.airProgram
          ]) {
            if (program) gl.deleteProgram(program);
          }

          if (route3DLayerState.heightMap) {
            gl.deleteTexture(route3DLayerState.heightMap);
          }
        }
      });
    }

    function refreshRoute3D() {
      invalidateRoute3DGeometry();

      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }
    }

    function getRoute3DAltitudeDiagnostics() {
      rebuildRoute3DGeometryIfNeeded();

      return {
        logicVersion:
          "v47 MapLibre terrain-height-map shader",
        mapLibreVersion:
          maplibregl.version ?? "unknown",
        terrainHeightMapAPI:
          "renderTerrainHeightMap",
        cpuTerrainSamplingForCurtain: false,
        whiteGroundRoute:
          "MapLibre terrain-draped style line",
        magentaAirRoute:
          "route-point MSL only; ~7px screen-space ribbon",
        airRouteTopViewAlwaysVisible: true,
        curtain:
          "navy; 70% transparency (alpha 0.30)",
        curtainBottom:
          "MapLibre terrain height map sampled directly in shader",
        verticalLineIntervalNM:
          CURTAIN_VERTICAL_INTERVAL_NM,
        topView:
          "magenta air route only",
        pitchedView:
          "white draped ground line + navy curtain + magenta air route",
        terrainExaggeration: 1,
        routeVerticalExaggeration: false,
        heightMapSize: HEIGHTMAP_SIZE,
        customLayerDisabled:
          route3DLayerState.disabled,
        customLayerError:
          route3DLayerState.error,
        moduleLoading:
          "official maplibre-gl.mjs ES module",
        heightMapReady:
          route3DLayerState.heightMapReady,
        heightMapBounds:
          route3DLayerState.bounds
      };
    }

    function resampleRouteTerrainProfile() {
      // Compatibility method. v47 has no CPU terrain profile.
      route3DLayerState.heightMapReady = false;

      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }

      return getRoute3DAltitudeDiagnostics();
    }

    function maybeCompleteRouteTerrainProfileCache() {
      // Compatibility no-op; MapLibre supplies terrain height map in prerender.
      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }
    }

    function updateCompassRotation() {
      if (!compassRotor) return;
      // Compass north needle points toward geographic north on the current screen.
      compassRotor.style.transform = `rotate(${-map.getBearing()}deg)`;
    }

    function headingUpAircraftScreenPoint() {
      const container = map.getContainer();
      return {
        x: container.clientWidth / 2,
        y: container.clientHeight * (2 / 3)
      };
    }

    function aircraftVerticalScreenVector() {
      const terrainMeters = terrainElevationMeters(
        aircraft.latitude,
        aircraft.longitude
      );
      if (terrainMeters == null) {
        return { dx: 0, dy: 0, ready: false };
      }

      const aircraftMetersMsl = feetToMeters(aircraft.altitudeMslFeet);

      const groundPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        terrainMeters,
        aircraftProjectionMatrix
      );

      const elevatedPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        aircraftMetersMsl,
        aircraftProjectionMatrix
      );

      if (!groundPoint || !elevatedPoint) {
        return { dx: 0, dy: 0, ready: false };
      }

      // Elevated symbol screen location relative to its ground coordinate.
      return {
        dx: elevatedPoint.x - groundPoint.x,
        dy: groundPoint.y - elevatedPoint.y,
        ready: true
      };
    }

    function headingUpGroundOffsetForAircraftSymbol() {
      const container = map.getContainer();
      const target = headingUpAircraftScreenPoint();
      const screenCenter = {
        x: container.clientWidth / 2,
        y: container.clientHeight / 2
      };

      const vertical = aircraftVerticalScreenVector();

      // The MapLibre Marker's geographical anchor is the ground lat/lon.
      // To place the ELEVATED aircraft symbol at target:
      //
      // symbolX = groundX + dx
      // symbolY = groundY - dy
      //
      // therefore:
      // groundX = targetX - dx
      // groundY = targetY + dy
      const desiredGroundX = target.x - vertical.dx;
      const desiredGroundY = target.y + vertical.dy;

      return [
        desiredGroundX - screenCenter.x,
        desiredGroundY - screenCenter.y
      ];
    }

    let programmaticFollowUpdate = false;
    let activeTouchCount = 0;
    let suppressFollowUntil = 0;

    // iPad long-press suppression.
    // A stationary press >= 450 ms must perform NO map/route action.
    const LONG_PRESS_MS = 450;
    const LONG_PRESS_MOVE_PX = 12;
    let touchPressState = {
      active: false,
      startTime: 0,
      startX: 0,
      startY: 0,
      moved: false,
      wasLongPress: false
    };
    let suppressTapUntil = 0;

    function longPressSuppressed() {
      return performance.now() < suppressTapUntil;
    }

    function userCameraGestureActive() {
      return (
        headingGestureActive ||
        activeTouchCount >= 2 ||
        performance.now() < suppressFollowUntil ||
        map.isZooming() ||
        map.isRotating()
      );
    }

    function applyAircraftAnchoredCamera({
      bearing = map.getBearing(),
      zoom = map.getZoom(),
      pitch = map.getPitch(),
      animate = false,
      secondPass = true
    } = {}) {
      if (userCameraGestureActive()) return;

      const offset = headingUpGroundOffsetForAircraftSymbol();

      programmaticFollowUpdate = true;

      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing,
        zoom,
        pitch,
        offset,
        duration: animate ? 300 : 0,
        essential: true
      });

      // The aircraft-ground screen separation changes slightly after the
      // camera center moves under perspective. Do one correction pass after
      // MapLibre has produced the new projection matrix.
      if (secondPass && !animate) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            programmaticFollowUpdate = false;

            if (
              followMode === "heading" &&
              !followSuspendedByUser &&
              !userCameraGestureActive()
            ) {
              const correctedOffset = headingUpGroundOffsetForAircraftSymbol();

              programmaticFollowUpdate = true;
              map.easeTo({
                center: [aircraft.longitude, aircraft.latitude],
                bearing: aircraftTrueHeading(),
                zoom: map.getZoom(),
                pitch: map.getPitch(),
                offset: correctedOffset,
                duration: 0,
                essential: true
              });

              requestAnimationFrame(() => {
                programmaticFollowUpdate = false;
              });
            }
          });
        });
      } else {
        setTimeout(() => {
          programmaticFollowUpdate = false;
        }, animate ? 320 : 0);
      }
    }

    function applyNorthUpCentered({ animate = true } = {}) {
      followMode = "north";
      followSuspendedByUser = false;
      orientationBtn.classList.remove("heading-active");

      programmaticFollowUpdate = true;
      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing: 0,
        offset: [0, 0],
        duration: animate ? 500 : 0,
        essential: true
      });

      setTimeout(() => {
        programmaticFollowUpdate = false;
      }, animate ? 520 : 0);
    }

    function applyHeadingUp({ animate = true } = {}) {
      if (aircraftTrueHeading() == null) {
        applyNorthUpCentered({ animate });
        updateAircraftMarkerVisuals();
        return;
      }
      followMode = "heading";
      followSuspendedByUser = false;
      orientationBtn.classList.add("heading-active");

      applyAircraftAnchoredCamera({
        bearing: aircraftTrueHeading(),
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        animate,
        secondPass: !animate
      });
    }

    function refreshFollowCamera({ animate = false } = {}) {
      if (followMode !== "heading" || aircraftTrueHeading() == null) return;
      if (followSuspendedByUser) return;
      if (userCameraGestureActive()) return;

      applyAircraftAnchoredCamera({
        bearing: aircraftTrueHeading(),
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        animate,
        secondPass: true
      });
    }

    function updateAircraftPosition(
      latitude,
      longitude,
      magneticHeading = aircraft.magneticHeading,
      altitudeMslFeet = aircraft.altitudeMslFeet
    ) {
      aircraft.latitude = Number(latitude);
      aircraft.longitude = Number(longitude);
      aircraft.magneticHeading = Number(magneticHeading);
      aircraft.altitudeMslFeet = Number(altitudeMslFeet);
      positionReport?.refresh();

      if (aircraftMarker) {
        aircraftMarker.setLngLat([aircraft.longitude, aircraft.latitude]);
      }

      updateAircraftMarkerVisuals();

      // Follow ownship only when the pilot is not actively manipulating
      // pitch/zoom/rotation. This is critical on iPad Safari because the
      // simulated GPS update runs every animation frame.
      if (
        followMode === "heading" &&
        !followSuspendedByUser &&
        !userCameraGestureActive()
      ) {
        refreshFollowCamera({ animate: false });
      }
    }

    // ===== Tracking test simulation =====
    // 100 kt for 10 sec on 150°M, then 10 sec on 330°M, repeating.
    const simulation = {
      running: false,
      speedKnots: 100,
      legSeconds: 10,
      headingsMagnetic: [150, 330],
      currentLegIndex: 0,
      legElapsedSeconds: 0,
      lastTimestamp: null,
      rafId: null
    };

    const KNOT_TO_MPS = 0.5144444444444445;

    function destinationPoint(latDeg, lonDeg, trueBearingDeg, distanceMeters) {
      const R = 6371008.8;
      const delta = distanceMeters / R;
      const theta = toRad(trueBearingDeg);

      const phi1 = toRad(latDeg);
      const lambda1 = toRad(lonDeg);

      const sinPhi1 = Math.sin(phi1);
      const cosPhi1 = Math.cos(phi1);
      const sinDelta = Math.sin(delta);
      const cosDelta = Math.cos(delta);

      const phi2 = Math.asin(
        sinPhi1 * cosDelta +
        cosPhi1 * sinDelta * Math.cos(theta)
      );

      const lambda2 = lambda1 + Math.atan2(
        Math.sin(theta) * sinDelta * cosPhi1,
        cosDelta - sinPhi1 * Math.sin(phi2)
      );

      return {
        latitude: toDeg(phi2),
        longitude: ((toDeg(lambda2) + 540) % 360) - 180
      };
    }

    function simulationStep(timestamp) {
      if (!simulation.running) return;

      if (simulation.lastTimestamp == null) {
        simulation.lastTimestamp = timestamp;
        simulation.rafId = requestAnimationFrame(simulationStep);
        return;
      }

      let dt = (timestamp - simulation.lastTimestamp) / 1000;
      simulation.lastTimestamp = timestamp;

      // Avoid huge jumps if the tab was backgrounded.
      dt = Math.max(0, Math.min(dt, 0.25));

      let remaining = dt;

      while (remaining > 0) {
        const timeLeftInLeg =
          simulation.legSeconds - simulation.legElapsedSeconds;
        const stepDt = Math.min(remaining, timeLeftInLeg);

        const magneticHeading =
          simulation.headingsMagnetic[simulation.currentLegIndex];

        // Convert current magnetic heading to true bearing using
        // declination at the aircraft's current position.
        aircraft.magneticHeading = magneticHeading;
        const trueHeading = aircraftTrueHeading();
        if (trueHeading == null) {
          simulation.rafId = requestAnimationFrame(simulationStep);
          return;
        }

        const distanceMeters =
          simulation.speedKnots * KNOT_TO_MPS * stepDt;

        const next = destinationPoint(
          aircraft.latitude,
          aircraft.longitude,
          trueHeading,
          distanceMeters
        );

        updateAircraftPosition(
          next.latitude,
          next.longitude,
          magneticHeading
        );

        simulation.legElapsedSeconds += stepDt;
        remaining -= stepDt;

        if (simulation.legElapsedSeconds >= simulation.legSeconds - 1e-9) {
          simulation.legElapsedSeconds = 0;
          simulation.currentLegIndex =
            (simulation.currentLegIndex + 1) %
            simulation.headingsMagnetic.length;
        }
      }

      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function startTrackingSimulation() {
      if (simulation.running) return;
      simulation.running = true;
      simulation.lastTimestamp = null;
      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function stopTrackingSimulation() {
      simulation.running = false;
      simulation.lastTimestamp = null;
      if (simulation.rafId != null) {
        cancelAnimationFrame(simulation.rafId);
        simulation.rafId = null;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLat(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "N" : "S"}`;
    }

    function formatLon(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "E" : "W"}`;

    function gcDistanceMeters(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dp = toRad(b.latitude - a.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const h =
        Math.sin(dp/2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;

      return R_EARTH_M * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    }

    function trueBearing(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const y = Math.sin(dl) * Math.cos(p2);
      const x =
        Math.cos(p1) * Math.sin(p2) -
        Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

      return norm(toDeg(Math.atan2(y, x)));
    }

    function declination(lat, lon) {
      if (!magvarFn) return null;
      try {
        const value = magvarFn(lat, lon, 0, new Date());
        return Number.isFinite(value) ? value : null;
      } catch (error) {
        return null;
      }
    }

    function terrainElevationMeters(latitude, longitude) {
      if (!terrainReady) return null;
      if (typeof map.queryTerrainElevation !== "function") return null;

      const elevation = map.queryTerrainElevation(
        [Number(longitude), Number(latitude)],
        { exaggerated: false }
      );

      return Number.isFinite(elevation) ? elevation : null;
    }

    function legData(a, b) {
      const midLat = (a.latitude + b.latitude) / 2;
      const midLon = (a.longitude + b.longitude) / 2;
      const distanceNM = gcDistanceMeters(a, b) / M_PER_NM;

      if (distanceNM < 0.00001) {
        return {
          distanceNM: 0,
          bearingTrue: 0,
          declination: declination(midLat, midLon),
          bearingMagnetic: 0,
          midpoint: { latitude: midLat, longitude: midLon }
        };
      }

      const d = declination(midLat, midLon);
      const t = trueBearing(a, b);

      return {
        distanceNM,
        bearingTrue: t,
        declination: d,
        bearingMagnetic: d == null ? null : norm(t - d),
        midpoint: { latitude: midLat, longitude: midLon }
      };
    }

    function createRoutePointAltitudeControl(point, index) {
      const wrap = document.createElement("label");

      input.step = "100";

      input.setAttribute(
        "aria-label",
        `${displayPointName(point, index)} altitude MSL feet`

      if (!Number.isFinite(point.altitudeMslFeet)) {
        point.altitudeMslFeet = 0;

      input.value = String(Math.round(point.altitudeMslFeet));

      const unit = document.createElement("span");
      unit.className = "route-point-altitude-unit";
      unit.textContent = "FT MSL";

      input.dataset.routePointId = String(point.id);

      // Live typing updates the model and 3D route, but does NOT recreate
      // Route Info. Recreating the focused input was causing iPad Safari
      // to dismiss the numeric keyboard after the first digit.
      input.addEventListener("input", () => {
        setRoutePointAltitudeMslFeet(
          point.id,
          input.value,
          input,
          { rerender: false }
        );
      });

      const commitAltitude = () => {
        if (input.value === "") {
          input.value = "0";
        }

        setRoutePointAltitudeMslFeet(
          point.id,
          input.value,
          input,
          { rerender: false }
        );

        syncVisibleRouteAltitudeInputs(0);
      };

      input.addEventListener("change", commitAltitude);
      input.addEventListener("blur", commitAltitude);

      // The control must never trigger map pan/route drag.
      ["pointerdown", "touchstart", "mousedown", "click"].forEach(type => {
        input.addEventListener(type, event => {
          event.stopPropagation();
        });
      });

      wrap.appendChild(input);
      wrap.appendChild(unit);
      return wrap;
    }
