<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Korea VFR Moving Map - v6 Route Drag</title>

  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    /* iPad / touch optimization */
    #map, .maplibregl-canvas-container, .maplibregl-canvas {
      touch-action: none;
    }

    button, input, .route-point-wrap {
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: coarse) {
      .nav-control-btn {
        width: 52px;
        height: 52px;
      }

      .route-point-dot {
        min-width: 32px;
        height: 32px;
        border-radius: 17px;
        font-size: 13px;
        line-height: 28px;
      }

      .route-point-coords {
        padding: 7px 8px;
        font-size: 12px;
      }

      .route-info-tab,
      .new-route-tab {
        min-height: 48px;
      }

      .popup-btn,
      .same-point-btn,
      .route-delete-btn {
        min-height: 44px;
      }
    }
    .maplibregl-ctrl-attrib { font-size: 10px; }

    .route-point-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .route-point-wrap:active {
      cursor: grabbing;
    }

    .route-point-dot {
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 13px;
      background: rgba(255,255,255,0.97);
      border: 2px solid rgba(0,0,0,0.9);
      color: #111;
      font: 700 12px/20px Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .route-point-coords {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font: 600 11px/1.2 Arial, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    .route-point-name {
      display: block;
      margin-bottom: 2px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }

    .leg-label {
      padding: 5px 7px;
      border-radius: 5px;
      background: rgba(0,0,0,0.82);
      border: 1px solid rgba(255,255,255,0.65);
      color: #fff;
      font: 700 12px/1.3 Arial, sans-serif;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      text-align: center;
    }

    .point-popup {
      position: absolute;
      z-index: 20;
      min-width: 220px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(22,22,22,0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      font: 13px/1.4 Arial, sans-serif;
    }

    .point-popup[hidden] { display: none; }

    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .popup-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
    }

    .popup-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .popup-input:focus {
      border-color: rgba(255,255,255,0.75);
    }

    .popup-actions {
      display: flex;
      gap: 8px;
    }

    .popup-btn {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .popup-save {
      background: #fff;
      color: #111;
    }

    .popup-delete {
      background: rgba(220,55,55,0.95);
      color: #fff;
    }

    .drag-hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.25);
      font: 12px Arial, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .drag-hint.show { opacity: 1; }

    /* ===== Route Info top panel ===== */
    .route-info-shell {
      position: absolute;
      z-index: 30;
      top: 0;
      left: 50%;
      width: min(96vw, 1380px);
      transform: translateX(-50%);
      transition: transform .22s ease;
      pointer-events: none;
    }

    .route-info-shell.hidden {
      display: none;
    }

    .route-info-shell.collapsed {
      transform: translate(-50%, calc(-100% + 38px));
    }

    .route-info-panel {
      pointer-events: auto;
      background:
        linear-gradient(180deg, rgba(42,88,164,.97) 0%, rgba(30,69,139,.97) 100%);
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.30);
      backdrop-filter: blur(8px);
      color: #fff;
      overflow: hidden;
    }

    .route-info-head {
      display: grid;
      grid-template-columns: minmax(160px, 0.9fr) minmax(360px, 2.8fr) minmax(160px, 0.9fr);
      gap: 12px;
      align-items: start;
      padding: 14px 18px 10px;
    }

    .route-end {
      min-width: 0;
    }

    .route-section-label {
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-end-name {
      font: 700 19px/1.1 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-to {
      text-align: right;
    }

    .route-via-wrap {
      min-width: 0;
    }

    .route-via-title {
      text-align: center;
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-strip {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.45) transparent;
    }

    .route-strip-inner {
      display: flex;
      align-items: center;
      width: max-content;
      min-width: max-content;
      margin-left: auto;
      margin-right: auto;
    }

    .route-strip::-webkit-scrollbar {
      height: 5px;
    }

    .route-strip::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.38);
      border-radius: 999px;
    }

    .route-node-card {
      flex: 0 0 auto;
      min-width: 90px;
      max-width: 150px;
      text-align: center;
      font: 700 15px/1.2 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
    }

    .route-node-stack {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .route-point-altitude {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .route-point-altitude-input {
      width: 72px;
      height: 30px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 6px;
      padding: 0 7px;
      background: rgba(5,16,38,.70);
      color: #fff;
      font: 700 13px/1 Arial, sans-serif;
      text-align: right;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .route-point-altitude-input:focus {
      border-color: rgba(255,255,255,.95);
      background: rgba(4,18,46,.88);
    }

    .route-point-altitude-input.invalid {
      border-color: rgba(255,110,110,.98);
      background: rgba(115,20,20,.55);
    }

    .route-point-altitude-unit {
      font: 700 10px/1 Arial, sans-serif;
      letter-spacing: .04em;
      opacity: .82;
    }

    .route-end-altitude {
      margin-top: 9px;
      display: flex;
      justify-content: flex-start;
    }

    .route-end-altitude-right {
      justify-content: flex-end;
    }

    @media (pointer: coarse) {
      .route-point-altitude-input {
        width: 82px;
        height: 38px;
        font-size: 16px;
      }
    }

    .route-leg-mini {
      flex: 0 0 auto;
      width: 128px;
      padding: 0 8px;
      display: grid;
      grid-template-rows: 18px 12px 18px;
      align-items: center;
      justify-items: center;
      box-sizing: border-box;
    }

    .route-leg-distance,
    .route-leg-bearing {
      font: 700 11px/1 Arial, sans-serif;
      opacity: .95;
      white-space: nowrap;
    }

    .route-leg-line {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,.78);
      position: relative;
    }

    .route-leg-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -3px;
      border-left: 7px solid rgba(255,255,255,.95);
      border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent;
    }

    .route-info-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 2px 16px 12px;
      font: 700 14px/1 Arial, sans-serif;
      opacity: .95;
    }

    .route-foot-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex-wrap: wrap;
    }


    .route-info-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 38px;
      margin: -1px auto 0;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background:
        linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/38px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-info-tab::after {
      content: "▲";
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      opacity: .8;
      transition: transform .2s ease;
    }

    .route-info-shell.collapsed .route-info-tab::after {
      transform: rotate(180deg);
    }

    @media (max-width: 760px) {
      .route-info-shell {
        width: 100%;
      }

      .route-info-panel {
        border-radius: 0 0 10px 10px;
      }

      .route-info-head {
        grid-template-columns: 110px minmax(200px, 1fr) 110px;
        gap: 8px;
        padding: 11px 10px 8px;
      }

      .route-end-name {
        font-size: 15px;
      }

      .route-node-card {
        min-width: 74px;
        font-size: 13px;
      }

      .route-leg-mini {
        width: 106px;
      }
    }


    .new-route-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 40px;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/40px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-delete-btn {
      margin-left: 8px;
      border: 1px solid rgba(255,255,255,.32);
      background: rgba(180,35,35,.9);
      color: #fff;
      border-radius: 7px;
      padding: 7px 12px;
      font: 700 12px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .route-info-foot {
      justify-content: flex-end;
    }

    .route-total-wrap {
      margin-left: auto;
    }

    .same-point-btn {
      width: 100%;
      margin: 0 0 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 6px;
      background: rgba(70,120,210,.95);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .same-point-btn[hidden] { display: none; }

    /* ===== Aircraft / navigation controls ===== */
    .aircraft-marker {
      width: 180px;
      height: 52px;
      position: relative;
      pointer-events: none;
      overflow: visible;
    }

    .aircraft-marker svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .aircraft-symbol-tilt {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 40px;
      height: 40px;
      transform: translateX(-50%);
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      perspective: 420px;
      overflow: visible;
    }

    .aircraft-symbol {
      position: absolute;
      inset: 0;
      width: 40px;
      height: 40px;
      transform-origin: 50% 50%;
      transform-box: fill-box;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.72));
      backface-visibility: visible;
    }

    .aircraft-altitude-stem {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 10px;
      height: 0;
      border-radius: 999px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.92),
        rgba(193,206,224,.94) 55%,
        rgba(125,144,168,.96)
      );
      box-shadow:
        0 0 0 1px rgba(255,255,255,.22),
        0 4px 10px rgba(0,0,0,.22);
      opacity: 0;
    }

    .aircraft-ground-anchor {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 18px;
      height: 12px;
      transform: translateX(-50%);
      opacity: 0;
    }

    .aircraft-ground-anchor::before,
    .aircraft-ground-anchor::after {
      content: "";
      position: absolute;
      bottom: 1px;
      width: 11px;
      height: 0;
      border-top: 4px solid rgba(18,23,30,.92);
      filter: drop-shadow(0 1px 1px rgba(255,255,255,.18));
    }

    .aircraft-ground-anchor::before {
      right: 50%;
      transform-origin: right center;
      transform: rotate(38deg);
    }

    .aircraft-ground-anchor::after {
      left: 50%;
      transform-origin: left center;
      transform: rotate(-38deg);
    }

    .aircraft-altitude-card {
      position: absolute;
      left: calc(50% + 18px);
      bottom: 20px;
      min-width: 94px;
      padding: 6px 8px 7px;
      border-radius: 10px;
      background: rgba(16, 22, 31, .84);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,.12);
      opacity: 0;
    }

    .aircraft-alt-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      white-space: nowrap;
      line-height: 1.15;
    }

    .aircraft-alt-row + .aircraft-alt-row {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .aircraft-alt-k {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .05em;
      color: rgba(219,228,240,.82);
    }

    .aircraft-alt-v {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .01em;
      color: #fff;
    }

    .compass-face {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-rotor {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
    }

    .nav-controls {
      position: absolute;
      z-index: 25;
      right: 16px;
      bottom: 26px;
      display: flex;
      flex-direction: row;
      gap: 9px;
      align-items: center;
    }

    .nav-control-btn {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 10px;
      background: rgba(20,28,40,.88);
      color: #fff;
      box-shadow: 0 5px 16px rgba(0,0,0,.32);
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .nav-control-btn:hover {
      background: rgba(31,45,65,.95);
    }

    .nav-control-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-control-btn.heading-active {
      background: rgba(34,84,165,.96);
      border-color: rgba(255,255,255,.72);
    }

    .nav-control-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }


    .airport-popup .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.94);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 14px 28px rgba(0,0,0,0.28);
      min-width: 190px;
    }

    .airport-popup .maplibregl-popup-close-button {
      color: rgba(255,255,255,0.78);
      font-size: 20px;
      right: 8px;
      top: 4px;
    }

    .airport-popup .airport-popup-title-ko {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .airport-popup .airport-popup-title-en {
      font-size: 13px;
      color: rgba(255,255,255,0.84);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .airport-popup .airport-popup-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      line-height: 1.35;
    }

    .airport-popup .airport-popup-label {
      min-width: 38px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    .airport-dom-marker {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .airport-dom-marker img {
      display: block;
      width: 34px;
      height: auto;
      max-height: 42px;
      object-fit: contain;
      pointer-events: none;
      transform: none !important;
    }

    .airport-dom-marker.is-hidden {
      display: none;
    }


    .airport-popup .airport-popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .airport-popup .airport-popup-action {
      min-height: 38px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 9px;
      color: #fff;
      font: 700 12px/1.15 Arial, sans-serif;
      cursor: pointer;
      padding: 8px 9px;
      -webkit-tap-highlight-color: transparent;
    }

    .airport-popup .airport-popup-action.departure {
      background: rgba(32, 104, 214, .92);
    }

    .airport-popup .airport-popup-action.destination {
      background: rgba(34, 148, 91, .92);
    }

    .airport-popup .airport-popup-action:active {
      transform: translateY(1px);
    }

  </style>
</head>

<body>
  <div id="map"></div>

  <div id="routeInfoShell" class="route-info-shell hidden">
    <div class="route-info-panel">
      <div class="route-info-head">
        <div class="route-end">
          <div class="route-section-label">FROM</div>
          <div id="routeFromName" class="route-end-name">A</div>
          <div id="routeFromAltitude" class="route-end-altitude"></div>
        </div>

        <div class="route-via-wrap">
          <div class="route-via-title">VIA</div>
          <div id="routeStrip" class="route-strip"></div>
        </div>

        <div class="route-end route-to">
          <div class="route-section-label">TO</div>
          <div id="routeToName" class="route-end-name">B</div>
          <div id="routeToAltitude" class="route-end-altitude route-end-altitude-right"></div>
        </div>
      </div>

      <div class="route-info-foot">
        <div class="route-total-wrap">
          Total&nbsp;:&nbsp;<span id="routeTotalNm">0.00</span>&nbsp;NM
        </div>
        <button id="routeDeleteBtn" class="route-delete-btn" type="button">Delete</button>
      </div>
    </div>

    <button id="routeInfoTab" class="route-info-tab" type="button">Route Info</button>
  </div>


  <div id="newRouteShell" class="route-info-shell">

    function airportFeatureToRoutePoint(feature) {

      return {
        id: nextPointId++,
        name: String(props.nameKo || "").trim(),
        altitudeMslFeet: 0,
        longitude: Number(longitude),
        latitude: Number(latitude)
      };

    function clearRouteForAirportEndpointSelection() {
      route = [];
      pendingDestinationAirport = null;
      clearPointMarkers();
      clearLegMarkers();
      updateRouteSource();
      setPreview([]);
      refreshRoute3D();
      closePointPopup();
      sameOriginDestination = false;

      routeModeActive = true;
      routeInfoShell.classList.remove("collapsed");
      newRouteShell.classList.add("hidden");
      routeInfoShell.classList.remove("hidden");
    }

    function setAirportAsDeparture(feature) {
      if (route.length >= 2) {
        clearRouteForAirportEndpointSelection();
      } else {
        routeModeActive = true;
        sameOriginDestination = false;
      }

      const departure = airportFeatureToRoutePoint(feature);

      if (pendingDestinationAirport) {
        const destinationFeature = pendingDestinationAirport;
        pendingDestinationAirport = null;
        route = [
          departure,
          airportFeatureToRoutePoint(destinationFeature)
        ];
      } else if (route.length === 1) {
        route[0] = departure;
      } else {
        route = [departure];
      }

      renderRoute({ autoOpen: true });
    }

    function setAirportAsDestination(feature) {
      if (route.length >= 2) {
        clearRouteForAirportEndpointSelection();
      } else {
        routeModeActive = true;
        sameOriginDestination = false;
      }

      if (route.length === 1) {
        route.push(airportFeatureToRoutePoint(feature));
        pendingDestinationAirport = null;
        renderRoute({ autoOpen: true });
        return;
      }

      pendingDestinationAirport = feature;
      renderRoute({ autoOpen: true });
    }

    function makeAirportDomMarker(feature) {
      const props = feature.properties || {};
      const iconGroup = props.iconGroup;
      const coordinates = feature.geometry.coordinates;

      const element = document.createElement("div");
      element.className = "airport-dom-marker";
      element.setAttribute("role", "button");
      element.setAttribute(
        "aria-label",
        `${props.nameKo ?? ""} ${props.icao ?? ""}`
      );
      element.title = `${props.nameKo ?? ""} / ${props.nameEn ?? ""} / ${props.icao ?? ""}`;

      const img = document.createElement("img");
      img.alt = "";
      img.src = AIRPORT_LAYER_CONFIG.iconUrls[iconGroup] ||
        AIRPORT_LAYER_CONFIG.iconUrls.other;

      element.appendChild(img);

      let pressStart = 0;
      let pressMoved = false;
      let startX = 0;
      let startY = 0;

      element.addEventListener("touchstart", (event) => {
        const touch = event.touches?.[0];
        if (!touch) return;

        pressStart = performance.now();
        pressMoved = false;
        startX = touch.clientX;
        startY = touch.clientY;

        // Prevent map route creation / drag from starting under the icon.
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("touchmove", (event) => {
        const touch = event.touches?.[0];
        if (!touch) return;

        if (Math.hypot(touch.clientX - startX, touch.clientY - startY) > 10) {
          pressMoved = true;
        }
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("touchend", (event) => {
        event.stopPropagation();
      }, { passive: true });

      element.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (longPressSuppressed()) return;

        // Guard against a long stationary touch synthesized as click.
        if (pressStart > 0 && !pressMoved &&
            performance.now() - pressStart >= LONG_PRESS_MS) {
          return;
        }

        showAirportPopup(feature);
      });

      element.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        event.stopPropagation();
      });

      const marker = new maplibregl.Marker({
        element,
        anchor: "bottom",
        rotationAlignment: "viewport",
        pitchAlignment: "viewport"
      })
        .setLngLat(coordinates)
        .addTo(map);

      return {
        marker,
        element,
        feature,
        iconGroup
      };
    }

    function aircraftDeclination() {
      return declination(aircraft.latitude, aircraft.longitude) ?? 0;
    }

    function aircraftTrueHeading() {
      // true = magnetic + easterly variation (west is negative)
      return norm(aircraft.magneticHeading + aircraftDeclination());
    }

    function aircraftScreenRotation() {
      // Aircraft must always visually point toward its actual travel direction,
      // regardless of map rotation.
      return norm(aircraftTrueHeading() - map.getBearing());
    }

    function feetToMeters(feet) {
      return Number(feet) * 0.3048;
    }

    function aircraftTerrainMslFeet() {
      const meters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      return meters == null ? null : meters * 3.28084;
    }

    function aircraftAglFeet() {
      const terrainFeet = aircraftTerrainMslFeet();
      if (terrainFeet == null) return null;
      return aircraft.altitudeMslFeet - terrainFeet;
    }

    function formatFeetValue(value) {
      if (value == null || !Number.isFinite(value)) return "---";
      return `${Math.round(value).toLocaleString()} ft`;
    }

    function extractProjectionMatrix(matrixLike) {
      if (!matrixLike) return null;
      if (Array.isArray(matrixLike) || ArrayBuffer.isView(matrixLike)) {
        return matrixLike;
      }
      if (matrixLike.defaultProjectionData?.mainMatrix) {
        return matrixLike.defaultProjectionData.mainMatrix;
      }
      if (matrixLike.mainMatrix) return matrixLike.mainMatrix;
      if (matrixLike.projectionMatrix) return matrixLike.projectionMatrix;
      return null;
    }

    function projectMercatorCoordinate(merc, matrixLike = aircraftProjectionMatrix) {
      const matrix = extractProjectionMatrix(matrixLike);
      if (!matrix) return null;

      const x = merc.x;
      const y = merc.y;
      const z = merc.z ?? 0;
      const w0 = 1;

      const clipX = matrix[0] * x + matrix[4] * y + matrix[8]  * z + matrix[12] * w0;
      const clipY = matrix[1] * x + matrix[5] * y + matrix[9]  * z + matrix[13] * w0;
      const clipW = matrix[3] * x + matrix[7] * y + matrix[11] * z + matrix[15] * w0;

      if (!Number.isFinite(clipX) || !Number.isFinite(clipY) || !Number.isFinite(clipW) || Math.abs(clipW) < 1e-9) {
        return null;
      }

      const ndcX = clipX / clipW;
      const ndcY = clipY / clipW;

      const width = map.getContainer().clientWidth;
      const height = map.getContainer().clientHeight;

      return {
        x: (ndcX * 0.5 + 0.5) * width,
        y: (-ndcY * 0.5 + 0.5) * height,
        clipW
      };
    }

    function projectLngLatAltitude(longitude, latitude, altitudeMeters, matrixLike = aircraftProjectionMatrix) {
      const merc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        Number(altitudeMeters)
      );
      return projectMercatorCoordinate(merc, matrixLike);
    }

    function updateAircraftMarkerVisuals(matrixLike = aircraftProjectionMatrix) {
      if (!aircraftMarker) return;
      const el = aircraftMarker.getElement();
      const symbolTilt = el.querySelector(".aircraft-symbol-tilt");
      const symbol = el.querySelector(".aircraft-symbol");
      const stem = el.querySelector(".aircraft-altitude-stem");
      const card = el.querySelector(".aircraft-altitude-card");
      const ground = el.querySelector(".aircraft-ground-anchor");
      const mslValue = el.querySelector(".aircraft-msl-value");
      const aglValue = el.querySelector(".aircraft-agl-value");
      if (!symbolTilt || !symbol || !stem || !card || !ground || !mslValue || !aglValue) return;

      mslValue.textContent = formatFeetValue(aircraft.altitudeMslFeet);
      aglValue.textContent = formatFeetValue(aircraftAglFeet());

      const terrainMeters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      const aircraftMetersMsl = feetToMeters(aircraft.altitudeMslFeet);

      const groundPoint = terrainMeters == null
        ? null
        : projectLngLatAltitude(aircraft.longitude, aircraft.latitude, terrainMeters, matrixLike);

      const aircraftPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        aircraftMetersMsl,
        matrixLike
      );

      // If DEM or projection data is not ready yet, keep the card visible
      // but do not invent a pillar length.
      if (!groundPoint || !aircraftPoint) {
        el.style.height = "52px";
        symbolTilt.style.left = "50%";
        symbolTilt.style.bottom = "0px";
        symbolTilt.style.transform =
          `translateX(-50%) perspective(420px) rotateX(${map.getPitch()}deg)`;
        symbol.style.transform = `rotate(${aircraftScreenRotation()}deg)`;
        stem.style.opacity = "0";
        stem.style.height = "0px";
        ground.style.opacity = "0";
        card.style.opacity = "1";
        card.style.left = "calc(50% + 18px)";
        card.style.bottom = "18px";
        return;
      }

      const dx = aircraftPoint.x - groundPoint.x;
      const dy = groundPoint.y - aircraftPoint.y;
      const distancePx = Math.sqrt(dx * dx + dy * dy);
      const angleDeg = Math.atan2(dx, dy) * 180 / Math.PI;

      const clampedBottom = Math.max(0, dy);
      const visible = distancePx >= 1;

      el.style.height = `${Math.max(52, 48 + clampedBottom)}px`;

      symbolTilt.style.left = `calc(50% + ${dx}px)`;
      symbolTilt.style.bottom = `${clampedBottom}px`;

      // The aircraft icon represents a horizontal aircraft body.
      // As map pitch increases (lower viewing angle), visually tilt the icon
      // away from the viewer while preserving heading rotation independently.
      const pitch = map.getPitch();
      symbolTilt.style.transform =
        `translateX(-50%) perspective(420px) rotateX(${pitch}deg)`;
      symbol.style.transform = `rotate(${aircraftScreenRotation()}deg)`;

      stem.style.height = `${Math.max(0, distancePx - 10)}px`;
      stem.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;
      stem.style.opacity = visible ? "0.96" : "0";

      ground.style.opacity = visible ? "1" : "0";

      card.style.opacity = "1";
      card.style.left = `calc(50% + ${dx + 18}px)`;
      card.style.bottom = `${visible ? Math.max(18, clampedBottom * 0.58) : 18}px`;
    }

    function updateAircraftMarkerRotation() {
      updateAircraftMarkerVisuals();

    function ensureAircraftProjectionLayer() {
      if (map.getLayer("aircraft-overlay-sync")) return;

      });
    }

    function compileRoute3DShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader) || "Unknown shader compile error";
        gl.deleteShader(shader);
        throw new Error(message);
      }
      return shader;
    }

    function routePointAltitudeFeet(point) {
      const value = Number(point?.altitudeMslFeet);
      return Number.isFinite(value) ? value : null;
    }

    function syncVisibleRouteAltitudeInputs(fromPointIndex = 0) {
      const inputs = document.querySelectorAll(
        ".route-point-altitude-input[data-route-point-id]"
      );

      inputs.forEach(input => {
        const pointId = Number(input.dataset.routePointId);
        const index = route.findIndex(p => p.id === pointId);
        if (index < 0 || index < fromPointIndex) return;

        // Never overwrite the field the user is currently typing into.
        if (document.activeElement === input) return;

        const point = route[index];
        input.value = Number.isFinite(point.altitudeMslFeet)
          ? String(Math.round(point.altitudeMslFeet))
          : "0";
        input.classList.remove("invalid");
      });
    }

    function setRoutePointAltitudeMslFeet(
      pointId,
      value,
      inputElement = null,
      { rerender = false } = {}
    ) {
      const pointIndex = route.findIndex(p => p.id === pointId);
      if (pointIndex < 0) return false;

      // Let the input stay temporarily blank while the user edits it.
      // Commit-to-zero happens on blur/change instead.
      if (value === "" || value == null) {
        if (inputElement) inputElement.classList.remove("invalid");
        return true;
      }

      const altitude = Number(value);

      if (!Number.isFinite(altitude) || altitude < 0 || altitude > 60000) {
        if (inputElement) inputElement.classList.add("invalid");
        return false;
      }

      for (let i = pointIndex; i < route.length; i++) {
        route[i].altitudeMslFeet = altitude;
      }

      if (inputElement) {
        inputElement.classList.remove("invalid");
      }

      // Propagate the new altitude visually without rebuilding the whole Route Info.
      syncVisibleRouteAltitudeInputs(pointIndex + 1);

      refreshRoute3D();

      if (rerender) {
        updateRouteInfo();
      }

      return true;
    }

    function interpolateRouteLocation(a, b, fraction) {
      if (fraction <= 0) {
        return { latitude: a.latitude, longitude: a.longitude };
      }
      if (fraction >= 1) {
        return { latitude: b.latitude, longitude: b.longitude };
      }

      const distanceMeters = gcDistanceMeters(a, b);
      const bearing = trueBearing(a, b);
      return destinationPoint(
        a.latitude,
        a.longitude,
        bearing,
        distanceMeters * fraction
      );
    }

    function mercatorXYZ(longitude, latitude, altitudeMeters) {
      const c = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        Number(altitudeMeters)
      );
      return [c.x, c.y, c.z];
    }

    function pushXYZ(target, xyz) {
      target.push(xyz[0], xyz[1], xyz[2]);
    }

    function buildAndCacheRouteTerrainProfile() {
      const topLines = [];
      const curtainTriangles = [];
      const dropLines = [];
      const cachedLegs = [];
      let missingTerrainSamples = 0;

      const signature = currentRoute3DSignature();

      if (route.length < 2) {
        routeTerrainProfileCache = {
          signature,
          geometry: emptyRoute3DGeometry(),
          legs: [],
          sampledAt: new Date().toISOString(),
          sampledAtZoom: map.getZoom(),
          missingTerrainSamples: 0,
          locked: true
        };
        return routeTerrainProfileCache.geometry;
      }

      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i];
        const b = route[i + 1];
        const altAFeet = routePointAltitudeFeet(a);
        const altBFeet = routePointAltitudeFeet(b);

        if (altAFeet == null || altBFeet == null) continue;

        const distanceMeters = gcDistanceMeters(a, b);
        const distanceNM = distanceMeters / M_PER_NM;
        const sampleCount = Math.max(
          1,
          Math.min(256, Math.ceil(distanceNM / ROUTE_TERRAIN_SAMPLE_NM))
        );

        const samples = [];

        for (let s = 0; s <= sampleCount; s++) {
          const t = s / sampleCount;
          const ll = interpolateRouteLocation(a, b, t);
          const altitudeFeet = altAFeet + (altBFeet - altAFeet) * t;
          const altitudeMeters = altitudeFeet * 0.3048;

          // DEM is sampled HERE ONCE for this route geometry revision.
          // It is not queried again by the render loop after the cache locks.
          const terrainMeters = terrainElevationMeters(
            ll.latitude,
            ll.longitude
          );

          if (terrainMeters == null) {
            missingTerrainSamples += 1;
          }

          samples.push({
            t,
            latitude: ll.latitude,
            longitude: ll.longitude,
            routeMslFeet: altitudeFeet,
            altitudeMeters,
            terrainMeters,
            top: mercatorXYZ(
              ll.longitude,
              ll.latitude,
              altitudeMeters
            ),
            ground: terrainMeters == null
              ? null
              : mercatorXYZ(
                  ll.longitude,
                  ll.latitude,
                  terrainMeters
                )
          });
        }

        // Top route line is independent from DEM and remains exact MSL.
        for (let s = 0; s < samples.length - 1; s++) {
          pushXYZ(topLines, samples[s].top);
          pushXYZ(topLines, samples[s + 1].top);
        }

        // Curtain bottom is built from the FIXED cached DEM samples.
        for (let s = 0; s < samples.length - 1; s++) {
          const p0 = samples[s];
          const p1 = samples[s + 1];
          if (!p0.ground || !p1.ground) continue;

          pushXYZ(curtainTriangles, p0.top);
          pushXYZ(curtainTriangles, p0.ground);
          pushXYZ(curtainTriangles, p1.top);

          pushXYZ(curtainTriangles, p1.top);
          pushXYZ(curtainTriangles, p0.ground);
          pushXYZ(curtainTriangles, p1.ground);
        }

        // Drop lines also sample DEM once and become part of the fixed cache.
        const dropSamples = [];
        const dropDistances = [0];

        for (
          let d = ROUTE_DROP_LINE_NM;
          d < distanceNM - 1e-6;
          d += ROUTE_DROP_LINE_NM
        ) {
          dropDistances.push(d);
        }

        if (distanceNM > 1e-6) {
          dropDistances.push(distanceNM);
        }

        for (const dNM of dropDistances) {
          const t = distanceNM > 0 ? dNM / distanceNM : 0;
          const ll = interpolateRouteLocation(a, b, t);
          const altitudeFeet = altAFeet + (altBFeet - altAFeet) * t;
          const altitudeMeters = altitudeFeet * 0.3048;
          const terrainMeters = terrainElevationMeters(
            ll.latitude,
            ll.longitude
          );

          if (terrainMeters == null) {
            missingTerrainSamples += 1;
            continue;
          }

          const top = mercatorXYZ(
            ll.longitude,
            ll.latitude,
            altitudeMeters
          );
          const ground = mercatorXYZ(
            ll.longitude,
            ll.latitude,
            terrainMeters
          );

          pushXYZ(dropLines, top);
          pushXYZ(dropLines, ground);

          dropSamples.push({
            distanceNM: dNM,
            fraction: t,
            latitude: ll.latitude,
            longitude: ll.longitude,
            routeMslFeet: altitudeFeet,
            terrainMslFeet: terrainMeters * 3.28084,
            aglFeet: altitudeFeet - terrainMeters * 3.28084
          });
        }

        cachedLegs.push({
          legIndex: i,
          fromPointId: a.id,
          toPointId: b.id,
          fromMslFeet: altAFeet,
          toMslFeet: altBFeet,
          distanceNM,
          samples: samples.map(sample => ({
            fraction: sample.t,
            latitude: sample.latitude,
            longitude: sample.longitude,
            routeMslFeet: sample.routeMslFeet,
            terrainMslFeet:
              sample.terrainMeters == null
                ? null
                : sample.terrainMeters * 3.28084,
            aglFeet:
              sample.terrainMeters == null
                ? null
                : sample.routeMslFeet -
                  sample.terrainMeters * 3.28084
          })),
          dropSamples
        });
      }

      const geometry = {
        topLines: new Float32Array(topLines),
        curtainTriangles: new Float32Array(curtainTriangles),
        dropLines: new Float32Array(dropLines)
      };

      routeTerrainProfileCache = {
        signature,
        geometry,
        legs: cachedLegs,
        sampledAt: new Date().toISOString(),
        sampledAtZoom: map.getZoom(),
        missingTerrainSamples,
        // Once there are no missing DEM values, freeze the terrain profile.
        locked: missingTerrainSamples === 0
      };

      return geometry;
    }

    function getCachedRoute3DGeometry() {
      const signature = currentRoute3DSignature();

      if (
        routeTerrainProfileCache.signature !== signature ||
        !routeTerrainProfileCache.geometry
      ) {
        return buildAndCacheRouteTerrainProfile();
      }

      return routeTerrainProfileCache.geometry;
    }

    function invalidateRouteTerrainProfileCache() {
      routeTerrainProfileCache.signature = null;
      routeTerrainProfileCache.geometry = null;
      routeTerrainProfileCache.legs = [];
      routeTerrainProfileCache.sampledAt = null;
      routeTerrainProfileCache.sampledAtZoom = null;
      routeTerrainProfileCache.missingTerrainSamples = 0;
      routeTerrainProfileCache.locked = false;
    }

    function resampleRouteTerrainProfile() {
      invalidateRouteTerrainProfileCache();
      const geometry = buildAndCacheRouteTerrainProfile();

      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }

      return {
        locked: routeTerrainProfileCache.locked,
        missingTerrainSamples:
          routeTerrainProfileCache.missingTerrainSamples,
        sampledAt: routeTerrainProfileCache.sampledAt,
        sampledAtZoom: routeTerrainProfileCache.sampledAtZoom,
        geometry
      };
    }

    function maybeCompleteRouteTerrainProfileCache() {
      if (route.length < 2) return;
      if (routeTerrainProfileCache.locked) return;

      const signature = currentRoute3DSignature();

      if (routeTerrainProfileCache.signature !== signature) {
        return;
      }

      // Only incomplete caches are allowed to retry.
      // A fully sampled/locked profile never changes because of camera movement.
      buildAndCacheRouteTerrainProfile();

      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }
    }

    function getRoute3DAltitudeDiagnostics() {
      const signature = currentRoute3DSignature();

      if (
        routeTerrainProfileCache.signature !== signature ||
        !routeTerrainProfileCache.geometry
      ) {
        buildAndCacheRouteTerrainProfile();
      }

      const legs = routeTerrainProfileCache.legs.map(leg => {
        const samples = leg.samples || [];
        const midIndex = samples.length
          ? Math.floor(samples.length / 2)
          : -1;
        const mid = midIndex >= 0 ? samples[midIndex] : null;

        return {
          legIndex: leg.legIndex,
          fromMslFeet: leg.fromMslFeet,
          toMslFeet: leg.toMslFeet,
          midpointRouteMslFeet: mid?.routeMslFeet ?? null,
          midpointTerrainMslFeet: mid?.terrainMslFeet ?? null,
          midpointAglFeet: mid?.aglFeet ?? null
        };
      });

      return {
        verticalExaggerationAppliedByRouteCode: false,
        terrainExaggeration: 1,
        routeAltitudeConversion: "feet * 0.3048 -> meters MSL",
        terrainSamplingMode: "fixed cached profile",
        cameraMovementResamplesTerrain: false,
        cacheLocked: routeTerrainProfileCache.locked,
        missingTerrainSamples:
          routeTerrainProfileCache.missingTerrainSamples,
        sampledAt: routeTerrainProfileCache.sampledAt,
        sampledAtZoom: routeTerrainProfileCache.sampledAtZoom,
        note:
          "Once cacheLocked=true, pan/zoom/pitch changes only camera projection. " +
          "They do not change the MSL/DEM values used by the route curtain.",
        legs
      };
    }

    function drawRoute3DGeometry(gl, vertices, mode, matrix, color) {
      if (!vertices || vertices.length < 3) return;

      const state = route3DLayerState;

      gl.bindBuffer(gl.ARRAY_BUFFER, state.buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.DYNAMIC_DRAW);

      gl.enableVertexAttribArray(state.aPosition);
      gl.vertexAttribPointer(
        state.aPosition,
        3,
        gl.FLOAT,
        false,
        0,
        0
      );

      gl.uniformMatrix4fv(state.uMatrix, false, matrix);
      gl.uniform4f(state.uColor, color[0], color[1], color[2], color[3]);
      gl.drawArrays(mode, 0, vertices.length / 3);
    }

    function ensureRoute3DLayer() {
      if (map.getLayer("route-3d-msl")) return;

      map.addLayer({
        id: "route-3d-msl",
        type: "custom",
        renderingMode: "3d",

        onAdd(mapInstance, gl) {
          const vertexSource = `
            precision highp float;
            uniform mat4 u_matrix;
            attribute vec3 a_position;

            void main() {
              gl_Position = u_matrix * vec4(a_position, 1.0);
            }
          `;

          const fragmentSource = `
            precision mediump float;
            uniform vec4 u_color;

            void main() {
              gl_FragColor = u_color;
            }
          `;

          const vs = compileRoute3DShader(gl, gl.VERTEX_SHADER, vertexSource);
          const fs = compileRoute3DShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

          const program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);

          gl.deleteShader(vs);
          gl.deleteShader(fs);

          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            const message = gl.getProgramInfoLog(program) || "Unknown route 3D program link error";
            gl.deleteProgram(program);
            throw new Error(message);
          }

          route3DLayerState.program = program;
          route3DLayerState.buffer = gl.createBuffer();
          route3DLayerState.aPosition = gl.getAttribLocation(program, "a_position");
          route3DLayerState.uMatrix = gl.getUniformLocation(program, "u_matrix");
          route3DLayerState.uColor = gl.getUniformLocation(program, "u_color");
        },

        render(gl, matrixLike) {
          const matrix = extractProjectionMatrix(matrixLike);
          if (!matrix) return;

          const state = route3DLayerState;
          if (!state.program || !state.buffer) return;

          const geometry = getCachedRoute3DGeometry();

          gl.useProgram(state.program);
          gl.enable(gl.DEPTH_TEST);
          gl.depthFunc(gl.LEQUAL);
          gl.disable(gl.CULL_FACE);

          // Curtain first. It is translucent and does not write depth.
          if (geometry.curtainTriangles.length >= 9) {
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.depthMask(false);
            drawRoute3DGeometry(
              gl,
              geometry.curtainTriangles,
              gl.TRIANGLES,
              matrix,
              [0.08, 0.55, 0.95, 0.22]
            );
            gl.depthMask(true);
          }

          // Vertical DEM drop lines.
          if (geometry.dropLines.length >= 6) {
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.lineWidth(1.5);
            drawRoute3DGeometry(
              gl,
              geometry.dropLines,
              gl.LINES,
              matrix,
              [0.96, 0.98, 1.0, 0.78]
            );
          }

          // Top MSL flight path last for maximum readability.
          if (geometry.topLines.length >= 6) {
            gl.disable(gl.BLEND);
            gl.lineWidth(3.0);
            drawRoute3DGeometry(
              gl,
              geometry.topLines,
              gl.LINES,
              matrix,
              [0.20, 0.76, 1.0, 1.0]
            );
          }
        },

        onRemove(mapInstance, gl) {
          if (route3DLayerState.buffer) {
            gl.deleteBuffer(route3DLayerState.buffer);
            route3DLayerState.buffer = null;
          }
          if (route3DLayerState.program) {
            gl.deleteProgram(route3DLayerState.program);
            route3DLayerState.program = null;
          }
        }
      });
    }

    function refreshRoute3D() {
      // This function is called by route geometry/altitude changes.
      // Route changes intentionally invalidate the fixed DEM profile.
      invalidateRouteTerrainProfileCache();

      if (route.length >= 2 && terrainReady) {
        buildAndCacheRouteTerrainProfile();
      }

      if (map && typeof map.triggerRepaint === "function") {
        map.triggerRepaint();
      }
    }

    function updateCompassRotation() {
      if (!compassRotor) return;
      // Compass north needle points toward geographic north on the current screen.
      compassRotor.style.transform = `rotate(${-map.getBearing()}deg)`;
    }

    function headingUpAircraftScreenPoint() {
      const container = map.getContainer();
      return {
        x: container.clientWidth / 2,
        y: container.clientHeight * (2 / 3)
      };
    }

    function aircraftVerticalScreenVector() {
      const terrainMeters = terrainElevationMeters(
        aircraft.latitude,
        aircraft.longitude
      );
      if (terrainMeters == null) {
        return { dx: 0, dy: 0, ready: false };
      }

      const aircraftMetersMsl = feetToMeters(aircraft.altitudeMslFeet);

      const groundPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        terrainMeters,
        aircraftProjectionMatrix
      );

      const elevatedPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        aircraftMetersMsl,
        aircraftProjectionMatrix
      );

      if (!groundPoint || !elevatedPoint) {
        return { dx: 0, dy: 0, ready: false };
      }

      // Elevated symbol screen location relative to its ground coordinate.
      return {
        dx: elevatedPoint.x - groundPoint.x,
        dy: groundPoint.y - elevatedPoint.y,
        ready: true
      };
    }

    function headingUpGroundOffsetForAircraftSymbol() {
      const container = map.getContainer();
      const target = headingUpAircraftScreenPoint();
      const screenCenter = {
        x: container.clientWidth / 2,
        y: container.clientHeight / 2
      };

      const vertical = aircraftVerticalScreenVector();

      // The MapLibre Marker's geographical anchor is the ground lat/lon.
      // To place the ELEVATED aircraft symbol at target:
      //
      // symbolX = groundX + dx
      // symbolY = groundY - dy
      //
      // therefore:
      // groundX = targetX - dx
      // groundY = targetY + dy
      const desiredGroundX = target.x - vertical.dx;
      const desiredGroundY = target.y + vertical.dy;

      return [
        desiredGroundX - screenCenter.x,
        desiredGroundY - screenCenter.y
      ];
    }

    let programmaticFollowUpdate = false;
    let activeTouchCount = 0;
    let suppressFollowUntil = 0;

    // iPad long-press suppression.
    // A stationary press >= 450 ms must perform NO map/route action.
    const LONG_PRESS_MS = 450;
    const LONG_PRESS_MOVE_PX = 12;
    let touchPressState = {
      active: false,
      startTime: 0,
      startX: 0,
      startY: 0,
      moved: false,
      wasLongPress: false
    };
    let suppressTapUntil = 0;

    function longPressSuppressed() {
      return performance.now() < suppressTapUntil;
    }

    function userCameraGestureActive() {
      return (
        headingGestureActive ||
        activeTouchCount >= 2 ||
        performance.now() < suppressFollowUntil ||
        map.isZooming() ||
        map.isRotating()
      );
    }

    function applyAircraftAnchoredCamera({
      bearing = map.getBearing(),
      zoom = map.getZoom(),
      pitch = map.getPitch(),
      animate = false,
      secondPass = true
    } = {}) {
      if (userCameraGestureActive()) return;

      const offset = headingUpGroundOffsetForAircraftSymbol();

      programmaticFollowUpdate = true;

      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing,
        zoom,
        pitch,
        offset,
        duration: animate ? 300 : 0,
        essential: true
      });

      // The aircraft-ground screen separation changes slightly after the
      // camera center moves under perspective. Do one correction pass after
      // MapLibre has produced the new projection matrix.
      if (secondPass && !animate) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            programmaticFollowUpdate = false;

            if (
              followMode === "heading" &&
              !followSuspendedByUser &&
              !userCameraGestureActive()
            ) {
              const correctedOffset = headingUpGroundOffsetForAircraftSymbol();

              programmaticFollowUpdate = true;
              map.easeTo({
                center: [aircraft.longitude, aircraft.latitude],
                bearing: aircraftTrueHeading(),
                zoom: map.getZoom(),
                pitch: map.getPitch(),
                offset: correctedOffset,
                duration: 0,
                essential: true
              });

              requestAnimationFrame(() => {
                programmaticFollowUpdate = false;
              });
            }
          });
        });
      } else {
        setTimeout(() => {
          programmaticFollowUpdate = false;
        }, animate ? 320 : 0);
      }
    }

    function applyNorthUpCentered({ animate = true } = {}) {
      followMode = "north";
      followSuspendedByUser = false;
      orientationBtn.classList.remove("heading-active");

      programmaticFollowUpdate = true;
      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing: 0,
        offset: [0, 0],
        duration: animate ? 500 : 0,
        essential: true
      });

      setTimeout(() => {
        programmaticFollowUpdate = false;
      }, animate ? 520 : 0);
    }

    function applyHeadingUp({ animate = true } = {}) {
      followMode = "heading";
      followSuspendedByUser = false;
      orientationBtn.classList.add("heading-active");

      applyAircraftAnchoredCamera({
        bearing: aircraftTrueHeading(),
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        animate,
        secondPass: !animate
      });
    }

    function refreshFollowCamera({ animate = false } = {}) {
      if (followMode !== "heading") return;
      if (followSuspendedByUser) return;
      if (userCameraGestureActive()) return;

      applyAircraftAnchoredCamera({
        bearing: aircraftTrueHeading(),
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        animate,
        secondPass: true
      });
    }

    function updateAircraftPosition(
      latitude,
      longitude,
      magneticHeading = aircraft.magneticHeading,
      altitudeMslFeet = aircraft.altitudeMslFeet
    ) {
      aircraft.latitude = Number(latitude);
      aircraft.longitude = Number(longitude);
      aircraft.magneticHeading = Number(magneticHeading);
      aircraft.altitudeMslFeet = Number(altitudeMslFeet);

      if (aircraftMarker) {
        aircraftMarker.setLngLat([aircraft.longitude, aircraft.latitude]);
      }

      updateAircraftMarkerVisuals();

      // Follow ownship only when the pilot is not actively manipulating
      // pitch/zoom/rotation. This is critical on iPad Safari because the
      // simulated GPS update runs every animation frame.
      if (
        followMode === "heading" &&
        !followSuspendedByUser &&
        !userCameraGestureActive()
      ) {
        refreshFollowCamera({ animate: false });
      }
    }

    // ===== Tracking test simulation =====
    // 100 kt for 10 sec on 150°M, then 10 sec on 330°M, repeating.
    const simulation = {
      running: false,
      speedKnots: 100,
      legSeconds: 10,
      headingsMagnetic: [150, 330],
      currentLegIndex: 0,
      legElapsedSeconds: 0,
      lastTimestamp: null,
      rafId: null
    };

    const KNOT_TO_MPS = 0.5144444444444445;

    function destinationPoint(latDeg, lonDeg, trueBearingDeg, distanceMeters) {
      const R = 6371008.8;
      const delta = distanceMeters / R;
      const theta = toRad(trueBearingDeg);

      const phi1 = toRad(latDeg);
      const lambda1 = toRad(lonDeg);

      const sinPhi1 = Math.sin(phi1);
      const cosPhi1 = Math.cos(phi1);
      const sinDelta = Math.sin(delta);
      const cosDelta = Math.cos(delta);

      const phi2 = Math.asin(
        sinPhi1 * cosDelta +
        cosPhi1 * sinDelta * Math.cos(theta)
      );

      const lambda2 = lambda1 + Math.atan2(
        Math.sin(theta) * sinDelta * cosPhi1,
        cosDelta - sinPhi1 * Math.sin(phi2)
      );

      return {
        latitude: toDeg(phi2),
        longitude: ((toDeg(lambda2) + 540) % 360) - 180
      };
    }

    function simulationStep(timestamp) {
      if (!simulation.running) return;

      if (simulation.lastTimestamp == null) {
        simulation.lastTimestamp = timestamp;
        simulation.rafId = requestAnimationFrame(simulationStep);
        return;
      }

      let dt = (timestamp - simulation.lastTimestamp) / 1000;
      simulation.lastTimestamp = timestamp;

      // Avoid huge jumps if the tab was backgrounded.
      dt = Math.max(0, Math.min(dt, 0.25));

      let remaining = dt;

      while (remaining > 0) {
        const timeLeftInLeg =
          simulation.legSeconds - simulation.legElapsedSeconds;
        const stepDt = Math.min(remaining, timeLeftInLeg);

        const magneticHeading =
          simulation.headingsMagnetic[simulation.currentLegIndex];

        // Convert current magnetic heading to true bearing using
        // declination at the aircraft's current position.
        aircraft.magneticHeading = magneticHeading;
        const trueHeading = aircraftTrueHeading();

        const distanceMeters =
          simulation.speedKnots * KNOT_TO_MPS * stepDt;

        const next = destinationPoint(
          aircraft.latitude,
          aircraft.longitude,
          trueHeading,
          distanceMeters
        );

        updateAircraftPosition(
          next.latitude,
          next.longitude,
          magneticHeading
        );

        simulation.legElapsedSeconds += stepDt;
        remaining -= stepDt;

        if (simulation.legElapsedSeconds >= simulation.legSeconds - 1e-9) {
          simulation.legElapsedSeconds = 0;
          simulation.currentLegIndex =
            (simulation.currentLegIndex + 1) %
            simulation.headingsMagnetic.length;
        }
      }

      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function startTrackingSimulation() {
      if (simulation.running) return;
      simulation.running = true;
      simulation.lastTimestamp = null;
      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function stopTrackingSimulation() {
      simulation.running = false;
      simulation.lastTimestamp = null;
      if (simulation.rafId != null) {
        cancelAnimationFrame(simulation.rafId);
        simulation.rafId = null;
      }
    }

    let route = [];

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLat(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "N" : "S"}`;
    }

    function formatLon(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "E" : "W"}`;
    }

    function gcDistanceMeters(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dp = toRad(b.latitude - a.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const h =
        Math.sin(dp/2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;

      return R_EARTH_M * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    }

    function trueBearing(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const y = Math.sin(dl) * Math.cos(p2);
      const x =
        Math.cos(p1) * Math.sin(p2) -
        Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

      return norm(toDeg(Math.atan2(y, x)));
    }

    function declination(lat, lon) {
      if (!magvarFn) return null;
      return magvarFn(lat, lon, 0, new Date());
    }

    function terrainElevationMeters(latitude, longitude) {
      if (!terrainReady) return null;
      if (typeof map.queryTerrainElevation !== "function") return null;

      const elevation = map.queryTerrainElevation(
        [Number(longitude), Number(latitude)],
        { exaggerated: false }
      );

      return Number.isFinite(elevation) ? elevation : null;
    }

    function legData(a, b) {
      const midLat = (a.latitude + b.latitude) / 2;
      const midLon = (a.longitude + b.longitude) / 2;
      const distanceNM = gcDistanceMeters(a, b) / M_PER_NM;

      if (distanceNM < 0.00001) {
        return {
          distanceNM: 0,
          bearingTrue: 0,
          declination: declination(midLat, midLon),
          bearingMagnetic: 0,
          midpoint: { latitude: midLat, longitude: midLon }
        };
      }

      const d = declination(midLat, midLon);
      const t = trueBearing(a, b);

      return {
        distanceNM,
        bearingTrue: t,
        declination: d,
        bearingMagnetic: d == null ? null : norm(t - d),
        midpoint: { latitude: midLat, longitude: midLon }
      };
    }

    function pointLabel(index) {
      if (index === 0) return "출발";

        "aria-label",
        `${displayPointName(point, index)} altitude MSL feet`

      input.value = String(Math.round(point.altitudeMslFeet));

      const unit = document.createElement("span");
      unit.className = "route-point-altitude-unit";
      unit.textContent = "FT MSL";

      input.dataset.routePointId = String(point.id);

      // Live typing updates the model and 3D route, but does NOT recreate
      // Route Info. Recreating the focused input was causing iPad Safari
      // to dismiss the numeric keyboard after the first digit.
      input.addEventListener("input", () => {
        setRoutePointAltitudeMslFeet(
          point.id,
          input.value,
          input,
          { rerender: false }
        );
      });

      const commitAltitude = () => {
        if (input.value === "") {
          input.value = "0";
        }

        setRoutePointAltitudeMslFeet(
          point.id,
          input.value,
          input,
          { rerender: false }
        );

        syncVisibleRouteAltitudeInputs(0);
      };

      input.addEventListener("change", commitAltitude);
      input.addEventListener("blur", commitAltitude);

      // The control must never trigger map pan/route drag.
      ["pointerdown", "touchstart", "mousedown", "click"].forEach(type => {
        input.addEventListener(type, event => {
          event.stopPropagation();
        });
      });

      wrap.appendChild(input);
      wrap.appendChild(unit);
      return wrap;
    }

    function createPointMarker(point, index) {
      const wrap = document.createElement("div");
      wrap.className = "route-point-wrap";

      const dot = document.createElement("div");
      dot.className = "route-point-dot";
      dot.textContent = pointLabel(index);

      const coords = document.createElement("div");
      coords.className = "route-point-coords";

      const nameHtml = point.name
        ? `<span class="route-point-name">${escapeHtml(point.name)}</span>`
        : "";

      coords.innerHTML =
        `${nameHtml}${formatLat(point.latitude)}<br>${formatLon(point.longitude)}`;

      wrap.appendChild(dot);
      wrap.appendChild(coords);

      // Marker drag has priority over route-line drag.
      // We set a synchronous guard on pointerdown without stopping propagation,
      // so MapLibre Marker can still start its native draggable behavior.
      let markerWasDragged = false;

      wrap.addEventListener("pointerdown", () => {
        pointPointerActive = true;
        suppressNextRouteDrag = true;
      });

      const marker = new maplibregl.Marker({
        element: wrap,
        anchor: "left",
        offset: [-12, 0],
        draggable: true
      })
      .setLngLat([point.longitude, point.latitude])
      .addTo(map);

      function updatePointDragPreview() {
        const currentIndex = route.findIndex(p => p.id === point.id);
        if (currentIndex < 0) {
          setPreview([]);
          return;
        }

        const ll = marker.getLngLat();
        const previewCoords = [];

        // Show only the temporary route segments connected to the moving point.
        // This mirrors the dashed preview used when creating a new VIA point.
        if (currentIndex > 0) {
          const prev = route[currentIndex - 1];
          previewCoords.push([prev.longitude, prev.latitude]);
        }

        previewCoords.push([ll.lng, ll.lat]);

        if (currentIndex < route.length - 1) {
          const next = route[currentIndex + 1];
          previewCoords.push([next.longitude, next.latitude]);
        }

        // For same-origin/destination mode, keep the preview meaningful
        // when either coincident endpoint is dragged.
        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0 && route.length > 2) {
            const next = route[1];
            setPreview([
              [ll.lng, ll.lat],
              [next.longitude, next.latitude]
            ]);
            return;
          }

          if (currentIndex === route.length - 1 && route.length > 2) {
            const prev = route[route.length - 2];
            setPreview([
              [prev.longitude, prev.latitude],
              [ll.lng, ll.lat]
            ]);
            return;
          }
        }

        setPreview(previewCoords);
      }

      marker.on("dragstart", () => {
        markerWasDragged = true;
        pointPointerActive = true;
        suppressNextRouteDrag = true;
        closePointPopup();
        map.dragPan.disable();
        updatePointDragPreview();
      });

      marker.on("drag", () => {
        updatePointDragPreview();
      });

      marker.on("dragend", () => {
        const ll = marker.getLngLat();
        const currentIndex = route.findIndex(p => p.id === point.id);
        const target = route[currentIndex];

        map.dragPan.enable();

        if (!target) {
          setPreview([]);
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
          return;
        }

        target.longitude = ll.lng;
        target.latitude = ll.lat;

        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0) {
            route[route.length - 1].longitude = ll.lng;
            route[route.length - 1].latitude = ll.lat;
          } else if (currentIndex === route.length - 1) {
            route[0].longitude = ll.lng;
            route[0].latitude = ll.lat;
          }
        }

        setPreview([]);
        renderRoute();

        // Browsers may emit a click immediately after dragend.
        // Keep the guard through that click cycle.
        setTimeout(() => {
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
        }, 0);
      });

      wrap.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();

        if (longPressSuppressed()) return;
        if (markerWasDragged) return;
        openPointPopup(point.id, wrap);
      });

      pointMarkers.push(marker);
    }

    function createLegMarker(a, b) {
      const leg = legData(a, b);

      const el = document.createElement("div");
      el.className = "leg-label";
      el.innerHTML = leg.bearingMagnetic == null
        ? `${leg.distanceNM.toFixed(2)} NM<br>MAG ERR`

      const marker = new maplibregl.Marker({

        anchor: "bottom",

      })
      .setLngLat([leg.midpoint.longitude, leg.midpoint.latitude])

    function renderRoute(options = {}) {
      ensureRouteLayers();
      updateRouteSource();

      clearPointMarkers();
      clearLegMarkers();

      route.forEach((p, i) => createPointMarker(p, i));

      for (let i = 0; i < route.length - 1; i++) {
        createLegMarker(route[i], route[i+1]);
      }

      updateRouteInfo(options);
      refreshRoute3D();

    function resetRoute(deactivate = false) {
      route = [];
      clearPointMarkers();
      clearLegMarkers();

      setPreview([]);

      sameOriginDestination = false;
      pendingDestinationAirport = null;

      if (deactivate) {
        routeModeActive = false;

    function addInitialPoint(lngLat) {
      route.push({
        id: nextPointId++,

        latitude: lngLat.lat

      renderRoute({

    function nearestSegmentIndex(point) {
      const pt = map.project(point);
      let bestIdx = -1;
      let bestDist = Infinity;

      for (let i = 0; i < route.length - 1; i++) {
        const a = map.project([route[i].longitude, route[i].latitude]);
        const b = map.project([route[i+1].longitude, route[i+1].latitude]);

        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = pt.x - a.x, apy = pt.y - a.y;
        const ab2 = abx*abx + aby*aby || 1;
        let t = (apx*abx + apy*aby) / ab2;
        t = Math.max(0, Math.min(1, t));

        const qx = a.x + t*abx;
        const qy = a.y + t*aby;
        const dx = pt.x - qx;
        const dy = pt.y - qy;
        const dist = Math.hypot(dx, dy);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function openPointPopup(pointId, markerElement) {
      selectedPointId = pointId;

      const index = route.findIndex(p => p.id === pointId);
      popupTitle.textContent = `${displayPointName(point, index)} 설정`;
      pointNameInput.value = point.name || "";
      samePointBtn.hidden = !(route.length === 1 && index === 0);

      const rect = markerElement.getBoundingClientRect();
      const popupWidth = 240;
      const left = Math.min(
        Math.max(10, rect.right + 8),
        window.innerWidth - popupWidth - 10
      );
      const top = Math.min(
        Math.max(10, rect.top - 10),
        window.innerHeight - 180
      );

      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      popup.hidden = false;
    }
