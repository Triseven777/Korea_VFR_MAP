    locateAircraftBtn.addEventListener("click", () => {
      // If the pilot manually panned away while heading-up was active,
      // one tap immediately resumes heading-up ownship tracking.
      if (followMode === "heading" && followSuspendedByUser) {
        applyHeadingUp();
        return;
      }

      // Otherwise preserve the requested alternating behavior:
      // click 1 => heading-up follow mode
      // click 2 => aircraft centered + north-up
      if (locateToggle % 2 === 0) {
        applyHeadingUp();
      } else {
        applyNorthUpCentered();
      }
      locateToggle += 1;
    });

    orientationBtn.addEventListener("click", () => {
      // Compass button has one job only: true north up.
      followMode = "north";
      map.easeTo({
        bearing: 0,
        duration: 450,
        essential: true
      });
    });

    map.on("rotate", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("move", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("zoom", () => {
      updateAircraftMarkerVisuals();
    });

    map.on("terrain", () => {
      updateAircraftMarkerVisuals();
    });

    map.on("idle", () => {
      updateAircraftMarkerVisuals();
    });

    // iPad Safari touch state.
    // A two-finger gesture owns the camera completely until both fingers are
    // released. The GPS/simulation follow loop is forbidden from changing the
    // camera during this period.
    const mapCanvas = map.getCanvas();

    mapCanvas.addEventListener("touchstart", (event) => {
      activeTouchCount = event.touches ? event.touches.length : 0;

      if (activeTouchCount === 1) {
        const t = event.touches[0];
        touchPressState.active = true;
        touchPressState.startTime = performance.now();
        touchPressState.startX = t.clientX;
        touchPressState.startY = t.clientY;
        touchPressState.moved = false;
        touchPressState.wasLongPress = false;
      } else {
        // Multi-touch is never a tap/long-press candidate.
        touchPressState.active = false;
      }

      if (activeTouchCount >= 2) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 500;
      }
    }, { passive: true });

    mapCanvas.addEventListener("touchmove", (event) => {
      activeTouchCount = event.touches ? event.touches.length : 0;

      if (touchPressState.active && activeTouchCount === 1) {
        const t = event.touches[0];
        const dx = t.clientX - touchPressState.startX;
        const dy = t.clientY - touchPressState.startY;

        if (Math.hypot(dx, dy) > LONG_PRESS_MOVE_PX) {
          touchPressState.moved = true;
        }
      }

      if (activeTouchCount >= 2) {
        touchPressState.active = false;
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 500;
      }
    }, { passive: true });

    function finishTouchCameraGesture(event) {
      const now = performance.now();
      const remainingTouches = event.touches ? event.touches.length : 0;

      if (
        touchPressState.active &&
        remainingTouches === 0 &&
        !touchPressState.moved
      ) {
        const duration = now - touchPressState.startTime;

        if (duration >= LONG_PRESS_MS) {
          touchPressState.wasLongPress = true;

          // Safari may synthesize a click after touchend.
          // Ignore that entire click cycle.
          suppressTapUntil = now + 900;

          // If the press began on the route hit line, make sure releasing it
          // cannot insert a VIA point.
          if (dragState.active && dragState.source === "touch") {
            dragState.longPressCancelled = true;
          }
        }
      }

      touchPressState.active = false;
      activeTouchCount = remainingTouches;

      if (activeTouchCount < 2) {
        headingGestureActive = false;
        // Safari often emits zoomend/pitchend slightly before the final
        // inertial camera frame. Give it time to settle before reacquiring.
        suppressFollowUntil = performance.now() + 350;

        setTimeout(() => {
          if (
            followMode === "heading" &&
            !followSuspendedByUser &&
            activeTouchCount < 2
          ) {
            refreshFollowCamera({ animate: false });
          }
        }, 380);
      }
    }

    mapCanvas.addEventListener("touchend", finishTouchCameraGesture, {
      passive: true
    });

    mapCanvas.addEventListener("touchcancel", finishTouchCameraGesture, {
      passive: true
    });

    // A ONE-finger pan releases heading-up follow.
    // A two-finger zoom/pitch gesture must never be interpreted as a pan-away.
    map.on("dragstart", () => {
      if (
        followMode === "heading" &&
        activeTouchCount < 2 &&
        !programmaticFollowUpdate
      ) {
        followSuspendedByUser = true;
      }
    });

    map.on("pitchstart", () => {
      if (!programmaticFollowUpdate) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 400;
      }
    });

    map.on("pitch", () => {
      updateAircraftMarkerVisuals();
      if (!programmaticFollowUpdate) {
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("pitchend", () => {
      updateAircraftMarkerVisuals();

      if (!programmaticFollowUpdate && activeTouchCount < 2) {
        headingGestureActive = false;
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("zoomstart", () => {
      if (!programmaticFollowUpdate) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 400;
      }
    });

    map.on("zoom", () => {
      updateAircraftMarkerVisuals();
      if (!programmaticFollowUpdate) {
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("zoomend", () => {
      if (!programmaticFollowUpdate && activeTouchCount < 2) {
        headingGestureActive = false;
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("load", async () => {
      terrainReady = true;

      ensureRouteLayers();
      ensureRoute3DLayer();
      ensureAircraftProjectionLayer();
      await ensureAirportLayers();

      // Explicitly enable MapLibre's native iPad gestures.
      // Two-finger parallel vertical drag changes pitch.
      if (map.touchPitch && typeof map.touchPitch.enable === "function") {
        map.touchPitch.enable();
      }
      if (map.touchZoomRotate && typeof map.touchZoomRotate.enable === "function") {
        map.touchZoomRotate.enable();
      }

      createAircraftMarker();
      updateCompassRotation();
      startTrackingSimulation();
      renderRoute();

      map.on("idle", () => {
        maybeCompleteRouteTerrainProfileCache();
      });

      // Diagnostic only. This value is DEM ground elevation in meters MSL,
      // not aircraft altitude and not a terrain-clearance decision.
      setTimeout(() => {
        const elevation = terrainElevationMeters(
          aircraft.latitude,
          aircraft.longitude
        );
        console.log(
          "3D terrain enabled. DEM ground elevation at ownship:",
          elevation == null ? "not loaded yet" : `${elevation.toFixed(1)} m MSL`
        );
        updateAircraftMarkerVisuals();
      }, 1200);

      map.on("mouseenter", "route-hit", () => {
        map.getCanvas().style.cursor = "grab";
      });

      map.on("mouseleave", "route-hit", () => {
        if (!dragState.active) map.getCanvas().style.cursor = "";
      });

      function startRouteDrag(lngLat, source = "mouse") {
        if (!routeModeActive) return false;
        if (route.length < 2) return false;
        if (pointPointerActive || suppressNextRouteDrag) return false;

        closePointPopup();

        dragState.active = true;
        dragState.segmentIndex = nearestSegmentIndex(lngLat);
        dragState.currentLngLat = lngLat;
        dragState.source = source;
        dragState.longPressCancelled = false;
        dragState.touchStartTime = source === "touch" ? performance.now() : null;
        dragState.touchMoved = false;

        map.dragPan.disable();
        map.getCanvas().style.cursor = "grabbing";
        dragHint.classList.add("show");

        const i = dragState.segmentIndex;
        const a = route[i];
        const b = route[i + 1];

        setPreview([
          [a.longitude, a.latitude],
          [lngLat.lng, lngLat.lat],
          [b.longitude, b.latitude]
        ]);
        return true;
      }

      function moveRouteDrag(lngLat) {
        if (!dragState.active) return;

        dragState.currentLngLat = lngLat;
        const i = dragState.segmentIndex;
        const a = route[i];
        const b = route[i + 1];
        if (!a || !b) return;

        setPreview([
          [a.longitude, a.latitude],
          [lngLat.lng, lngLat.lat],
          [b.longitude, b.latitude]
        ]);
      }

      function cancelRouteDrag() {
        dragState.active = false;
        dragState.segmentIndex = -1;
        dragState.currentLngLat = null;
        dragState.source = null;
        dragState.longPressCancelled = false;
        dragState.touchStartTime = null;
        dragState.touchMoved = false;
        setPreview([]);
        map.dragPan.enable();
        map.getCanvas().style.cursor = "";
        dragHint.classList.remove("show");
      }

      function finishRouteDrag(fallbackLngLat = null) {
        if (!dragState.active) return;

        // A point drag must never create a VIA point.
        if (pointPointerActive || suppressNextRouteDrag) {
          cancelRouteDrag();
          return;
        }

        const i = dragState.segmentIndex;
        const p = dragState.currentLngLat || fallbackLngLat;
        if (!p || i < 0 || i >= route.length - 1) {
          cancelRouteDrag();
          return;
        }

        const inheritedAltitude = routePointAltitudeFeet(route[i]) ?? 0;

        route.splice(i + 1, 0, {
          id: nextPointId++,
          name: "",
          altitudeMslFeet: inheritedAltitude,
          longitude: p.lng,
          latitude: p.lat
        });

        cancelRouteDrag();
        renderRoute();
      }

      // Desktop mouse support.
      map.on("mousedown", "route-hit", (e) => {
        if (e.originalEvent && e.originalEvent.button != null && e.originalEvent.button !== 0) return;
        e.preventDefault();
        startRouteDrag(e.lngLat, "mouse");
      });

      map.on("mousemove", (e) => {
        if (!dragState.active || dragState.source !== "mouse") return;
        moveRouteDrag(e.lngLat);
      });

      map.on("mouseup", (e) => {
        if (!dragState.active || dragState.source !== "mouse") return;
        finishRouteDrag(e.lngLat);
      });

      // iPad / touch support.
      // Only ONE finger may start a route-line drag.
      // Two fingers are deliberately left to MapLibre for pitch/zoom/rotate.
      map.on("touchstart", "route-hit", (e) => {
        const touches = e.originalEvent?.touches;
        if (!touches || touches.length !== 1) return;

        e.preventDefault();
        startRouteDrag(e.lngLat, "touch");
      });

      map.on("touchmove", (e) => {
        if (!dragState.active || dragState.source !== "touch") return;

        const touches = e.originalEvent?.touches;
        if (!touches || touches.length !== 1) {
          cancelRouteDrag();
          return;
        }

        if (touchPressState.moved) {
          dragState.touchMoved = true;
        }

        moveRouteDrag(e.lngLat);
      });

      map.on("touchend", (e) => {
        if (!dragState.active || dragState.source !== "touch") return;

        const duration = dragState.touchStartTime == null
          ? 0
          : performance.now() - dragState.touchStartTime;

        const isLongStationaryPress =
          duration >= LONG_PRESS_MS &&
          !dragState.touchMoved &&
          !touchPressState.moved;

        if (
          isLongStationaryPress ||
          dragState.longPressCancelled ||
          longPressSuppressed()
        ) {
          suppressTapUntil = performance.now() + 900;
          cancelRouteDrag();
          return;
        }

        finishRouteDrag(dragState.currentLngLat || e.lngLat);
      });

      map.on("touchcancel", () => {
        if (dragState.active && dragState.source === "touch") {
          cancelRouteDrag();
        }
      });

      function handleMapTap(e) {
        if (longPressSuppressed()) return;
        if (dragState.active) return;
        if (!routeModeActive) return;

        const features = map.queryRenderedFeatures(e.point, {
          layers: ["route-hit"]
        });

        if (features.length > 0 && route.length >= 2) return;

        if (route.length === 0 && pendingDestinationAirport) {
          const destinationFeature = pendingDestinationAirport;
          pendingDestinationAirport = null;

          route.push({
            id: nextPointId++,
            name: "",
            altitudeMslFeet: 0,
            longitude: e.lngLat.lng,
            latitude: e.lngLat.lat
          });

          route.push(airportFeatureToRoutePoint(destinationFeature));
          renderRoute({ autoOpen: true });
          return;
        }

        if (route.length < 2) {
          addInitialPoint(e.lngLat);
          return;
        }

        if (sameOriginDestination) {
          const insertIndex = route.length - 1;
          const inheritedAltitude = routePointAltitudeFeet(route[insertIndex - 1]) ?? 0;

          route.splice(insertIndex, 0, {
            id: nextPointId++,
            name: "",
            altitudeMslFeet: inheritedAltitude,
            longitude: e.lngLat.lng,
            latitude: e.lngLat.lat
          });
          renderRoute();
          return;
        }

        // Normal route already has departure/destination:
        // ordinary map tap intentionally does nothing.
      }

      // Safari turns a stationary single-finger tap into click.
      // Keeping a single handler prevents double execution on touch devices.
      map.on("click", handleMapTap);
    });

    window.movingMap = {
      map,

      getRoute() {
        return JSON.parse(JSON.stringify(route));
      },

      getRoutePointAltitudes() {
        return route.map((point, index) => ({
          id: point.id,
          index,
          name: displayPointName(point, index),
          altitudeMslFeet: routePointAltitudeFeet(point)
        }));
      },

      setRoutePointAltitudeMsl(pointId, altitudeFeet) {
        return setRoutePointAltitudeMslFeet(
          pointId,
          altitudeFeet,
          null,
          { rerender: true }
        );
      },

      clearRoute() {
        resetRoute(true);
      },

      startNewRoute() {
        routeModeActive = true;
        sameOriginDestination = false;
        updateRouteInfo({ autoOpen: true });
      },

      getAircraft() {
        return {
          ...aircraft,
          terrainMslFeet: aircraftTerrainMslFeet(),
          aglFeet: aircraftAglFeet(),
          magneticDeclination: aircraftDeclination(),
          trueHeading: aircraftTrueHeading(),
          followMode,
          followSuspendedByUser
        };
      },

      updateAircraft(
        latitude,
        longitude,
        magneticHeading = aircraft.magneticHeading,
        altitudeMslFeet = aircraft.altitudeMslFeet
      ) {
        updateAircraftPosition(latitude, longitude, magneticHeading, altitudeMslFeet);
      },

      setAircraftAltitudeMsl(altitudeMslFeet) {
        aircraft.altitudeMslFeet = Number(altitudeMslFeet);
        updateAircraftMarkerVisuals();
      },

      headingUp() {
        applyHeadingUp();
      },

      northUpCentered() {
        applyNorthUpCentered();
      },

      resumeAircraftFollow() {
        applyHeadingUp();
      },

      startTrackingSimulation() {
        startTrackingSimulation();
      },

      stopTrackingSimulation() {
        stopTrackingSimulation();
      },

      getSimulationState() {
        return {
          running: simulation.running,
          speedKnots: simulation.speedKnots,
          legSeconds: simulation.legSeconds,
          currentMagneticHeading:
            simulation.headingsMagnetic[simulation.currentLegIndex],
          legElapsedSeconds: simulation.legElapsedSeconds
        };
      },

      getTerrainElevation(latitude, longitude) {
        return terrainElevationMeters(latitude, longitude);
      },

      getTerrainStatus() {
        return {
          enabled: terrainReady,
          source: "Mapterhorn raster-dem",
          exaggeration: 1,
          operationalUse: false
        };
      },

      getHeadingUpDebug() {
        return {
          followMode,
          followSuspendedByUser,
          headingGestureActive,
          activeTouchCount,
          zoom: map.getZoom(),
          pitch: map.getPitch(),
          aircraftScreenTarget: headingUpAircraftScreenPoint(),
          aircraftVerticalScreenVector: aircraftVerticalScreenVector()
        };
      },

      getAirportLayerStatus() {
        return getAirportLayerStatus();
      },

      getRoute3DAltitudeDiagnostics() {
        return getRoute3DAltitudeDiagnostics();
      },

      resampleRouteTerrainProfile() {
        return resampleRouteTerrainProfile();
      },

      getTouchStatus() {
        return {
          iPadOptimized: true,
          mapTap: true,
          routePointTap: true,
          routeLineSingleFingerDrag: true,
          twoFingerPitch: true,
          touchZoomRotate: true,
          routePointAltitudeMsl3D: true,
          routeTerrainCurtain: true,
          routeDropLines: true,
          longPressAction: "none",
          longPressThresholdMs: LONG_PRESS_MS
        };
      }
    };
  })();
  </script>
</body>
</html>
