    const FIX_SNAP_RADIUS_PX = 32;
    const FIX_DETACH_RADIUS_PX = 48;
    function nearestRouteSnapFix(lngLat) {
      const pointer=map.project([lngLat.lng,lngLat.lat]);
      let nearest=null,best=FIX_SNAP_RADIUS_PX;
      for(const fix of customFixes){
        if(!fix.saved)continue;
        const position=map.project([fix.longitude,fix.latitude]);
        const distance=Math.hypot(pointer.x-position.x,pointer.y-position.y);
        if(distance<=best){nearest=fix;best=distance;}
      }
      return nearest;
    }
    function linkedFixDragPosition(point,lngLat,alreadyDetached) {
      const fix=customFixes.find(f=>f.id===point.customFixId&&f.saved);
      if(!fix || alreadyDetached)return {lngLat,detached:alreadyDetached};
      const origin=map.project([fix.longitude,fix.latitude]),candidate=map.project([lngLat.lng,lngLat.lat]);
      const detached=Math.hypot(candidate.x-origin.x,candidate.y-origin.y)>FIX_DETACH_RADIUS_PX;
      return {lngLat:detached?lngLat:{lng:fix.longitude,lat:fix.latitude},detached};
    }

    function createPointMarker(point, index) {
      const wrap = document.createElement("div");
      wrap.className = "route-point-wrap";

      const dot = document.createElement("div");
      dot.className = "route-point-dot";
      dot.textContent = pointLabel(index);

      const coords = document.createElement("div");
      coords.className = "route-point-coords";

      const pointName = (point.name || "").trim();
      const altitudeFeet = Number(point.altitudeMslFeet);
      const altitudeHtml =
        Number.isFinite(altitudeFeet) && altitudeFeet > 0
          ? `<span class="route-point-altitude-map">${Math.round(altitudeFeet).toLocaleString("en-US")} ft</span>`
          : "";

      if (pointName) {
        // Named points use the name instead of coordinates.
        coords.innerHTML =
          `<span class="route-point-name">${escapeHtml(pointName)}</span>${altitudeHtml}`;
      } else {
        coords.innerHTML =
          `${formatLat(point.latitude)}<br>${formatLon(point.longitude)}${altitudeHtml}`;
      }

      wrap.appendChild(dot);
      wrap.appendChild(coords);

      // Marker drag has priority over route-line drag.
      // We set a synchronous guard on pointerdown without stopping propagation,
      // so MapLibre Marker can still start its native draggable behavior.
      let markerWasDragged = false;
      let detachedFromFix = false;

      wrap.addEventListener("pointerdown", () => {
        pointPointerActive = true;
        suppressNextRouteDrag = true;
      });

      const marker = new maplibregl.Marker({
        element: wrap,
        anchor: "left",
        offset: [-12, 0],
        draggable: index > 0 && index < route.length - 1
      })
      .setLngLat([point.longitude, point.latitude])
      .addTo(map);

      function updatePointDragPreview() {
        const currentIndex = route.findIndex(p => p.id === point.id);
        if (currentIndex < 0) {
          setPreview([]);
          return;
        }

        const ll = marker.getLngLat();
        const previewCoords = [];

        // Show only the temporary route segments connected to the moving point.
        // This mirrors the dashed preview used when creating a new VIA point.
        if (currentIndex > 0) {
          const prev = route[currentIndex - 1];
          previewCoords.push([prev.longitude, prev.latitude]);
        }

        previewCoords.push([ll.lng, ll.lat]);

        if (currentIndex < route.length - 1) {
          const next = route[currentIndex + 1];
          previewCoords.push([next.longitude, next.latitude]);
        }

        // For same-origin/destination mode, keep the preview meaningful
        // when either coincident endpoint is dragged.
        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0 && route.length > 2) {
            const next = route[1];
            setPreview([
              [ll.lng, ll.lat],
              [next.longitude, next.latitude]
            ]);
            return;
          }

          if (currentIndex === route.length - 1 && route.length > 2) {
            const prev = route[route.length - 2];
            setPreview([
              [prev.longitude, prev.latitude],
              [ll.lng, ll.lat]
            ]);
            return;
          }
        }

        setPreview(previewCoords);
      }

      marker.on("dragstart", () => {
        markerWasDragged = true;
        detachedFromFix = false;
        pointPointerActive = true;
        suppressNextRouteDrag = true;
        closePointPopup();
        map.dragPan.disable();
        updatePointDragPreview();
      });

      marker.on("drag", () => {
        const position=linkedFixDragPosition(point,marker.getLngLat(),detachedFromFix);
        detachedFromFix=position.detached;
        marker.setLngLat(position.lngLat);
        updatePointDragPreview();
      });

      marker.on("dragend", () => {
        const position=linkedFixDragPosition(point,marker.getLngLat(),detachedFromFix);
        const ll = position.lngLat;
        detachedFromFix=position.detached;
        const currentIndex = route.findIndex(p => p.id === point.id);
        const target = route[currentIndex];

        map.dragPan.enable();

        if (!target) {
          setPreview([]);
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
          return;
        }

        target.longitude = ll.lng;
        target.latitude = ll.lat;
        if(detachedFromFix && target.customFixId != null){
          delete target.customFixId;
          target.name = ""; // Existing numbered waypoint rendering supplies the label.
        }

        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0) {
            route[route.length - 1].longitude = ll.lng;
            route[route.length - 1].latitude = ll.lat;
          } else if (currentIndex === route.length - 1) {
            route[0].longitude = ll.lng;
            route[0].latitude = ll.lat;
          }
        }

        setPreview([]);
        renderRoute();

        // Browsers may emit a click immediately after dragend.
        // Keep the guard through that click cycle.
        setTimeout(() => {
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
        }, 0);
      });

      wrap.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();

        if (longPressSuppressed()) return;
        if (markerWasDragged) return;
        openPointPopup(point.id, wrap);
      });

      pointMarkers.push(marker);
    }

    function screenLegAngleDegrees(a, b) {
      const pa = map.project([a.longitude, a.latitude]);
      const pb = map.project([b.longitude, b.latitude]);

      const dx = pb.x - pa.x;
      const dy = pb.y - pa.y;

      if (!Number.isFinite(dx) || !Number.isFinite(dy)) {
        return 0;
      }

      // Screen coordinates: +X right, +Y down.
      return Math.atan2(dy, dx) * 180 / Math.PI;
    }

    function normalizedReadableTextRotation(routeAngleDeg) {
      // Keep text upright. Text follows the route axis, but never appears
      // upside-down. This means a westbound leg keeps its arrow pointing west,
      // while the text inside is corrected by 180 degrees.
      let angle = routeAngleDeg;

      while (angle > 180) angle -= 360;
      while (angle <= -180) angle += 360;

      if (angle > 90) {
        return angle - 180;
      }

      if (angle < -90) {
        return angle + 180;
      }

      return angle;
    }

    function legPlannedAltitudeFeet(a, b) {
      const aAlt = Number(a?.altitudeMslFeet);
      const bAlt = Number(b?.altitudeMslFeet);

      if (Number.isFinite(aAlt) && Number.isFinite(bAlt)) {
        // Leg altitude label follows the leg's planned MSL.
        // If endpoints differ, use the departure-side altitude because the
        // current route model propagates altitude forward by design.
        return aAlt;
      }

      if (Number.isFinite(aAlt)) return aAlt;
      if (Number.isFinite(bAlt)) return bAlt;
      return 0;
    }

    function formatLegBearing(leg) {
      return leg.bearingMagnetic == null ? "MAG UNKNOWN"
        : `${String(Math.round(leg.bearingMagnetic) % 360).padStart(3, "0")}°M`;
    }

    function createLegMarker(a, b) {
      const leg = legData(a, b);

      const el = document.createElement("div");
      el.className = "leg-label";

      const distanceText = `${leg.distanceNM.toFixed(2)} NM`;
      const bearingText = formatLegBearing(leg);

      el.innerHTML = `
        <div class="leg-arrow-badge">
          <svg class="leg-badge-outline" viewBox="0 0 62 30" aria-hidden="true">
            <path d="M 0.5 0.5 L 51.5 0.5 L 61.5 15 L 51.5 29.5 L 0.5 29.5 Z"
              fill="rgba(18,18,18,.88)" stroke="#fff" stroke-width="1" stroke-linejoin="round" />
          </svg>
          <div class="leg-label-content">
            <div class="leg-label-distance">${distanceText}</div>
            <div class="leg-label-bearing">${bearingText}</div>
          </div>
        </div>
      `;

      const marker = new maplibregl.Marker({
        element: el,
        anchor: "center",
        offset: [0, 0]
      })
      .setLngLat([leg.midpoint.longitude, leg.midpoint.latitude])
      .addTo(map);

      const updateLegBadgeRotation = () => {
        el.style.display = map.getZoom() < LEG_BADGE_MIN_ZOOM ? "none" : "flex";
        const midpoint = interpolateRouteLocation(a, b, 0.5);
        marker.setLngLat([midpoint.longitude, midpoint.latitude]);
        if (map.getPitch() > TOP_VIEW_PITCH_THRESHOLD_DEG) {
          const altitude = ((routePointAltitudeFeet(a) ?? 0) + (routePointAltitudeFeet(b) ?? 0)) / 2;
          const air = projectLngLatAltitude(midpoint.longitude, midpoint.latitude, feetToMeters(altitude));
          const groundMeters = terrainElevationMeters(midpoint.latitude, midpoint.longitude);
          const ground = groundMeters == null ? null
            : projectLngLatAltitude(midpoint.longitude, midpoint.latitude, groundMeters);
          if (air && ground && air.clipW > 0) {
            marker.setOffset([air.x - ground.x, air.y - ground.y - 16]);
          } else {
            el.style.display = "none";
          }
        } else {
          marker.setOffset([0, 0]);
        }
        const routeAngle = screenLegAngleDegrees(a, b);
        const textAngle = normalizedReadableTextRotation(routeAngle);

        const badge = el.querySelector(".leg-arrow-badge");
        const content = el.querySelector(".leg-label-content");

        if (badge) {
          // Pentagon arrow head always follows actual leg direction.
          badge.style.transform = `rotate(${routeAngle}deg)`;
        }

        if (content) {
          // Counter-rotate only enough to prevent upside-down text while
          // retaining the route-axis orientation shown in the reference.
          content.style.transform =
            `rotate(${textAngle - routeAngle}deg)`;
        }
      };

      updateLegBadgeRotation();

      // The apparent screen angle changes when the map bearing/pitch changes,
      // so update the badge orientation with camera movement.
      el._updateLegBadgeRotation = updateLegBadgeRotation;

      legMarkers.push(marker);
    }

    const LEG_BADGE_MIN_ZOOM = 10;

    function resolveRouteLabelCollisions() {
      // Reset before measuring so zooming back in restores the default layout.
      const descriptions = pointMarkers.map(marker => marker.getElement().querySelector(".route-point-coords")).filter(Boolean);
      descriptions.forEach(el => { el.style.transform = ""; });
      const badges = legMarkers.map(marker => marker.getElement()).filter(el => el.style.display !== "none").map(el => el.getBoundingClientRect());
      descriptions.forEach(el => {
        let rect = el.getBoundingClientRect();
        let shift = 0;
        for (let pass = 0; pass < badges.length; pass++) {
          const hit = badges.find(b => rect.left < b.right + 4 && rect.right > b.left - 4 && rect.top < b.bottom + 4 && rect.bottom > b.top - 4);
          if (!hit) break;
          const delta = hit.bottom + 6 - rect.top;
          shift += delta;
          rect = {left:rect.left,right:rect.right,top:rect.top+delta,bottom:rect.bottom+delta};
        }
        if (shift > 0) el.style.transform = `translateY(${shift}px)`;
      });
    }

    function updateAllLegBadgeRotations() {
      for (const marker of legMarkers) {
        const el = marker.getElement?.();
        if (el && typeof el._updateLegBadgeRotation === "function") {
          el._updateLegBadgeRotation();
        }
      }
      resolveRouteLabelCollisions();
      resolveFixLabelCollisions();
      updateFixAltitudeLabels();
    }

    function renderRoute(options = {}) {
      ensureRouteLayers();
      updateRouteSource();

      clearPointMarkers();
      clearLegMarkers();

      route.forEach((p, i) => createPointMarker(p, i));

      for (let i = 0; i < route.length - 1; i++) {
        createLegMarker(route[i], route[i+1]);
      }

      updateRouteInfo(options);
      updateAllLegBadgeRotations();
      refreshRoute3D();
    }

    function resetRoute(deactivate = false) {
      route = [];
      clearPointMarkers();
      clearLegMarkers();
      updateRouteSource();
      setPreview([]);
      refreshRoute3D();
      closePointPopup();
      sameOriginDestination = false;
      pendingDestinationAirport = null;

      if (deactivate) {
        routeModeActive = false;
        routeInfoShell.classList.add("hidden");
        routeInfoShell.classList.remove("collapsed");
        newRouteShell.classList.remove("hidden");
      } else {
        renderRoute();
      }
    }

    function addInitialPoint(lngLat) {
      route.push({
        id: nextPointId++,
        name: "",
        altitudeMslFeet: 0,
        longitude: lngLat.lng,
        latitude: lngLat.lat
      });

      renderRoute({
        autoOpen: route.length === 2
      });
    }

    function nearestSegmentIndex(point) {
      const pt = map.project(point);
      let bestIdx = -1;
      let bestDist = Infinity;

      for (let i = 0; i < route.length - 1; i++) {
        const a = map.project([route[i].longitude, route[i].latitude]);
        const b = map.project([route[i+1].longitude, route[i+1].latitude]);

        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = pt.x - a.x, apy = pt.y - a.y;
        const ab2 = abx*abx + aby*aby || 1;
        let t = (apx*abx + apy*aby) / ab2;
        t = Math.max(0, Math.min(1, t));

        const qx = a.x + t*abx;
        const qy = a.y + t*aby;
        const dx = pt.x - qx;
        const dy = pt.y - qy;
        const dist = Math.hypot(dx, dy);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function openPointPopup(pointId, markerElement) {
      selectedPointId = pointId;
      const point = route.find(p => p.id === pointId);
      if (!point) return;

      const index = route.findIndex(p => p.id === pointId);
      popupTitle.textContent = `${displayPointName(point, index)} 설정`;
      pointNameInput.value = point.name || "";
      pointAltitudeInput.value = String(routePointAltitudeFeet(point) ?? 0);
      pointAltitudeError.hidden = true;
      samePointBtn.hidden = !(route.length === 1 && index === 0);

      const rect = markerElement.getBoundingClientRect();
      const popupWidth = 240;
      const left = Math.min(
        Math.max(10, rect.right + 8),
        window.innerWidth - popupWidth - 10
      );
      const top = Math.min(
        Math.max(10, rect.top - 10),
        window.innerHeight - 290
      );

      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      popup.hidden = false;
    }

    function closePointPopup() {
      popup.hidden = true;
      selectedPointId = null;
    }

    popupClose.addEventListener("click", closePointPopup);

    popupSave.addEventListener("click", () => {
      if (selectedPointId == null) return;
      const point = route.find(p => p.id === selectedPointId);
      if (!point) return;

      if (pointAltitudeInput.value.trim() === "" ||
          !setRoutePointAltitudeMslFeet(point.id, pointAltitudeInput.value)) {
        pointAltitudeError.hidden = false;
        pointAltitudeInput.focus();
        return;
      }
      point.name = pointNameInput.value.trim();
      closePointPopup();

      // Re-render so the saved name appears immediately above coordinates.
      renderRoute();
    });

    popupDelete.addEventListener("click", () => {
      if (selectedPointId == null) return;

      const idx = route.findIndex(p => p.id === selectedPointId);
      if (idx < 0) return;

      route.splice(idx, 1);
      closePointPopup();
      sameOriginDestination = false;
      renderRoute();
    });

    samePointBtn.addEventListener("click", () => {
      if (route.length !== 1) return;

      const start = route[0];

      route.push({
        id: nextPointId++,
        name: "",
        altitudeMslFeet: 0,
        longitude: start.longitude,
        latitude: start.latitude
      });

      sameOriginDestination = true;
      closePointPopup();
      renderRoute({ autoOpen: true });
    });

    document.addEventListener("pointerdown", (ev) => {
      if (!popup.hidden && !popup.contains(ev.target)) {
        closePointPopup();
      }
    });

    document.addEventListener("pointerup", () => {
      // If no marker drag is active, release the marker-vs-route guard
      // after the current event cycle. This prevents stale suppression.
      setTimeout(() => {
        if (!dragState.active) {
          pointPointerActive = false;
          suppressNextRouteDrag = false;
        }
      }, 0);
    });

    document.addEventListener("pointercancel", () => {
      pointPointerActive = false;
      suppressNextRouteDrag = false;
    });

    locateAircraftBtn.addEventListener("click", () => {
      // If the pilot manually panned away while heading-up was active,
      // one tap immediately resumes heading-up ownship tracking.
      if (followMode === "heading" && followSuspendedByUser) {
        applyHeadingUp();
        return;
      }

      // Otherwise preserve the requested alternating behavior:
      // click 1 => heading-up follow mode
      // click 2 => aircraft centered + north-up
      if (locateToggle % 2 === 0) {
        applyHeadingUp();
      } else {
        applyNorthUpCentered();
      }
      locateToggle += 1;
    });

    orientationBtn.addEventListener("click", () => {
      // Compass button has one job only: true north up.
      followMode = "north";
      map.easeTo({
        bearing: 0,
        duration: 450,
        essential: true
      });
    });

    map.on("rotate", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("move", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("rotate", () => {
      updateAllLegBadgeRotations();
    });

    map.on("move", () => {
      updateAllLegBadgeRotations();
    });

    map.on("terrain", () => {
      updateAircraftMarkerVisuals();
    });

    map.on("idle", () => {
      updateAircraftMarkerVisuals();
    });

    // iPad Safari touch state.
    // A two-finger gesture owns the camera completely until both fingers are
    // released. The GPS/simulation follow loop is forbidden from changing the
    // camera during this period.
    const mapCanvas = map.getCanvas();

    mapCanvas.addEventListener("touchstart", (event) => {
      activeTouchCount = event.touches ? event.touches.length : 0;

      if (activeTouchCount === 1) {
        const t = event.touches[0];
        touchPressState.active = true;
        touchPressState.startTime = performance.now();
        touchPressState.startX = t.clientX;
        touchPressState.startY = t.clientY;
        touchPressState.moved = false;
        touchPressState.wasLongPress = false;
      } else {
        // Multi-touch is never a tap/long-press candidate.
        touchPressState.active = false;
      }

      if (activeTouchCount >= 2) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 500;
      }
    }, { passive: true });

    mapCanvas.addEventListener("touchmove", (event) => {
      activeTouchCount = event.touches ? event.touches.length : 0;

      if (touchPressState.active && activeTouchCount === 1) {
        const t = event.touches[0];
        const dx = t.clientX - touchPressState.startX;
        const dy = t.clientY - touchPressState.startY;

        if (Math.hypot(dx, dy) > LONG_PRESS_MOVE_PX) {
          touchPressState.moved = true;
        }
      }

      if (activeTouchCount >= 2) {
        touchPressState.active = false;
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 500;
      }
    }, { passive: true });

    function finishTouchCameraGesture(event) {
      const now = performance.now();
      const remainingTouches = event.touches ? event.touches.length : 0;

      if (
        touchPressState.active &&
        remainingTouches === 0 &&
        !touchPressState.moved
      ) {
        const duration = now - touchPressState.startTime;

        if (duration >= LONG_PRESS_MS) {
          touchPressState.wasLongPress = true;

          // Safari may synthesize a click after touchend.
          // Ignore that entire click cycle.
          suppressTapUntil = now + 900;

          // If the press began on the route hit line, make sure releasing it
          // cannot insert a VIA point.
          if (dragState.active && dragState.source === "touch") {
            dragState.longPressCancelled = true;
          }
        }
      }

      touchPressState.active = false;
      activeTouchCount = remainingTouches;

      if (activeTouchCount < 2) {
        headingGestureActive = false;
        // Safari often emits zoomend/pitchend slightly before the final
        // inertial camera frame. Give it time to settle before reacquiring.
        suppressFollowUntil = performance.now() + 350;

        setTimeout(() => {
          if (
            followMode === "heading" &&
            !followSuspendedByUser &&
            activeTouchCount < 2
          ) {
            refreshFollowCamera({ animate: false });
          }
        }, 380);
      }
    }

    mapCanvas.addEventListener("touchend", finishTouchCameraGesture, {
      passive: true
    });

    mapCanvas.addEventListener("touchcancel", finishTouchCameraGesture, {
      passive: true
    });

    // A ONE-finger pan releases heading-up follow.
    // A two-finger zoom/pitch gesture must never be interpreted as a pan-away.
    map.on("dragstart", () => {
      if (
        followMode === "heading" &&
        activeTouchCount < 2 &&
        !programmaticFollowUpdate
      ) {
        followSuspendedByUser = true;
      }
    });

    map.on("pitchstart", () => {
      if (!programmaticFollowUpdate) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 400;
      }
    });

    map.on("pitch", () => {
      updateGroundRouteVisibility();
      updateAllLegBadgeRotations();
      updateAircraftMarkerVisuals();
      if (!programmaticFollowUpdate) {
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("pitchend", () => {
      updateAircraftMarkerVisuals();

      if (!programmaticFollowUpdate && activeTouchCount < 2) {
        headingGestureActive = false;
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("zoomstart", () => {
      if (!programmaticFollowUpdate) {
        headingGestureActive = true;
        suppressFollowUntil = performance.now() + 400;
      }
    });

    map.on("zoom", () => {
      updateAllLegBadgeRotations();
      updateAircraftMarkerVisuals();
      if (!programmaticFollowUpdate) {
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("zoomend", () => {
      if (!programmaticFollowUpdate && activeTouchCount < 2) {
        headingGestureActive = false;
        suppressFollowUntil = performance.now() + 300;
      }
    });

    map.on("load", async () => {
      terrainReady = true;

      ensureRouteLayers();
      ensureCustomFixLayers();
      try{
        const records=await waypointRepository.getAllCustomWaypoints();
        for(const record of records){
          if(typeof record.id!=="string"||!Number.isFinite(record.latitude)||!Number.isFinite(record.longitude))continue;
          await createCustomFix({lng:record.longitude,lat:record.latitude},{radiusNM:0,lowerFeet:null,upperFeet:null,lowerRef:"MSL",upperRef:"MSL",...record,saved:true});
        }
        nextFixId=customFixes.length+1;
        updateCustomFixSource();
      }catch(error){reportWaypointError(error);}
      ensureAircraftProjectionLayer();
      updateGroundRouteVisibility();

      // Add the experimental curtain only after the ordinary map layers and
      // terrain are alive. Failure here must not take the base map down.
      safeEnsureRoute3DLayer();
      // Composite translucent fix volumes after the route curtain.
      if (map.getLayer("custom-fix-volume")) map.moveLayer("custom-fix-volume");
      ensureCurtainOutsideFixLayer();
      await ensureAirportLayers();

      // Explicitly enable MapLibre's native iPad gestures.
      // Two-finger parallel vertical drag changes pitch.
      if (map.touchPitch && typeof map.touchPitch.enable === "function") {
        map.touchPitch.enable();
      }
      if (map.touchZoomRotate && typeof map.touchZoomRotate.enable === "function") {
        map.touchZoomRotate.enable();
      }

      createAircraftMarker();
      updateCompassRotation();
      startTrackingSimulation();
      renderRoute();

      map.on("idle", () => {
        maybeCompleteRouteTerrainProfileCache();
      });

      // Diagnostic only. This value is DEM ground elevation in meters MSL,
      // not aircraft altitude and not a terrain-clearance decision.
      setTimeout(() => {
        const elevation = terrainElevationMeters(
          aircraft.latitude,
          aircraft.longitude
        );
        console.log(
          "3D terrain enabled. DEM ground elevation at ownship:",
          elevation == null ? "not loaded yet" : `${elevation.toFixed(1)} m MSL`
        );
        updateAircraftMarkerVisuals();
      }, 1200);

      map.on("mouseenter", "route-hit", () => {
        map.getCanvas().style.cursor = "grab";
      });

      map.on("mouseleave", "route-hit", () => {
        if (!dragState.active) map.getCanvas().style.cursor = "";
      });

      function startRouteDrag(lngLat, source = "mouse", screenPoint = null) {
        if (fixModeActive || !routeModeActive) return false;
        if (route.length < 2) return false;
        if (pointPointerActive || suppressNextRouteDrag) return false;

        closePointPopup();

        dragState.active = true;
        dragState.segmentIndex = nearestSegmentIndex(lngLat);
        dragState.currentLngLat = lngLat;
        dragState.source = source;
        dragState.longPressCancelled = false;
        dragState.touchStartTime =
          source === "touch" ? performance.now() : null;
        dragState.touchMoved = false;
        dragState.movedEnough = false;
        dragState.startScreenX = screenPoint?.x ?? null;
        dragState.startScreenY = screenPoint?.y ?? null;

        map.dragPan.disable();
        map.getCanvas().style.cursor = "grabbing";

        // A press/tap does nothing until it becomes a real drag.
        setPreview([]);
        dragHint.classList.remove("show");
        return true;
      }

      function moveRouteDrag(lngLat, screenPoint = null) {
        if (!dragState.active) return;

        dragState.currentLngLat = lngLat;

        if (
          !dragState.movedEnough &&
          screenPoint &&
          dragState.startScreenX != null &&
          dragState.startScreenY != null
        ) {
          const dx = screenPoint.x - dragState.startScreenX;
          const dy = screenPoint.y - dragState.startScreenY;

          const threshold =
            dragState.source === "touch" ? 12 : 6;

          if (Math.hypot(dx, dy) >= threshold) {
            dragState.movedEnough = true;
            dragHint.classList.add("show");
          }
        }

        if (!dragState.movedEnough) return;

        const i = dragState.segmentIndex;
        const a = route[i];
        const b = route[i + 1];
        if (!a || !b) return;
        const fix=nearestRouteSnapFix(lngLat);
        dragState.snapFixId=fix?.id ?? null;
        const previewLocation=fix?{lng:fix.longitude,lat:fix.latitude}:lngLat;
        dragHint.textContent=fix?`FIX ${fix.name}에 연결` : "루트를 원하는 위치까지 드래그한 뒤 놓으세요";

        setPreview([
          [a.longitude, a.latitude],
          [previewLocation.lng, previewLocation.lat],
          [b.longitude, b.latitude]
        ]);
      }

      function cancelRouteDrag() {
        dragState.active = false;
        dragState.segmentIndex = -1;
        dragState.currentLngLat = null;
        dragState.source = null;
        dragState.snapFixId = null;
        dragState.longPressCancelled = false;
        dragState.touchStartTime = null;
        dragState.touchMoved = false;
        dragState.movedEnough = false;
        dragState.startScreenX = null;
        dragState.startScreenY = null;
        setPreview([]);
        map.dragPan.enable();
        map.getCanvas().style.cursor = "";
        dragHint.classList.remove("show");
      }

      function finishRouteDrag(fallbackLngLat = null) {
        if (!dragState.active) return;

        // Short tap/press on the route line = no action.
        if (!dragState.movedEnough) {
          cancelRouteDrag();
          return;
        }

        // A point drag must never create a VIA point.
        if (pointPointerActive || suppressNextRouteDrag) {
          cancelRouteDrag();
          return;
        }

        const i = dragState.segmentIndex;
        const p = dragState.currentLngLat || fallbackLngLat;
        if (!p || i < 0 || i >= route.length - 1) {
          cancelRouteDrag();
          return;
        }

        const inheritedAltitude = routePointAltitudeFeet(route[i]) ?? 0;
        const fix=nearestRouteSnapFix(p);
        // Do not insert the same fix immediately next to itself.
        if(fix && (route[i].customFixId===fix.id || route[i+1].customFixId===fix.id)){
          cancelRouteDrag();return;
        }
        route.splice(i + 1, 0, {
          id: nextPointId++,
          name: fix?.name ?? "",
          altitudeMslFeet: inheritedAltitude,
          longitude: fix?.longitude ?? p.lng,
          latitude: fix?.latitude ?? p.lat,
          ...(fix?{customFixId:fix.id}:{})
        });

        cancelRouteDrag();
        renderRoute();
      }

      // Desktop mouse support.
      map.on("mousedown", "route-hit", (e) => {
        if (e.originalEvent && e.originalEvent.button != null && e.originalEvent.button !== 0) return;
        e.preventDefault();
        startRouteDrag(e.lngLat, "mouse", e.point);
      });

      map.on("mousemove", (e) => {
        if (!dragState.active || dragState.source !== "mouse") return;
        moveRouteDrag(e.lngLat, e.point);
      });

      map.on("mouseup", (e) => {
        if (!dragState.active || dragState.source !== "mouse") return;
        finishRouteDrag(e.lngLat);
      });

      // iPad / touch support.
      // Only ONE finger may start a route-line drag.
      // Two fingers are deliberately left to MapLibre for pitch/zoom/rotate.
      map.on("touchstart", "route-hit", (e) => {
        const touches = e.originalEvent?.touches;
        if (!touches || touches.length !== 1) return;

        e.preventDefault();
        startRouteDrag(e.lngLat, "touch", e.point);
      });

      map.on("touchmove", (e) => {
        if (!dragState.active || dragState.source !== "touch") return;

        const touches = e.originalEvent?.touches;
        if (!touches || touches.length !== 1) {
          cancelRouteDrag();
          return;
        }

        if (touchPressState.moved) {
          dragState.touchMoved = true;
        }

        moveRouteDrag(e.lngLat, e.point);
      });

      map.on("touchend", (e) => {
        if (!dragState.active || dragState.source !== "touch") return;

        const duration = dragState.touchStartTime == null
          ? 0
          : performance.now() - dragState.touchStartTime;

        const isLongStationaryPress =
          duration >= LONG_PRESS_MS &&
          !dragState.touchMoved &&
          !touchPressState.moved;

        if (
          isLongStationaryPress ||
          dragState.longPressCancelled ||
          longPressSuppressed()
        ) {
          suppressTapUntil = performance.now() + 900;
          cancelRouteDrag();
          return;
        }

        finishRouteDrag(dragState.currentLngLat || e.lngLat);
      });

      map.on("touchcancel", () => {
        if (dragState.active && dragState.source === "touch") {
          cancelRouteDrag();
        }
      });

      function handleMapTap(e) {
        if (longPressSuppressed()) return;
        if (dragState.active) return;

      map.addLayer({id:"custom-fix-volume",type:"custom",renderingMode:"3d",
        onAdd(instance,gl){
          this.program=linkRoute3DProgram(gl,`#version 300 es\nprecision highp float;uniform mat4 u_matrix;in vec3 a_pos;void main(){gl_Position=u_matrix*vec4(a_pos,1.0);}`,`#version 300 es\nprecision highp float;uniform vec4 u_color;out vec4 fragColor;void main(){fragColor=u_color;}`);
          this.buffer=gl.createBuffer();
        },
        render(gl,options){
          const topView=isFixTopView();
          const matrix=extractProjectionMatrix(options);if(!matrix)return;
          const vertices=[], outlines=[],bottomOutlines=[];
          const halfWidth=(3*96/72)/(512*Math.pow(2,map.getZoom()))/2;
          const vertex=p=>vertices.push(p.x,p.y,p.z);
          for(const fix of customFixes){
            if(!fix.saved||fix.radiusNM<=0)continue;
            const ring=fixCircle(fix),lower=[],upper=[];
            let valid=true;
            for(const [lon,lat] of ring){
              // Top View uses a complete footprint regardless of altitude/DEM readiness.
              const ground=terrainElevationMeters(lat,lon)??0;
              const lo=topView?ground:fixAltitudeMeters(fix,fix.lowerFeet,fix.lowerRef,lat,lon);
              const hi=topView?ground:fixAltitudeMeters(fix,fix.upperFeet,fix.upperRef,lat,lon);
              if(lo==null||hi==null||hi<lo){valid=false;break;}
              lower.push(mercatorData(lon,lat,lo));upper.push(mercatorData(lon,lat,hi));
            }
            if(!valid)continue;
            for(let i=0;i<ring.length-1;i++){
              const a=upper[i],b=upper[i+1];
              const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
              const nx=-dy/len*halfWidth,ny=dx/len*halfWidth;
              const p=[a.x+nx,a.y+ny,a.z],q=[a.x-nx,a.y-ny,a.z],r=[b.x+nx,b.y+ny,b.z],t=[b.x-nx,b.y-ny,b.z];
              outlines.push(...p,...q,...r,...r,...q,...t);
              const la=lower[i],lb=lower[i+1],bx=nx/3,by=ny/3;
              const lp=[la.x+bx,la.y+by,la.z],lq=[la.x-bx,la.y-by,la.z],lr=[lb.x+bx,lb.y+by,lb.z],lt=[lb.x-bx,lb.y-by,lb.z];
              if(!topView) {
                bottomOutlines.push(...lp,...lq,...lr,...lr,...lq,...lt);
                vertex(lower[i]);vertex(lower[i+1]);vertex(upper[i]);vertex(upper[i]);vertex(lower[i+1]);vertex(upper[i+1]);
              }
              if(i>0&&i<ring.length-2){
                vertex(upper[0]);vertex(upper[i]);vertex(upper[i+1]);
                if(!topView){vertex(lower[0]);vertex(lower[i+1]);vertex(lower[i]);}
              }
            }
          }
          if(!vertices.length)return;
          gl.useProgram(this.program);gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.DYNAMIC_DRAW);
          const location=gl.getAttribLocation(this.program,"a_pos");gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,3,gl.FLOAT,false,0,0);
          gl.uniformMatrix4fv(gl.getUniformLocation(this.program,"u_matrix"),false,matrix);
          gl.disable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
          gl.uniform4f(gl.getUniformLocation(this.program,"u_color"),1,.57,0,.25);
          gl.drawArrays(gl.TRIANGLES,0,vertices.length/3);
          gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(outlines),gl.DYNAMIC_DRAW);
          gl.uniform4f(gl.getUniformLocation(this.program,"u_color"),1,.57,0,1);
          gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-1,-1);
          gl.drawArrays(gl.TRIANGLES,0,outlines.length/3);
          gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(bottomOutlines),gl.DYNAMIC_DRAW);
          gl.drawArrays(gl.TRIANGLES,0,bottomOutlines.length/3);
          gl.disable(gl.POLYGON_OFFSET_FILL);
          const overlapFaces=topView?[]:buildFixCurtainIntersectionLines(true);
          if(overlapFaces.length){
            // Source-over blend of orange (alpha .25) and navy curtain (alpha .30).
            const alpha=.25+.30*(1-.25);
            const mixed=[(1*.25+.06*.30*.75)/alpha,(.57*.25+.16*.30*.75)/alpha,(0*.25+.30*.30*.75)/alpha];
            gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(overlapFaces),gl.DYNAMIC_DRAW);
            gl.uniform4f(gl.getUniformLocation(this.program,"u_color"),...mixed,alpha);
            gl.drawArrays(gl.TRIANGLES,0,overlapFaces.length/3);
          }
          const intersections=topView?[]:buildFixCurtainIntersectionLines();
          if(intersections.length){
            gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(intersections),gl.DYNAMIC_DRAW);
            gl.uniform4f(gl.getUniformLocation(this.program,"u_color"),1,.57,0,1);
            gl.lineWidth(1);gl.drawArrays(gl.LINES,0,intersections.length/3);
          }
          gl.depthMask(true);gl.enable(gl.DEPTH_TEST);
        },
        onRemove(instance,gl){gl.deleteBuffer(this.buffer);gl.deleteProgram(this.program);}
      });
    }
    const positionReport = mountPositionReport({
      getPosition: () => ({latitude:aircraft.latitude,longitude:aircraft.longitude}),
      getReferences: () => [
        ...AIRPORT_POINTS_GEOJSON.features.map((f,i)=>({id:`airport:${f.properties.icao}:${i}`,kind:"airport",name:f.properties.nameEn||f.properties.nameKo,icao:f.properties.icao,longitude:f.geometry.coordinates[0],latitude:f.geometry.coordinates[1]})),
        ...customFixes.filter(f=>f.saved).map(f=>({id:`fix:${f.id}`,kind:"fix",name:f.name,longitude:f.longitude,latitude:f.latitude}))
      ],
      onMapTap: close => map.on("click",close)
    });

    window.movingMap = {
      map,
      customWaypointRepository: waypointRepository,

      getRoute() {
        return JSON.parse(JSON.stringify(route));
      },

      getRoutePointAltitudes() {
        return route.map((point, index) => ({
          id: point.id,
          index,
          name: displayPointName(point, index),
          altitudeMslFeet: routePointAltitudeFeet(point)
        }));
      },

      setRoutePointAltitudeMsl(pointId, altitudeFeet) {
        return setRoutePointAltitudeMslFeet(
          pointId,
          altitudeFeet,
          null,
          { rerender: true }
        );
      },

      clearRoute() {
        resetRoute(true);
      },

      startNewRoute() {
        routeModeActive = true;
        sameOriginDestination = false;
        updateRouteInfo({ autoOpen: true });
      },

      getAircraft() {
        return {
          ...aircraft,
          terrainMslFeet: aircraftTerrainMslFeet(),
          aglFeet: aircraftAglFeet(),
          magneticDeclination: aircraftDeclination(),
          trueHeading: aircraftTrueHeading(),
          followMode,
          followSuspendedByUser
        };
      },

      updateAircraft(
        latitude,
        longitude,
        magneticHeading = aircraft.magneticHeading,
        altitudeMslFeet = aircraft.altitudeMslFeet
      ) {
        updateAircraftPosition(latitude, longitude, magneticHeading, altitudeMslFeet);
      },

      setAircraftAltitudeMsl(altitudeMslFeet) {
        aircraft.altitudeMslFeet = Number(altitudeMslFeet);
        updateAircraftMarkerVisuals();
      },

      headingUp() {
        applyHeadingUp();
      },

      northUpCentered() {
        applyNorthUpCentered();
      },

      resumeAircraftFollow() {
        applyHeadingUp();
      },

      startTrackingSimulation() {
        startTrackingSimulation();
      },

      stopTrackingSimulation() {
        stopTrackingSimulation();
      },

      getSimulationState() {
        return {
          running: simulation.running,
          speedKnots: simulation.speedKnots,
          legSeconds: simulation.legSeconds,
          currentMagneticHeading:
            simulation.headingsMagnetic[simulation.currentLegIndex],
          legElapsedSeconds: simulation.legElapsedSeconds
        };
      },

      getTerrainElevation(latitude, longitude) {
        return terrainElevationMeters(latitude, longitude);
      },

      getTerrainStatus() {
        return {
          enabled: terrainReady,
          source: "Mapterhorn raster-dem",
          exaggeration: 1,
          operationalUse: false
        };
      },

      getHeadingUpDebug() {
        return {
          followMode,
          followSuspendedByUser,
          headingGestureActive,
          activeTouchCount,
          zoom: map.getZoom(),
          pitch: map.getPitch(),
          aircraftScreenTarget: headingUpAircraftScreenPoint(),
          aircraftVerticalScreenVector: aircraftVerticalScreenVector()
        };
      },

      getAirportLayerStatus() {
        return getAirportLayerStatus();
      },

      getRoute3DAltitudeDiagnostics() {
        return getRoute3DAltitudeDiagnostics();
      },

      resampleRouteTerrainProfile() {
        return resampleRouteTerrainProfile();
      },

      getTouchStatus() {
        return {
          iPadOptimized: true,
          mapTap: true,
          routePointTap: true,
          routeLineSingleFingerDrag: true,
          twoFingerPitch: true,
          touchZoomRotate: true,
          routePointAltitudeMsl3D: true,
          routeTerrainCurtain: true,
          routeDropLines: true,
          longPressAction: "none",
          longPressThresholdMs: LONG_PRESS_MS
        };
      }
    };
  })();
  </script>
