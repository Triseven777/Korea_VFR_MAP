<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Korea VFR Moving Map - v6 Route Drag</title>

  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body { background: #000; }
    .maplibregl-ctrl-attrib { font-size: 10px; }

    .route-point-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .route-point-wrap:active {
      cursor: grabbing;
    }

    .route-point-dot {
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 13px;
      background: rgba(255,255,255,0.97);
      border: 2px solid rgba(0,0,0,0.9);
      color: #111;
      font: 700 12px/20px Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .route-point-coords {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font: 600 11px/1.2 Arial, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    .route-point-name {
      display: block;
      margin-bottom: 2px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
    }

    .leg-label {
      padding: 5px 7px;
      border-radius: 5px;
      background: rgba(0,0,0,0.82);
      border: 1px solid rgba(255,255,255,0.65);
      color: #fff;
      font: 700 12px/1.3 Arial, sans-serif;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      text-align: center;
    }

    .point-popup {
      position: absolute;
      z-index: 20;
      min-width: 220px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(22,22,22,0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      font: 13px/1.4 Arial, sans-serif;
    }

    .point-popup[hidden] { display: none; }

    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .popup-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .popup-label {
      display: block;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
    }

    .popup-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .popup-input:focus {
      border-color: rgba(255,255,255,0.75);
    }

    .popup-actions {
      display: flex;
      gap: 8px;
    }

    .popup-btn {
      flex: 1;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .popup-save {
      background: #fff;
      color: #111;
    }

    .popup-delete {
      background: rgba(220,55,55,0.95);
      color: #fff;
    }

    .drag-hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0,0,0,0.72);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.25);
      font: 12px Arial, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .drag-hint.show { opacity: 1; }

    /* ===== Route Info top panel ===== */
    .route-info-shell {
      position: absolute;
      z-index: 30;
      top: 0;
      left: 50%;
      width: min(96vw, 1380px);
      transform: translateX(-50%);
      transition: transform .22s ease;
      pointer-events: none;
    }

    .route-info-shell.hidden {
      display: none;
    }

    .route-info-shell.collapsed {
      transform: translate(-50%, calc(-100% + 38px));
    }

    .route-info-panel {
      pointer-events: auto;
      background:
        linear-gradient(180deg, rgba(42,88,164,.97) 0%, rgba(30,69,139,.97) 100%);
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.30);
      backdrop-filter: blur(8px);
      color: #fff;
      overflow: hidden;
    }

    .route-info-head {
      display: grid;
      grid-template-columns: minmax(160px, 0.9fr) minmax(360px, 2.8fr) minmax(160px, 0.9fr);
      gap: 12px;
      align-items: start;
      padding: 14px 18px 10px;
    }

    .route-end {
      min-width: 0;
    }

    .route-section-label {
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-end-name {
      font: 700 19px/1.1 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-to {
      text-align: right;
    }

    .route-via-wrap {
      min-width: 0;
    }

    .route-via-title {
      text-align: center;
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: .15em;
      opacity: .7;
      margin-bottom: 8px;
    }

    .route-strip {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.45) transparent;
    }

    .route-strip-inner {
      display: flex;
      align-items: center;
      width: max-content;
      min-width: max-content;
      margin-left: auto;
      margin-right: auto;
    }

    .route-strip::-webkit-scrollbar {
      height: 5px;
    }

    .route-strip::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.38);
      border-radius: 999px;
    }

    .route-node-card {
      flex: 0 0 auto;
      min-width: 90px;
      max-width: 150px;
      text-align: center;
      font: 700 15px/1.2 Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
    }

    .route-leg-mini {
      flex: 0 0 auto;
      width: 128px;
      padding: 0 8px;
      display: grid;
      grid-template-rows: 18px 12px 18px;
      align-items: center;
      justify-items: center;
      box-sizing: border-box;
    }

    .route-leg-distance,
    .route-leg-bearing {
      font: 700 11px/1 Arial, sans-serif;
      opacity: .95;
      white-space: nowrap;
    }

    .route-leg-line {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,.78);
      position: relative;
    }

    .route-leg-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -3px;
      border-left: 7px solid rgba(255,255,255,.95);
      border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent;
    }

    .route-info-foot {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px 16px 12px;
      font: 700 14px/1 Arial, sans-serif;
      opacity: .95;
    }

    .route-info-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 38px;
      margin: -1px auto 0;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background:
        linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/38px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-info-tab::after {
      content: "▲";
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      opacity: .8;
      transition: transform .2s ease;
    }

    .route-info-shell.collapsed .route-info-tab::after {
      transform: rotate(180deg);
    }

    @media (max-width: 760px) {
      .route-info-shell {
        width: 100%;
      }

      .route-info-panel {
        border-radius: 0 0 10px 10px;
      }

      .route-info-head {
        grid-template-columns: 110px minmax(200px, 1fr) 110px;
        gap: 8px;
        padding: 11px 10px 8px;
      }

      .route-end-name {
        font-size: 15px;
      }

      .route-node-card {
        min-width: 74px;
        font-size: 13px;
      }

      .route-leg-mini {
        width: 106px;
      }
    }


    .new-route-tab {
      pointer-events: auto;
      display: block;
      width: 170px;
      height: 40px;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,.24);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, rgba(30,69,139,.98) 0%, rgba(23,58,121,.98) 100%);
      color: #fff;
      font: 700 14px/40px Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(0,0,0,.24);
      user-select: none;
    }

    .route-delete-btn {
      margin-left: 8px;
      border: 1px solid rgba(255,255,255,.32);
      background: rgba(180,35,35,.9);
      color: #fff;
      border-radius: 7px;
      padding: 7px 12px;
      font: 700 12px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .route-info-foot {
      justify-content: flex-end;
    }

    .route-total-wrap {
      margin-left: auto;
    }

    .same-point-btn {
      width: 100%;
      margin: 0 0 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 6px;
      background: rgba(70,120,210,.95);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .same-point-btn[hidden] { display: none; }

    /* ===== Aircraft / navigation controls ===== */
    .aircraft-marker {
      width: 180px;
      height: 52px;
      position: relative;
      pointer-events: none;
      overflow: visible;
    }

    .aircraft-marker svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .aircraft-symbol-tilt {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 40px;
      height: 40px;
      transform: translateX(-50%);
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      perspective: 420px;
      overflow: visible;
    }

    .aircraft-symbol {
      position: absolute;
      inset: 0;
      width: 40px;
      height: 40px;
      transform-origin: 50% 50%;
      transform-box: fill-box;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.72));
      backface-visibility: visible;
    }

    .aircraft-altitude-stem {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 10px;
      height: 0;
      border-radius: 999px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.92),
        rgba(193,206,224,.94) 55%,
        rgba(125,144,168,.96)
      );
      box-shadow:
        0 0 0 1px rgba(255,255,255,.22),
        0 4px 10px rgba(0,0,0,.22);
      opacity: 0;
    }

    .aircraft-ground-anchor {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 18px;
      height: 12px;
      transform: translateX(-50%);
      opacity: 0;
    }

    .aircraft-ground-anchor::before,
    .aircraft-ground-anchor::after {
      content: "";
      position: absolute;
      bottom: 1px;
      width: 11px;
      height: 0;
      border-top: 4px solid rgba(18,23,30,.92);
      filter: drop-shadow(0 1px 1px rgba(255,255,255,.18));
    }

    .aircraft-ground-anchor::before {
      right: 50%;
      transform-origin: right center;
      transform: rotate(38deg);
    }

    .aircraft-ground-anchor::after {
      left: 50%;
      transform-origin: left center;
      transform: rotate(-38deg);
    }

    .aircraft-altitude-card {
      position: absolute;
      left: calc(50% + 18px);
      bottom: 20px;
      min-width: 94px;
      padding: 6px 8px 7px;
      border-radius: 10px;
      background: rgba(16, 22, 31, .84);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,.12);
      opacity: 0;
    }

    .aircraft-alt-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      white-space: nowrap;
      line-height: 1.15;
    }

    .aircraft-alt-row + .aircraft-alt-row {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .aircraft-alt-k {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .05em;
      color: rgba(219,228,240,.82);
    }

    .aircraft-alt-v {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .01em;
      color: #fff;
    }

    .compass-face {
      width: 26px;
      height: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-rotor {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
    }

    .nav-controls {
      position: absolute;
      z-index: 25;
      right: 16px;
      bottom: 26px;
      display: flex;
      flex-direction: row;
      gap: 9px;
      align-items: center;
    }

    .nav-control-btn {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 10px;
      background: rgba(20,28,40,.88);
      color: #fff;
      box-shadow: 0 5px 16px rgba(0,0,0,.32);
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .nav-control-btn:hover {
      background: rgba(31,45,65,.95);
    }

    .nav-control-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-control-btn.heading-active {
      background: rgba(34,84,165,.96);
      border-color: rgba(255,255,255,.72);
    }

    .nav-control-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

  </style>
</head>

<body>
  <div id="map"></div>

  <div id="routeInfoShell" class="route-info-shell hidden">
    <div class="route-info-panel">
      <div class="route-info-head">
        <div class="route-end">
          <div class="route-section-label">FROM</div>
          <div id="routeFromName" class="route-end-name">A</div>
        </div>

        <div class="route-via-wrap">
          <div class="route-via-title">VIA</div>
          <div id="routeStrip" class="route-strip"></div>
        </div>

        <div class="route-end route-to">
          <div class="route-section-label">TO</div>
          <div id="routeToName" class="route-end-name">B</div>
        </div>
      </div>

      <div class="route-info-foot">
        <div class="route-total-wrap">
          Total&nbsp;:&nbsp;<span id="routeTotalNm">0.00</span>&nbsp;NM
        </div>
        <button id="routeDeleteBtn" class="route-delete-btn" type="button">Delete</button>
      </div>
    </div>

    <button id="routeInfoTab" class="route-info-tab" type="button">Route Info</button>
  </div>


  <div id="newRouteShell" class="route-info-shell">
    <button id="newRouteBtn" class="new-route-tab" type="button">+ New Route</button>
  </div>

  <div id="pointPopup" class="point-popup" hidden>
    <div class="popup-head">
      <span id="popupTitle">포인트 설정</span>
      <button id="popupClose" class="popup-close" type="button" aria-label="닫기">×</button>
    </div>

    <label class="popup-label" for="pointNameInput">포인트 이름</label>
    <input id="pointNameInput" class="popup-input" type="text" maxlength="40" placeholder="포인트 이름 입력" />

    <button id="samePointBtn" class="same-point-btn" type="button" hidden>출발/도착 동일</button>

    <div class="popup-actions">
      <button id="popupSave" class="popup-btn popup-save" type="button">저장</button>
      <button id="popupDelete" class="popup-btn popup-delete" type="button">삭제</button>
    </div>
  </div>

  <div id="dragHint" class="drag-hint">루트를 원하는 위치까지 드래그한 뒤 놓으세요</div>

  <div class="nav-controls" aria-label="지도 방향 및 현위치">
    <button id="locateAircraftBtn" class="nav-control-btn" type="button" title="현위치">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>

    <button id="orientationBtn" class="nav-control-btn" type="button" title="진북 정렬">
      <div class="compass-face" aria-hidden="true">
        <svg id="compassRotor" class="compass-rotor" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 3.5 L17 13 L14 11.6 L11 13 Z"
                fill="#e53935" stroke="#e53935" stroke-width="1"/>
          <path d="M14 24.5 L11.5 15 L14 16.2 L16.5 15 Z"
                fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.72)" stroke-width="1"/>
          <circle cx="14" cy="14" r="1.8" fill="currentColor" stroke="none"/>
        </svg>
      </div>
    </button>
  </div>


  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script type="module">
  (async () => {
    let magvarFn = null;

    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/magvar@2.2.0/+esm");
      magvarFn = mod.magvar;
    } catch (err) {
      console.error("WMM magnetic model failed to load:", err);
    }

    const map = new maplibregl.Map({
      container: "map",
      center: [126.9780, 37.5665],
      zoom: 9,
      minZoom: 2,
      maxZoom: 19,
      pitch: 0,
      bearing: 0,
      style: {
        version: 8,
        sources: {
          satellite: {
            type: "raster",
            tiles: [
              "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
            ],
            tileSize: 256,
            attribution:
              "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
          },

          // Prototype DEM for 3D terrain rendering.
          // Mapterhorn provides global terrain tiles and is used by
          // MapLibre's official 3D terrain examples.
          terrainSource: {
            type: "raster-dem",
            url: "https://tiles.mapterhorn.com/tilejson.json",
            attribution: "Terrain © Mapterhorn"
          }
        },

        terrain: {
          source: "terrainSource",
          exaggeration: 1
        },

        layers: [
          { id: "satellite", type: "raster", source: "satellite" }
        ]
      },
      attributionControl: true
    });

    const popup = document.getElementById("pointPopup");
    const popupTitle = document.getElementById("popupTitle");
    const pointNameInput = document.getElementById("pointNameInput");
    const popupClose = document.getElementById("popupClose");
    const popupSave = document.getElementById("popupSave");
    const popupDelete = document.getElementById("popupDelete");
    const dragHint = document.getElementById("dragHint");

    const routeInfoShell = document.getElementById("routeInfoShell");
    const routeInfoTab = document.getElementById("routeInfoTab");
    const routeFromName = document.getElementById("routeFromName");
    const routeToName = document.getElementById("routeToName");
    const routeStrip = document.getElementById("routeStrip");
    const routeTotalNm = document.getElementById("routeTotalNm");
    const routeDeleteBtn = document.getElementById("routeDeleteBtn");
    const newRouteShell = document.getElementById("newRouteShell");
    const newRouteBtn = document.getElementById("newRouteBtn");
    const samePointBtn = document.getElementById("samePointBtn");
    const locateAircraftBtn = document.getElementById("locateAircraftBtn");
    const orientationBtn = document.getElementById("orientationBtn");
    const compassRotor = document.getElementById("compassRotor");

    const R_EARTH_M = 6371008.8;
    const M_PER_NM = 1852;

    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const norm = d => (d + 360) % 360;

    // Simulated ownship for this build.
    // Coordinates are interpreted as decimal degrees WGS84.
    const aircraft = {
      latitude: 37.53202,
      longitude: 126.66099,
      magneticHeading: 150,
      altitudeMslFeet: 3000
    };

    let aircraftMarker = null;
    let followMode = "north"; // north | heading
    let locateToggle = 0;
    let followSuspendedByUser = false;
    let terrainReady = false;
    let aircraftProjectionMatrix = null;

    function aircraftDeclination() {
      return declination(aircraft.latitude, aircraft.longitude) ?? 0;
    }

    function aircraftTrueHeading() {
      // true = magnetic + easterly variation (west is negative)
      return norm(aircraft.magneticHeading + aircraftDeclination());
    }

    function aircraftScreenRotation() {
      // Aircraft must always visually point toward its actual travel direction,
      // regardless of map rotation.
      return norm(aircraftTrueHeading() - map.getBearing());
    }

    function feetToMeters(feet) {
      return Number(feet) * 0.3048;
    }

    function aircraftTerrainMslFeet() {
      const meters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      return meters == null ? null : meters * 3.28084;
    }

    function aircraftAglFeet() {
      const terrainFeet = aircraftTerrainMslFeet();
      if (terrainFeet == null) return null;
      return aircraft.altitudeMslFeet - terrainFeet;
    }

    function formatFeetValue(value) {
      if (value == null || !Number.isFinite(value)) return "---";
      return `${Math.round(value).toLocaleString()} ft`;
    }

    function extractProjectionMatrix(matrixLike) {
      if (!matrixLike) return null;
      if (Array.isArray(matrixLike) || ArrayBuffer.isView(matrixLike)) {
        return matrixLike;
      }
      if (matrixLike.defaultProjectionData?.mainMatrix) {
        return matrixLike.defaultProjectionData.mainMatrix;
      }
      if (matrixLike.mainMatrix) return matrixLike.mainMatrix;
      if (matrixLike.projectionMatrix) return matrixLike.projectionMatrix;
      return null;
    }

    function projectMercatorCoordinate(merc, matrixLike = aircraftProjectionMatrix) {
      const matrix = extractProjectionMatrix(matrixLike);
      if (!matrix) return null;

      const x = merc.x;
      const y = merc.y;
      const z = merc.z ?? 0;
      const w0 = 1;

      const clipX = matrix[0] * x + matrix[4] * y + matrix[8]  * z + matrix[12] * w0;
      const clipY = matrix[1] * x + matrix[5] * y + matrix[9]  * z + matrix[13] * w0;
      const clipW = matrix[3] * x + matrix[7] * y + matrix[11] * z + matrix[15] * w0;

      if (!Number.isFinite(clipX) || !Number.isFinite(clipY) || !Number.isFinite(clipW) || Math.abs(clipW) < 1e-9) {
        return null;
      }

      const ndcX = clipX / clipW;
      const ndcY = clipY / clipW;

      const width = map.getContainer().clientWidth;
      const height = map.getContainer().clientHeight;

      return {
        x: (ndcX * 0.5 + 0.5) * width,
        y: (-ndcY * 0.5 + 0.5) * height,
        clipW
      };
    }

    function projectLngLatAltitude(longitude, latitude, altitudeMeters, matrixLike = aircraftProjectionMatrix) {
      const merc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: Number(longitude), lat: Number(latitude) },
        Number(altitudeMeters)
      );
      return projectMercatorCoordinate(merc, matrixLike);
    }

    function updateAircraftMarkerVisuals(matrixLike = aircraftProjectionMatrix) {
      if (!aircraftMarker) return;
      const el = aircraftMarker.getElement();
      const symbolTilt = el.querySelector(".aircraft-symbol-tilt");
      const symbol = el.querySelector(".aircraft-symbol");
      const stem = el.querySelector(".aircraft-altitude-stem");
      const card = el.querySelector(".aircraft-altitude-card");
      const ground = el.querySelector(".aircraft-ground-anchor");
      const mslValue = el.querySelector(".aircraft-msl-value");
      const aglValue = el.querySelector(".aircraft-agl-value");
      if (!symbolTilt || !symbol || !stem || !card || !ground || !mslValue || !aglValue) return;

      mslValue.textContent = formatFeetValue(aircraft.altitudeMslFeet);
      aglValue.textContent = formatFeetValue(aircraftAglFeet());

      const terrainMeters = terrainElevationMeters(aircraft.latitude, aircraft.longitude);
      const aircraftMetersMsl = feetToMeters(aircraft.altitudeMslFeet);

      const groundPoint = terrainMeters == null
        ? null
        : projectLngLatAltitude(aircraft.longitude, aircraft.latitude, terrainMeters, matrixLike);

      const aircraftPoint = projectLngLatAltitude(
        aircraft.longitude,
        aircraft.latitude,
        aircraftMetersMsl,
        matrixLike
      );

      // If DEM or projection data is not ready yet, keep the card visible
      // but do not invent a pillar length.
      if (!groundPoint || !aircraftPoint) {
        el.style.height = "52px";
        symbolTilt.style.left = "50%";
        symbolTilt.style.bottom = "0px";
        symbolTilt.style.transform =
          `translateX(-50%) perspective(420px) rotateX(${map.getPitch()}deg)`;
        symbol.style.transform = `rotate(${aircraftScreenRotation()}deg)`;
        stem.style.opacity = "0";
        stem.style.height = "0px";
        ground.style.opacity = "0";
        card.style.opacity = "1";
        card.style.left = "calc(50% + 18px)";
        card.style.bottom = "18px";
        return;
      }

      const dx = aircraftPoint.x - groundPoint.x;
      const dy = groundPoint.y - aircraftPoint.y;
      const distancePx = Math.sqrt(dx * dx + dy * dy);
      const angleDeg = Math.atan2(dx, dy) * 180 / Math.PI;

      const clampedBottom = Math.max(0, dy);
      const visible = distancePx >= 1;

      el.style.height = `${Math.max(52, 48 + clampedBottom)}px`;

      symbolTilt.style.left = `calc(50% + ${dx}px)`;
      symbolTilt.style.bottom = `${clampedBottom}px`;

      // The aircraft icon represents a horizontal aircraft body.
      // As map pitch increases (lower viewing angle), visually tilt the icon
      // away from the viewer while preserving heading rotation independently.
      const pitch = map.getPitch();
      symbolTilt.style.transform =
        `translateX(-50%) perspective(420px) rotateX(${pitch}deg)`;
      symbol.style.transform = `rotate(${aircraftScreenRotation()}deg)`;

      stem.style.height = `${Math.max(0, distancePx - 10)}px`;
      stem.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;
      stem.style.opacity = visible ? "0.96" : "0";

      ground.style.opacity = visible ? "1" : "0";

      card.style.opacity = "1";
      card.style.left = `calc(50% + ${dx + 18}px)`;
      card.style.bottom = `${visible ? Math.max(18, clampedBottom * 0.58) : 18}px`;
    }

    function updateAircraftMarkerRotation() {
      updateAircraftMarkerVisuals();
    }

    function ensureAircraftProjectionLayer() {
      if (map.getLayer("aircraft-overlay-sync")) return;

      map.addLayer({
        id: "aircraft-overlay-sync",
        type: "custom",
        renderingMode: "3d",
        onAdd() {},

        render(gl, matrixLike) {
          aircraftProjectionMatrix = extractProjectionMatrix(matrixLike);
          updateAircraftMarkerVisuals(aircraftProjectionMatrix);
        }
      });
    }

    function updateCompassRotation() {
      if (!compassRotor) return;
      // Compass north needle points toward geographic north on the current screen.
      compassRotor.style.transform = `rotate(${-map.getBearing()}deg)`;
    }

    function headingUpOffset() {
      const h = map.getContainer().clientHeight;
      return [0, h / 6];
    }

    function applyNorthUpCentered({ animate = true } = {}) {
      followMode = "north";
      followSuspendedByUser = false;
      orientationBtn.classList.remove("heading-active");

      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing: 0,
        offset: [0, 0],
        duration: animate ? 500 : 0,
        essential: true
      });
    }

    function applyHeadingUp({ animate = true } = {}) {
      followMode = "heading";
      followSuspendedByUser = false;

      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing: aircraftTrueHeading(),
        pitch: map.getPitch(),
        offset: headingUpOffset(),
        duration: animate ? 500 : 0,
        essential: true
      });
    }

    function refreshFollowCamera({ animate = false } = {}) {
      if (followMode !== "heading") return;
      if (followSuspendedByUser) return;

      map.easeTo({
        center: [aircraft.longitude, aircraft.latitude],
        bearing: aircraftTrueHeading(),
        pitch: map.getPitch(),
        offset: headingUpOffset(),
        duration: animate ? 300 : 0,
        essential: true
      });
    }

    function updateAircraftPosition(
      latitude,
      longitude,
      magneticHeading = aircraft.magneticHeading,
      altitudeMslFeet = aircraft.altitudeMslFeet
    ) {
      aircraft.latitude = Number(latitude);
      aircraft.longitude = Number(longitude);
      aircraft.magneticHeading = Number(magneticHeading);
      aircraft.altitudeMslFeet = Number(altitudeMslFeet);

      if (aircraftMarker) {
        aircraftMarker.setLngLat([aircraft.longitude, aircraft.latitude]);
      }

      updateAircraftMarkerVisuals();

      // In heading-up mode the map continuously follows ownship.
      if (followMode === "heading") {
        refreshFollowCamera({ animate: false });
      }
    }

    // ===== Tracking test simulation =====
    // 100 kt for 10 sec on 150°M, then 10 sec on 330°M, repeating.
    const simulation = {
      running: false,
      speedKnots: 100,
      legSeconds: 10,
      headingsMagnetic: [150, 330],
      currentLegIndex: 0,
      legElapsedSeconds: 0,
      lastTimestamp: null,
      rafId: null
    };

    const KNOT_TO_MPS = 0.5144444444444445;

    function destinationPoint(latDeg, lonDeg, trueBearingDeg, distanceMeters) {
      const R = 6371008.8;
      const delta = distanceMeters / R;
      const theta = toRad(trueBearingDeg);

      const phi1 = toRad(latDeg);
      const lambda1 = toRad(lonDeg);

      const sinPhi1 = Math.sin(phi1);
      const cosPhi1 = Math.cos(phi1);
      const sinDelta = Math.sin(delta);
      const cosDelta = Math.cos(delta);

      const phi2 = Math.asin(
        sinPhi1 * cosDelta +
        cosPhi1 * sinDelta * Math.cos(theta)
      );

      const lambda2 = lambda1 + Math.atan2(
        Math.sin(theta) * sinDelta * cosPhi1,
        cosDelta - sinPhi1 * Math.sin(phi2)
      );

      return {
        latitude: toDeg(phi2),
        longitude: ((toDeg(lambda2) + 540) % 360) - 180
      };
    }

    function simulationStep(timestamp) {
      if (!simulation.running) return;

      if (simulation.lastTimestamp == null) {
        simulation.lastTimestamp = timestamp;
        simulation.rafId = requestAnimationFrame(simulationStep);
        return;
      }

      let dt = (timestamp - simulation.lastTimestamp) / 1000;
      simulation.lastTimestamp = timestamp;

      // Avoid huge jumps if the tab was backgrounded.
      dt = Math.max(0, Math.min(dt, 0.25));

      let remaining = dt;

      while (remaining > 0) {
        const timeLeftInLeg =
          simulation.legSeconds - simulation.legElapsedSeconds;
        const stepDt = Math.min(remaining, timeLeftInLeg);

        const magneticHeading =
          simulation.headingsMagnetic[simulation.currentLegIndex];

        // Convert current magnetic heading to true bearing using
        // declination at the aircraft's current position.
        aircraft.magneticHeading = magneticHeading;
        const trueHeading = aircraftTrueHeading();

        const distanceMeters =
          simulation.speedKnots * KNOT_TO_MPS * stepDt;

        const next = destinationPoint(
          aircraft.latitude,
          aircraft.longitude,
          trueHeading,
          distanceMeters
        );

        updateAircraftPosition(
          next.latitude,
          next.longitude,
          magneticHeading
        );

        simulation.legElapsedSeconds += stepDt;
        remaining -= stepDt;

        if (simulation.legElapsedSeconds >= simulation.legSeconds - 1e-9) {
          simulation.legElapsedSeconds = 0;
          simulation.currentLegIndex =
            (simulation.currentLegIndex + 1) %
            simulation.headingsMagnetic.length;
        }
      }

      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function startTrackingSimulation() {
      if (simulation.running) return;
      simulation.running = true;
      simulation.lastTimestamp = null;
      simulation.rafId = requestAnimationFrame(simulationStep);
    }

    function stopTrackingSimulation() {
      simulation.running = false;
      simulation.lastTimestamp = null;
      if (simulation.rafId != null) {
        cancelAnimationFrame(simulation.rafId);
        simulation.rafId = null;
      }
    }

    function createAircraftMarker() {
      const el = document.createElement("div");
      el.className = "aircraft-marker";
      el.innerHTML = `
        <div class="aircraft-altitude-stem"></div>
        <div class="aircraft-ground-anchor"></div>
        <div class="aircraft-altitude-card" aria-label="항공기 고도 정보">
          <div class="aircraft-alt-row">
            <span class="aircraft-alt-k">MSL</span>
            <span class="aircraft-alt-v aircraft-msl-value">3,000 ft</span>
          </div>
          <div class="aircraft-alt-row">
            <span class="aircraft-alt-k">AGL</span>
            <span class="aircraft-alt-v aircraft-agl-value">---</span>
          </div>
        </div>
        <div class="aircraft-symbol-tilt">
          <svg class="aircraft-symbol" viewBox="0 0 48 48" aria-label="항공기 현재 위치">
            <path d="M24 4 L42 40 L24 31 L6 40 Z"
                  fill="#ffffff"
                  stroke="#10233d"
                  stroke-width="2"
                  stroke-linejoin="round"/>
            <path d="M24 4 L24 31"
                  stroke="#2b6dcc"
                  stroke-width="2"
                  stroke-linecap="round"/>
            <path d="M24 31 L17 36"
                  stroke="#2b6dcc"
                  stroke-width="1.7"
                  stroke-linecap="round"/>
          </svg>
        </div>`;

      aircraftMarker = new maplibregl.Marker({
        element: el,
        anchor: "bottom"
      })
      .setLngLat([aircraft.longitude, aircraft.latitude])
      .addTo(map);

      updateAircraftMarkerVisuals();
    }

    let route = [];
    let pointMarkers = [];
    let legMarkers = [];
    let selectedPointId = null;
    let nextPointId = 1;

    let routeModeActive = false;
    let sameOriginDestination = false;

    let dragState = {
      active: false,
      segmentIndex: -1,
      currentLngLat: null
    };

    let suppressNextRouteDrag = false;
    let pointPointerActive = false;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLat(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "N" : "S"}`;
    }

    function formatLon(v) {
      return `${Math.abs(v).toFixed(5)}°${v >= 0 ? "E" : "W"}`;
    }

    function gcDistanceMeters(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dp = toRad(b.latitude - a.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const h =
        Math.sin(dp/2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;

      return R_EARTH_M * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    }

    function trueBearing(a, b) {
      const p1 = toRad(a.latitude);
      const p2 = toRad(b.latitude);
      const dl = toRad(b.longitude - a.longitude);

      const y = Math.sin(dl) * Math.cos(p2);
      const x =
        Math.cos(p1) * Math.sin(p2) -
        Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

      return norm(toDeg(Math.atan2(y, x)));
    }

    function declination(lat, lon) {
      if (!magvarFn) return null;
      return magvarFn(lat, lon, 0, new Date());
    }

    function terrainElevationMeters(latitude, longitude) {
      if (!terrainReady) return null;
      if (typeof map.queryTerrainElevation !== "function") return null;

      const elevation = map.queryTerrainElevation(
        [Number(longitude), Number(latitude)],
        { exaggerated: false }
      );

      return Number.isFinite(elevation) ? elevation : null;
    }

    function legData(a, b) {
      const midLat = (a.latitude + b.latitude) / 2;
      const midLon = (a.longitude + b.longitude) / 2;
      const distanceNM = gcDistanceMeters(a, b) / M_PER_NM;

      if (distanceNM < 0.00001) {
        return {
          distanceNM: 0,
          bearingTrue: 0,
          declination: declination(midLat, midLon),
          bearingMagnetic: 0,
          midpoint: { latitude: midLat, longitude: midLon }
        };
      }

      const d = declination(midLat, midLon);
      const t = trueBearing(a, b);

      return {
        distanceNM,
        bearingTrue: t,
        declination: d,
        bearingMagnetic: d == null ? null : norm(t - d),
        midpoint: { latitude: midLat, longitude: midLon }
      };
    }

    function pointLabel(index) {
      if (index === 0) return "출발";
      if (index === route.length - 1 && route.length > 1) return "도착";
      return String(index);
    }

    function displayPointName(point, index) {
      const name = (point.name || "").trim();
      if (name) return name;
      if (index === 0) return "출발포인트";
      if (index === route.length - 1 && route.length > 1) return "도착포인트";
      return `포인트 ${index}`;
    }

    function createMiniLeg(leg) {
      const wrap = document.createElement("div");
      wrap.className = "route-leg-mini";

      const distance = document.createElement("div");
      distance.className = "route-leg-distance";
      distance.textContent = `${leg.distanceNM.toFixed(1)} NM`;

      const line = document.createElement("div");
      line.className = "route-leg-line";

      const bearing = document.createElement("div");
      bearing.className = "route-leg-bearing";
      bearing.textContent = leg.bearingMagnetic == null
        ? "MAG ERR"
        : `${String(Math.round(leg.bearingMagnetic)).padStart(3, "0")}°M`;

      wrap.appendChild(distance);
      wrap.appendChild(line);
      wrap.appendChild(bearing);
      return wrap;
    }

    function createMiniNode(point, index) {
      const el = document.createElement("div");
      el.className = "route-node-card";
      el.textContent = displayPointName(point, index);
      el.title = displayPointName(point, index);
      return el;
    }

    function updateRouteInfo({ autoOpen = false } = {}) {
      if (!routeModeActive) {
        routeInfoShell.classList.add("hidden");
        newRouteShell.classList.remove("hidden");
        return;
      }

      newRouteShell.classList.add("hidden");
      routeInfoShell.classList.remove("hidden");

      if (autoOpen) routeInfoShell.classList.remove("collapsed");

      routeFromName.textContent = route.length >= 1
        ? displayPointName(route[0], 0)
        : "출발지 지정";

      routeToName.textContent = route.length >= 2
        ? displayPointName(route[route.length - 1], route.length - 1)
        : "도착지 지정";

      routeStrip.innerHTML = "";

      const track = document.createElement("div");
      track.className = "route-strip-inner";
      routeStrip.appendChild(track);

      let totalNM = 0;

      if (route.length >= 2) {
        for (let i = 0; i < route.length - 1; i++) {
          const leg = legData(route[i], route[i + 1]);
          totalNM += leg.distanceNM;
          track.appendChild(createMiniLeg(leg));

          if (i + 1 < route.length - 1) {
            track.appendChild(createMiniNode(route[i + 1], i + 1));
          }
        }
      }

      routeTotalNm.textContent = totalNM.toFixed(2);

      requestAnimationFrame(() => {
        if (track.scrollWidth <= routeStrip.clientWidth) {
          routeStrip.scrollLeft = 0;
        }
      });
    }

    routeInfoTab.addEventListener("click", () => {
      if (!routeModeActive) return;

      // New Route를 눌렀지만 아직 아무 포인트도 지정하지 않은 상태라면
      // Route Info 탭을 숨길 때 루트 편집 모드를 취소하고
      // 다시 + New Route 상태로 복귀한다.
      if (route.length === 0) {
        resetRoute(true);
        return;
      }

      routeInfoShell.classList.toggle("collapsed");
    });

    newRouteBtn.addEventListener("click", () => {
      routeModeActive = true;
      sameOriginDestination = false;
      routeInfoShell.classList.remove("collapsed");
      updateRouteInfo({ autoOpen: true });
    });

    routeDeleteBtn.addEventListener("click", () => {
      resetRoute(true);
    });

    function clearPointMarkers() {
      pointMarkers.forEach(m => m.remove());
      pointMarkers = [];
    }

    function clearLegMarkers() {
      legMarkers.forEach(m => m.remove());
      legMarkers = [];
    }

    function ensureRouteLayers() {
      if (!map.getSource("route-source")) {
        map.addSource("route-source", {
          type: "geojson",
          data: {
            type: "Feature",
            properties: {},
            geometry: { type: "LineString", coordinates: [] }
          }
        });

        map.addLayer({
          id: "route-line",
          type: "line",
          source: "route-source",
          paint: {
            "line-color": "#ffffff",
            "line-width": 2.5,
            "line-opacity": 0.96
          }
        });

        // wide transparent hit area used for route dragging
        map.addLayer({
          id: "route-hit",
          type: "line",
          source: "route-source",
          paint: {
            "line-color": "#ffffff",
            "line-width": 18,
            "line-opacity": 0.01
          }
        });
      }

      if (!map.getSource("route-preview-source")) {
        map.addSource("route-preview-source", {
          type: "geojson",

            type: "Feature",

          }
        });

        map.addLayer({
          id: "route-preview",
          type: "line",
          source: "route-preview-source",
          paint: {
            "line-color": "#ffffff",
            "line-width": 2,
            "line-dasharray": [2, 2],
            "line-opacity": 0.75
          }

    function updateRouteSource() {
      const src = map.getSource("route-source");
      if (!src) return;

      src.setData({
        type: "Feature",
        properties: {},
        geometry: {
          type: "LineString",
          coordinates: route.map(p => [p.longitude, p.latitude])
        }
      });
    }

    function setPreview(coords) {
      const src = map.getSource("route-preview-source");
      if (!src) return;

      src.setData({
        type: "Feature",
        properties: {},
        geometry: {
          type: "LineString",
          coordinates: coords
        }
      });
    }

    function createPointMarker(point, index) {
      const wrap = document.createElement("div");
      wrap.className = "route-point-wrap";

      const dot = document.createElement("div");
      dot.className = "route-point-dot";
      dot.textContent = pointLabel(index);

      const coords = document.createElement("div");
      coords.className = "route-point-coords";

      const nameHtml = point.name
        ? `<span class="route-point-name">${escapeHtml(point.name)}</span>`
        : "";

      coords.innerHTML =
        `${nameHtml}${formatLat(point.latitude)}<br>${formatLon(point.longitude)}`;

      wrap.appendChild(dot);
      wrap.appendChild(coords);

      // Marker drag has priority over route-line drag.
      // We set a synchronous guard on pointerdown without stopping propagation,
      // so MapLibre Marker can still start its native draggable behavior.
      let markerWasDragged = false;

      wrap.addEventListener("pointerdown", () => {
        pointPointerActive = true;
        suppressNextRouteDrag = true;
      });

      const marker = new maplibregl.Marker({
        element: wrap,
        anchor: "left",
        offset: [-12, 0],
        draggable: true
      })
      .setLngLat([point.longitude, point.latitude])
      .addTo(map);

      function updatePointDragPreview() {
        const currentIndex = route.findIndex(p => p.id === point.id);
        if (currentIndex < 0) {
          setPreview([]);
          return;
        }

        const ll = marker.getLngLat();
        const previewCoords = [];

        // Show only the temporary route segments connected to the moving point.
        // This mirrors the dashed preview used when creating a new VIA point.
        if (currentIndex > 0) {
          const prev = route[currentIndex - 1];
          previewCoords.push([prev.longitude, prev.latitude]);
        }

        previewCoords.push([ll.lng, ll.lat]);

        if (currentIndex < route.length - 1) {
          const next = route[currentIndex + 1];
          previewCoords.push([next.longitude, next.latitude]);
        }

        // For same-origin/destination mode, keep the preview meaningful
        // when either coincident endpoint is dragged.
        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0 && route.length > 2) {
            const next = route[1];
            setPreview([
              [ll.lng, ll.lat],
              [next.longitude, next.latitude]
            ]);
            return;
          }

          if (currentIndex === route.length - 1 && route.length > 2) {
            const prev = route[route.length - 2];
            setPreview([
              [prev.longitude, prev.latitude],
              [ll.lng, ll.lat]
            ]);
            return;
          }
        }

        setPreview(previewCoords);
      }

      marker.on("dragstart", () => {
        markerWasDragged = true;
        pointPointerActive = true;
        suppressNextRouteDrag = true;
        closePointPopup();
        map.dragPan.disable();
        updatePointDragPreview();
      });

      marker.on("drag", () => {
        updatePointDragPreview();
      });

      marker.on("dragend", () => {
        const ll = marker.getLngLat();
        const currentIndex = route.findIndex(p => p.id === point.id);
        const target = route[currentIndex];

        map.dragPan.enable();

        if (!target) {
          setPreview([]);
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
          return;
        }

        target.longitude = ll.lng;
        target.latitude = ll.lat;

        if (sameOriginDestination && route.length >= 2) {
          if (currentIndex === 0) {
            route[route.length - 1].longitude = ll.lng;
            route[route.length - 1].latitude = ll.lat;
          } else if (currentIndex === route.length - 1) {
            route[0].longitude = ll.lng;
            route[0].latitude = ll.lat;
          }
        }

        setPreview([]);
        renderRoute();

        // Browsers may emit a click immediately after dragend.
        // Keep the guard through that click cycle.
        setTimeout(() => {
          markerWasDragged = false;
          pointPointerActive = false;
          suppressNextRouteDrag = false;
        }, 0);
      });

      wrap.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();

        if (markerWasDragged) return;
        openPointPopup(point.id, wrap);
      });

      pointMarkers.push(marker);
    }

    function createLegMarker(a, b) {
      const leg = legData(a, b);

      const el = document.createElement("div");
      el.className = "leg-label";
      el.innerHTML = leg.bearingMagnetic == null
        ? `${leg.distanceNM.toFixed(2)} NM<br>MAG ERR`
        : `${leg.distanceNM.toFixed(2)} NM<br>${String(Math.round(leg.bearingMagnetic)).padStart(3,"0")}°M`;

      const marker = new maplibregl.Marker({
        element: el,
        anchor: "bottom",
        offset: [0, -6]
      })
      .setLngLat([leg.midpoint.longitude, leg.midpoint.latitude])
      .addTo(map);

      legMarkers.push(marker);
    }

    function renderRoute(options = {}) {
      ensureRouteLayers();
      updateRouteSource();

      clearPointMarkers();
      clearLegMarkers();

      route.forEach((p, i) => createPointMarker(p, i));

      for (let i = 0; i < route.length - 1; i++) {
        createLegMarker(route[i], route[i+1]);
      }

      updateRouteInfo(options);
    }

    function resetRoute(deactivate = false) {
      route = [];
      clearPointMarkers();
      clearLegMarkers();
      updateRouteSource();
      setPreview([]);
      closePointPopup();
      sameOriginDestination = false;

      if (deactivate) {
        routeModeActive = false;
        routeInfoShell.classList.add("hidden");
        routeInfoShell.classList.remove("collapsed");
        newRouteShell.classList.remove("hidden");
      } else {
        renderRoute();
      }
    }

    function addInitialPoint(lngLat) {
      route.push({
        id: nextPointId++,
        name: "",
        longitude: lngLat.lng,
        latitude: lngLat.lat
      });

      renderRoute({
        autoOpen: route.length === 2
      });
    }

    function nearestSegmentIndex(point) {
      const pt = map.project(point);
      let bestIdx = -1;
      let bestDist = Infinity;

      for (let i = 0; i < route.length - 1; i++) {
        const a = map.project([route[i].longitude, route[i].latitude]);
        const b = map.project([route[i+1].longitude, route[i+1].latitude]);

        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = pt.x - a.x, apy = pt.y - a.y;
        const ab2 = abx*abx + aby*aby || 1;
        let t = (apx*abx + apy*aby) / ab2;
        t = Math.max(0, Math.min(1, t));

        const qx = a.x + t*abx;
        const qy = a.y + t*aby;
        const dx = pt.x - qx;
        const dy = pt.y - qy;
        const dist = Math.hypot(dx, dy);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function openPointPopup(pointId, markerElement) {
      selectedPointId = pointId;
      const point = route.find(p => p.id === pointId);
      if (!point) return;

      const index = route.findIndex(p => p.id === pointId);
      popupTitle.textContent = `${displayPointName(point, index)} 설정`;
      pointNameInput.value = point.name || "";
      samePointBtn.hidden = !(route.length === 1 && index === 0);

      const rect = markerElement.getBoundingClientRect();
      const popupWidth = 240;
      const left = Math.min(
        Math.max(10, rect.right + 8),
        window.innerWidth - popupWidth - 10
      );
      const top = Math.min(
        Math.max(10, rect.top - 10),
        window.innerHeight - 180
      );

      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      popup.hidden = false;
    }

    function closePointPopup() {
      popup.hidden = true;
      selectedPointId = null;
    }

    popupClose.addEventListener("click", closePointPopup);

    popupSave.addEventListener("click", () => {
      if (selectedPointId == null) return;
      const point = route.find(p => p.id === selectedPointId);
      if (!point) return;

      point.name = pointNameInput.value.trim();
      closePointPopup();

      // Re-render so the saved name appears immediately above coordinates.
      renderRoute();
    });

    popupDelete.addEventListener("click", () => {
      if (selectedPointId == null) return;

      const idx = route.findIndex(p => p.id === selectedPointId);
      if (idx < 0) return;

      route.splice(idx, 1);
      closePointPopup();
      sameOriginDestination = false;
      renderRoute();
    });

    samePointBtn.addEventListener("click", () => {
      if (route.length !== 1) return;

      const start = route[0];

      route.push({
        id: nextPointId++,
        name: "",
        longitude: start.longitude,
        latitude: start.latitude
      });

      sameOriginDestination = true;
      closePointPopup();
      renderRoute({ autoOpen: true });
    });

    document.addEventListener("pointerdown", (ev) => {
      if (!popup.hidden && !popup.contains(ev.target)) {
        closePointPopup();
      }
    });

    document.addEventListener("pointerup", () => {
      // If no marker drag is active, release the marker-vs-route guard
      // after the current event cycle. This prevents stale suppression.
      setTimeout(() => {
        if (!dragState.active) {
          pointPointerActive = false;
          suppressNextRouteDrag = false;
        }
      }, 0);
    });

    document.addEventListener("pointercancel", () => {
      pointPointerActive = false;
      suppressNextRouteDrag = false;
    });

    locateAircraftBtn.addEventListener("click", () => {
      // If the pilot manually panned away while heading-up was active,
      // one tap immediately resumes heading-up ownship tracking.
      if (followMode === "heading" && followSuspendedByUser) {
        applyHeadingUp();
        return;
      }

      // Otherwise preserve the requested alternating behavior:
      // click 1 => heading-up follow mode
      // click 2 => aircraft centered + north-up
      if (locateToggle % 2 === 0) {
        applyHeadingUp();
      } else {
        applyNorthUpCentered();
      }
      locateToggle += 1;
    });

    orientationBtn.addEventListener("click", () => {
      // Compass button has one job only: true north up.
      followMode = "north";
      map.easeTo({
        bearing: 0,
        duration: 450,
        essential: true
      });
    });

    map.on("rotate", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("move", () => {
      updateAircraftMarkerVisuals();
      updateCompassRotation();
    });

    map.on("zoom", () => {
      updateAircraftMarkerVisuals();
    });

    map.on("terrain", () => {
      updateAircraftMarkerVisuals();
    });

    map.on("idle", () => {
      updateAircraftMarkerVisuals();
    });

    // In heading-up mode, a deliberate user pan releases the camera from
    // automatic ownship tracking, while preserving the current map bearing.
    // This lets the pilot inspect nearby areas without fighting the tracker.
    map.on("dragstart", () => {
      if (followMode === "heading") {
        followSuspendedByUser = true;
      }
    });

    // Pitch / viewing-angle changes must NOT cancel heading-up tracking.
    // Keep ownship locked to the lower 1/3 while only the camera pitch changes.
    map.on("pitchstart", () => {
      // Intentionally do not suspend follow.
    });

    map.on("pitch", () => {
      updateAircraftMarkerVisuals();
      if (followMode === "heading" && !followSuspendedByUser) {
        refreshFollowCamera({ animate: false });
      }
    });

    map.on("pitchend", () => {
      updateAircraftMarkerVisuals();
      if (followMode === "heading" && !followSuspendedByUser) {
        refreshFollowCamera({ animate: false });
      }
    });

    map.on("load", () => {
      terrainReady = true;

      ensureRouteLayers();
      ensureAircraftProjectionLayer();
      createAircraftMarker();
      updateCompassRotation();
      startTrackingSimulation();
      renderRoute();

      // Diagnostic only. This value is DEM ground elevation in meters MSL,
      // not aircraft altitude and not a terrain-clearance decision.
      setTimeout(() => {
        const elevation = terrainElevationMeters(
          aircraft.latitude,
          aircraft.longitude
        );
        console.log(
          "3D terrain enabled. DEM ground elevation at ownship:",
          elevation == null ? "not loaded yet" : `${elevation.toFixed(1)} m MSL`
        );
        updateAircraftMarkerVisuals();
      }, 1200);

      map.on("mouseenter", "route-hit", () => {
        map.getCanvas().style.cursor = "grab";
      });

      map.on("mouseleave", "route-hit", () => {
        if (!dragState.active) map.getCanvas().style.cursor = "";
      });

      map.on("mousedown", "route-hit", (e) => {
        if (!routeModeActive) return;
        if (route.length < 2) return;

        // If this press began on a point marker, never enter route-line drag mode.
        // Do not clear the guard here; marker dragend/click cycle owns cleanup.
        if (pointPointerActive || suppressNextRouteDrag) {
          return;
        }

        e.preventDefault();
        closePointPopup();

        dragState.active = true;
        dragState.segmentIndex = nearestSegmentIndex(e.lngLat);
        dragState.currentLngLat = e.lngLat;

        map.dragPan.disable();
        map.getCanvas().style.cursor = "grabbing";
        dragHint.classList.add("show");

        const i = dragState.segmentIndex;
        const a = route[i];
        const b = route[i+1];

        setPreview([
          [a.longitude, a.latitude],
          [e.lngLat.lng, e.lngLat.lat],
          [b.longitude, b.latitude]
        ]);
      });

      map.on("mousemove", (e) => {
        if (!dragState.active) return;

        dragState.currentLngLat = e.lngLat;
        const i = dragState.segmentIndex;
        const a = route[i];
        const b = route[i+1];

        setPreview([
          [a.longitude, a.latitude],
          [e.lngLat.lng, e.lngLat.lat],
          [b.longitude, b.latitude]
        ]);
      });

      map.on("mouseup", (e) => {
        if (!dragState.active) return;

        // A point drag must never create a VIA point.
        if (pointPointerActive || suppressNextRouteDrag) {
          dragState.active = false;
          dragState.segmentIndex = -1;
          dragState.currentLngLat = null;
          setPreview([]);
          map.dragPan.enable();
          map.getCanvas().style.cursor = "";
          dragHint.classList.remove("show");
          return;
        }

        const i = dragState.segmentIndex;
        const p = dragState.currentLngLat || e.lngLat;

        route.splice(i + 1, 0, {
          id: nextPointId++,
          name: "",
          longitude: p.lng,
          latitude: p.lat
        });

        dragState.active = false;
        dragState.segmentIndex = -1;
        dragState.currentLngLat = null;

        setPreview([]);
        map.dragPan.enable();
        map.getCanvas().style.cursor = "";
        dragHint.classList.remove("show");

        renderRoute();
      });

      map.on("click", (e) => {
        if (dragState.active) return;
        if (!routeModeActive) return;

        const features = map.queryRenderedFeatures(e.point, {
          layers: ["route-hit"]
        });

        if (features.length > 0 && route.length >= 2) return;

        if (route.length < 2) {
          addInitialPoint(e.lngLat);
          return;
        }

        if (sameOriginDestination) {
          route.splice(route.length - 1, 0, {
            id: nextPointId++,
            name: "",
            longitude: e.lngLat.lng,
            latitude: e.lngLat.lat
          });
          renderRoute();
          return;
        }

        // Normal route already has departure/destination:
        // ordinary map click intentionally does nothing.
      });
    });

    window.movingMap = {
      map,

      getRoute() {
        return JSON.parse(JSON.stringify(route));
      },

      clearRoute() {
        resetRoute(true);
      },

      startNewRoute() {
        routeModeActive = true;
        sameOriginDestination = false;
        updateRouteInfo({ autoOpen: true });
      },

      getAircraft() {
        return {
          ...aircraft,
          terrainMslFeet: aircraftTerrainMslFeet(),
          aglFeet: aircraftAglFeet(),
          magneticDeclination: aircraftDeclination(),
          trueHeading: aircraftTrueHeading(),
          followMode,
          followSuspendedByUser
        };
      },

      updateAircraft(
        latitude,
        longitude,
        magneticHeading = aircraft.magneticHeading,
        altitudeMslFeet = aircraft.altitudeMslFeet
      ) {
        updateAircraftPosition(latitude, longitude, magneticHeading, altitudeMslFeet);
      },

      setAircraftAltitudeMsl(altitudeMslFeet) {
        aircraft.altitudeMslFeet = Number(altitudeMslFeet);
        updateAircraftMarkerVisuals();
      },

      headingUp() {
        applyHeadingUp();
      },

      northUpCentered() {
        applyNorthUpCentered();
      },

      resumeAircraftFollow() {
        applyHeadingUp();
      },

      startTrackingSimulation() {
        startTrackingSimulation();
      },

      stopTrackingSimulation() {
        stopTrackingSimulation();
      },

      getSimulationState() {
        return {
          running: simulation.running,
          speedKnots: simulation.speedKnots,
          legSeconds: simulation.legSeconds,
          currentMagneticHeading:
            simulation.headingsMagnetic[simulation.currentLegIndex],
          legElapsedSeconds: simulation.legElapsedSeconds
        };
      },

      getTerrainElevation(latitude, longitude) {
        return terrainElevationMeters(latitude, longitude);
      },

      getTerrainStatus() {
        return {
          enabled: terrainReady,
          source: "Mapterhorn raster-dem",
          exaggeration: 1,
          operationalUse: false
        };
      }
    };
  })();
  </script>
</body>
